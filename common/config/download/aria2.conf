# 构建阶段的 HTTP(S) 下载配置，由公共下载入口显式读取。

# 单个服务器最多并发 16 个连接，兼容标准 aria2。
max-connection-per-server=16
# 单个文件最多分为 16 段下载。
split=16
# 最小分段大小采用标准 aria2 支持的 1 MiB 下限。
min-split-size=1M
# 分块大小采用标准 aria2 支持的 1 MiB 下限。
piece-length=1M

# 使用公开配置中的模拟 HTTP 客户端标识，不代表构建或运行系统。
# 来源：https://github.com/P3TERX/aria2.conf/blob/9cc45956ceee02d553adff67a7e296f06fd62946/aria2.conf#L167
user-agent=Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4160.0 Safari/537.36 Edg/85.0.537.0
# 下载请求只使用 IPv4，沿用参考配置的 HTTP 下载设置。
disable-ipv6=true
# 接受压缩的 HTTP 响应，沿用参考配置的 HTTP 下载设置。
http-accept-gzip=true
