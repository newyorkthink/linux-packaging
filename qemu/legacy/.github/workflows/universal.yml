name: QEMU Package CI

on:
  schedule:
    - cron: "0 0 */6 * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qemu-appimage-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging

      - name: Build compact QEMU AppImage
        shell: bash
        run: |
          echo $PATH
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils \
           bison \
           libcbor-dev \
           docutils-common \
           flex \
           gettext \
           git \
           libaio-dev \
           libaio1 \
           libbluetooth-dev \
           libbrlapi-dev \
           libbz2-dev \
           libcap-ng-dev \
           libcapstone-dev \
           libcurl4-gnutls-dev \
           libfdt-dev \
           libglib2.0-dev \
           libgtk-3-dev \
           libibverbs-dev \
           libiscsi-dev \
           libiscsi7 \
           libjpeg8-dev \
           liblzo2-dev \
           libncurses5-dev \
           libnfs* \
           libnuma-dev \
           libpciaccess-dev \
           libpciaccess0 \
           libpixman-1-0 \
           libpixman-1-dev \
           librbd-dev \
           librdmacm-dev \
           libsasl2-dev \
           libsdl2-dev \
           libseccomp-dev \
           libslirp-dev \
           libslirp0 \
           libsnappy-dev \
           libspice-protocol-dev \
           libspice-server-dev \
           libspice-server1 \
           libssh-dev \
           libusb* \
           libvde-dev \
           libvdeplug-dev \
           libvirglrenderer-dev \
           libvirglrenderer1 \
           libvte-2.91-dev \
           libxen-dev \
           libxml2-dev \
           libxml2-utils \
           libyajl-dev \
           libyajl2 \
           libzstd-dev \
           libzstd1 \
           ninja-build \
           pip \
           pkg-config \
           python3-venv \
           slirp* \
           valgrind \
           virgl-server \
           xfslibs-dev \
           xsltproc \
           zlib1g-dev \
           liburing-dev \
           libcap-ng-dev \
           libvdeplug-dev \
           libbrlapi-dev \
           librados-dev \
           librbd-dev \
           libbz2-dev \
           liblz4-dev \
           libasound2-dev \
           libepoxy-dev \
           libiconv-hook-dev \
           libunistring-dev
          wget -q "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.7/gnutls-3.7.11.tar.xz" && tar xf gnutls-3.7.11.tar.xz && cd ./gnutls-3.7.11 && ./configure && make && sudo make install && cd ..
          pkg-config --modversion gnutls
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy ; chmod a+x linuxdeploy
          wget -q "https://github.com/VHSgunzo/uruntime/releases/download/v0.3.9/uruntime-appimage-dwarfs-x86_64" -O uruntime ; chmod a+x uruntime
          sudo pip3 install meson
          wget -c -q "https://download.gnome.org/sources/glib/2.80/glib-2.80.2.tar.xz"
          tar -xf glib-2.80.2.tar.xz
          cd glib-2.80.2
          meson setup _build
          meson compile -C _build
          sudo meson install -C _build
          cd ${GITHUB_WORKSPACE}
          #git clone https://gitlab.freedesktop.org/virgl/virglrenderer.git
          #cd virglrenderer/
          #meson build
          #cd build
          #sudo ninja install
          #cd ${GITHUB_WORKSPACE}
          mkdir lucas
          mkdir -p lucas/usr/
          mkdir -p lucas/usr/lib/
          mkdir -p lucas/usr/share/
          cp -r /usr/share/mime/ lucas/usr/share/
          git clone https://gitlab.com/qemu-project/qemu.git
          cd qemu
          git submodule init
          git submodule update --recursive
          ./configure --python="$(command -v python3)" --disable-docs \
           --enable-alsa \
           --enable-gio \
           --enable-gnutls \
           --enable-gtk \
           --enable-guest-agent \
           --enable-kvm \
           --enable-libssh \
           --enable-libudev \
           --enable-libusb \
           --enable-modules \
           --enable-nettle \
           --enable-opengl \
           --enable-pa \
           --enable-pixman \
           --enable-sdl \
           --enable-slirp \
           --enable-slirp-smbd \
           --enable-spice \
           --enable-spice-protocol \
           --enable-system \
           --enable-user \
           --enable-virglrenderer \
           --enable-usb-redir \
           --prefix=${GITHUB_WORKSPACE}/lucas/usr/
          make
          make install
          cd ${GITHUB_WORKSPACE}
          cp -f AppRun ${GITHUB_WORKSPACE}/lucas/AppRun.real
          cp -f AppRun.wrapper ${GITHUB_WORKSPACE}/lucas/AppRun
          chmod +x ${GITHUB_WORKSPACE}/lucas/AppRun ${GITHUB_WORKSPACE}/lucas/AppRun.real
          cp -f qemu.desktop ${GITHUB_WORKSPACE}/lucas/
          cp -f qemu_logo_no_text.svg ${GITHUB_WORKSPACE}/lucas/
          cp -f libunionpreload.so ${GITHUB_WORKSPACE}/lucas/
          find -name 'linuxdeploy**' -type f -exec {} --appdir ${GITHUB_WORKSPACE}/lucas/ \;
          cd ${GITHUB_WORKSPACE} && cp qemu.desktop lucas/ && find lucas/ -depth -iname 'libglib-2.0.so.0' -type f -delete
          find ${GITHUB_WORKSPACE}/lucas/usr/bin/ -type f | xargs strip
          find ${GITHUB_WORKSPACE}/lucas/usr/libexec/ -type f | xargs strip
          export ARCH=x86_64
          export VERSION=git
          cd ${GITHUB_WORKSPACE}
          ./uruntime --appimage-mkdwarfs -f --set-owner 0 --set-group 0 --no-history --no-create-timestamp --compression zstd:level=22 -S26 -B8 --header uruntime -i ${GITHUB_WORKSPACE}/lucas/ -o QEMU-"$VERSION"-"$ARCH".AppImage
          mkdir -p dist
          mv QEMU-"$VERSION"-"$ARCH".AppImage dist/qemu.AppImage

      - name: Publish Latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          ## 中文

          基于 QEMU 官方上游源码构建的紧凑型 QEMU AppImage。

          - Release：`Latest`
          - Tag：`latest`
          - 文件：`qemu.AppImage`
          - 构建：沿用原有 Compiled CI 构建参数和运行时处理
          - 压缩：`uruntime` + DWARFS + `zstd:level=22`

          ## English

          Compact QEMU AppImage built from the official upstream QEMU source.

          - Release: `Latest`
          - Tag: `latest`
          - File: `qemu.AppImage`
          - Build: preserves the existing Compiled CI build options and runtime handling
          - Compression: `uruntime` + DWARFS + `zstd:level=22`
          EOF

          gh release delete latest \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag -y || true

          gh release create latest \
            dist/qemu.AppImage \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Latest" \
            --notes-file release-notes.md \
            --latest
