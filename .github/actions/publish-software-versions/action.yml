name: Publish Software Version
description: 当前 Build 成功上传 Release AppImage 后，立即只更新自己的 software_versions.json 条目。

inputs:
  software_key:
    description: software_versions.json 中当前软件的固定键。
    required: true
  version_file:
    description: 当前 Build 生成的 version.txt 路径。
    required: true
  asset_name:
    description: 当前 Build 已上传到 latest Release 的固定 AppImage 资产名。
    required: true
  artifact_dir:
    description: 当前 Build 的 AppImage 产物目录；目录中必须恰好存在一个 AppImage。
    required: true
  github_token:
    description: GitHub token。
    required: true

runs:
  using: composite
  steps:
    - name: Update own software version entry immediately
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOFTWARE_KEY: ${{ inputs.software_key }}
        VERSION_FILE: ${{ inputs.version_file }}
        ASSET_NAME: ${{ inputs.asset_name }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: |
        set -Eeuo pipefail

        [[ -n "$SOFTWARE_KEY" ]] || { echo 'software_key 不能为空。' >&2; exit 1; }
        [[ -s "$VERSION_FILE" ]] || { echo "版本文件不存在或为空：$VERSION_FILE" >&2; exit 1; }
        version="$(tr -d '\r\n' < "$VERSION_FILE")"
        [[ -n "$version" ]] || { echo "$SOFTWARE_KEY 版本为空。" >&2; exit 1; }

        shopt -s nullglob
        artifacts=("$ARTIFACT_DIR"/*.AppImage)
        shopt -u nullglob
        [[ ${#artifacts[@]} -eq 1 ]] || {
          echo "期望 $ARTIFACT_DIR 中恰好存在 1 个 AppImage，实际为 ${#artifacts[@]}。" >&2
          exit 1
        }
        local_sha256="$(sha256sum "${artifacts[0]}" | awk '{print tolower($1)}')"

        # 按 ID 读取资产时将 HTTP 404 交给上层重新定位，其他读取保留原有三次重试。
        read_release_api() (
          local endpoint="$1"
          local temp_dir attempt status max_attempts=3 asset_read=false
          shift
          if [[ "$endpoint" == "repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            max_attempts=1
            asset_read=true
          fi
          temp_dir="$(mktemp -d)" || return 1
          trap 'rm -rf -- "$temp_dir"' EXIT

          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            if LC_ALL=C gh api "$endpoint" "$@" > "$temp_dir/body" 2> "$temp_dir/error"; then
              cat "$temp_dir/error" >&2
              cat "$temp_dir/body"
              return
            else
              status=$?
            fi
            printf 'GitHub API GET /%s 失败（第 %s/%s 次，退出码 %s）\n' "${endpoint%%\?*}" "$attempt" "$max_attempts" "$status" >&2
            cat "$temp_dir/error" >&2
            if ! grep -Fq '(HTTP 404)' "$temp_dir/error"; then
              return "$status"
            fi
            # 44 仅表示本次按 ID 读取返回 404，不能据此假定锁仍有效或清单为空。
            if [[ "$asset_read" == true ]]; then
              return 44
            fi
            if (( attempt == max_attempts )); then
              return "$status"
            fi
            sleep 2
          done
        )

        # 先确认当前 Build 已上传到 latest Release 的 AppImage 与本地产物完全一致。
        release_json="$RUNNER_TEMP/latest-release.json"
        matched=false
        for attempt in $(seq 1 12); do
          read_release_api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > "$release_json"
          release_sha256="$(python3 - "$release_json" "$ASSET_NAME" <<'PY'
        import json, re, sys
        path, asset_name = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        rows = [a for a in data.get('assets', []) if a.get('name') == asset_name]
        if len(rows) != 1:
            raise SystemExit(0)
        digest = rows[0].get('digest') or ''
        if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
            print(digest.split(':', 1)[1].lower())
        PY
        )"
          if [[ "$release_sha256" == "$local_sha256" ]]; then
            matched=true
            break
          fi
          sleep 5
        done
        [[ "$matched" == true ]] || {
          echo "$ASSET_NAME 的 GitHub Release digest 与当前 Build AppImage SHA256 不一致，禁止写入版本清单。" >&2
          exit 1
        }

        manifest_name='software_versions.json'
        workdir="$RUNNER_TEMP/software-versions-$SOFTWARE_KEY"
        manifest="$workdir/$manifest_name"
        verified_manifest="$workdir/verified-$manifest_name"
        lock_name='software_versions.json.lock'
        lock_file="$workdir/$lock_name"
        lock_upload_error="$workdir/lock-upload-error.txt"
        rm -rf "$workdir"
        mkdir -p "$workdir"
        printf '%s\n' "run=$GITHUB_RUN_ID job=$GITHUB_JOB attempt=$GITHUB_RUN_ATTEMPT" > "$lock_file"
        # matrix 共用 GITHUB_JOB，额外加入软件键和本次随机标识，不能把另一软件的锁当作自己的。
        printf '%s\n' "key=$SOFTWARE_KEY nonce=$(date +%s%N)-$$-$RANDOM" >> "$lock_file"
        lock_sha256="$(sha256sum "$lock_file" | awk '{print tolower($1)}')"

        release_info="$(python3 - "$release_json" "$GITHUB_REPOSITORY" <<'PY'
        import json, sys
        path, repo = sys.argv[1:]
        release = json.load(open(path, encoding='utf-8'))
        release_id = release.get('id')
        upload_url = (release.get('upload_url') or '').removesuffix('{?name,label}')
        expected_url = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets'
        if type(release_id) is not int or release_id <= 0 or upload_url.lower() != expected_url.lower():
            raise SystemExit('无法取得 latest Release ID 或有效的资产上传地址。')
        print(release_id, upload_url, sep='\t')
        PY
        )"
        IFS=$'\t' read -r release_id lock_upload_url <<< "$release_info"

        # 所有构建、Release 上传和当前资产校验都已完成；只在清单读改写临界区等待锁。
        lock_asset_id=''
        lock_owned=false
        cleanup_lock() {
          if [[ "$lock_owned" == true && -n "$lock_asset_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup_lock EXIT

        acquired=false
        for attempt in $(seq 1 180); do
          : > "$lock_upload_error"
          # 直接使用上传响应返回的 ID，避免依赖资产列表的可见性。
          if lock_response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$lock_file" "$lock_upload_url?name=$lock_name" \
            2>"$lock_upload_error")"; then
            lock_asset_id="$(python3 -c '
        import json, sys
        asset = json.load(sys.stdin)
        asset_id = asset.get("id")
        if type(asset_id) is not int or asset_id <= 0 or asset.get("name") != sys.argv[1] or asset.get("state") != "uploaded":
            raise SystemExit("锁上传响应未返回有效的锁资产 ID。")
        print(asset_id)
        ' "$lock_name" <<< "$lock_response")"
            lock_owned=true
            acquired=true
            break
          fi

          lock_listing="$(read_release_api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate \
            --jq ".[] | select(.name == \"$lock_name\") | [.id,.created_at] | @tsv")"
          mapfile -t lock_rows <<< "$lock_listing"
          if (( ${#lock_rows[@]} > 1 )); then
            echo "latest Release 中存在多个 $lock_name，禁止继续写入清单。" >&2
            exit 1
          fi
          if [[ -z "$lock_listing" ]]; then
            # 422 already_exists：别人刚抢到锁，列表还没刷新。
            # 404/5xx：全量并发打 uploads.github.com 时的瞬时失败，锁并不存在。
            # 这两种都继续等，不要当成“锁系统坏了”直接退出。
            sleep 2
            continue
          fi
          lock_row="${lock_rows[0]}"
          lock_id="${lock_row%%$'\t'*}"
          created_at="${lock_row#*$'\t'}"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
          now_epoch="$(date -u +%s)"
          if (( created_epoch > 0 && now_epoch - created_epoch > 300 )); then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_id" >/dev/null 2>&1 || true
          fi
          sleep 2
        done
        [[ "$acquired" == true ]] || {
          echo '短暂等待 software_versions.json 写锁超时。' >&2
          exit 1
        }

        # 每次读取独立快照并传递 API 失败，禁止把失败或短暂缺失误认为可以从空清单开始。
        read_manifest_row() {
          local rows
          rows="$(read_release_api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
            -H 'Cache-Control: no-cache' --paginate \
            --jq ".[] | select(.name == \"$manifest_name\") | [.id, (.digest // \"\")] | @tsv")" || return 1
          if [[ -z "$rows" && "${1:-false}" == true ]]; then
            return 0
          fi
          [[ -n "$rows" && "$rows" != *$'\n'* ]] || {
            echo "$manifest_name 不存在或不唯一，禁止覆盖已有清单。" >&2
            return 1
          }
          printf '%s\n' "$rows"
        }

        # 复核锁资产内容属于本次写入，防止失去锁的旧写入者继续覆盖新清单。
        require_own_lock() {
          local row digest created_epoch now_epoch remaining attempt status
          local lock_listing listed_id listed_digest
          local wait_for_visibility="${1:-false}"
          for attempt in 1 2 3 4 5; do
            printf '写锁校验：资产=%s ID=%s（第 %s/5 轮）。\n' "$lock_name" "$lock_asset_id" "$attempt" >&2
            if row="$(read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id?publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' --jq '[.digest, .created_at] | @tsv')"; then
              break
            else
              status=$?
            fi
            [[ "$status" == 44 ]] || return "$status"

            # 404 后按名称重新核对锁；发现其他锁即停止，不能凭旧 ID 继续写入。
            lock_listing="$(read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' --paginate \
              --jq ".[] | select(.name == \"$lock_name\") | [.id, (.digest // \"\")] | @tsv")" || return 1
            [[ "$lock_listing" != *$'\n'* ]] || {
              echo "latest Release 中存在多个 $lock_name，禁止继续写入清单。" >&2
              return 1
            }
            if [[ -n "$lock_listing" ]]; then
              listed_id="${lock_listing%%$'\t'*}"
              listed_digest="${lock_listing#*$'\t'}"
              if [[ "$listed_id" != "$lock_asset_id" || ( -n "$listed_digest" && "$listed_digest" != "sha256:$lock_sha256" ) ]]; then
                # 仅首次拿锁时等待上传结果与读取视图一致，期间尚未读取或修改清单。
                if [[ "$wait_for_visibility" == true ]] && (( attempt < 5 )); then
                  printf '首次写锁确认尚未一致：上传 ID=%s，列表 ID=%s（第 %s/5 轮）；等待后重新确认。\n' "$lock_asset_id" "$listed_id" "$attempt" >&2
                  sleep 2
                  continue
                fi
                echo '清单写锁已变化，禁止继续写入。' >&2
                return 1
              fi
            fi
            if (( attempt == 5 )); then
              echo '无法确认当前 Job 的清单写锁，停止写入。' >&2
              return 1
            fi
            sleep 2
          done
          digest="${row%%$'\t'*}"
          [[ "$digest" == "sha256:$lock_sha256" ]] || {
            echo '清单写锁已变化，禁止继续写入。' >&2
            return 1
          }
          # 保留原有 300 秒过期锁回收；本次上传必须在该期限前结束，避免旧写入者越过锁期限。
          created_epoch="$(date -u -d "${row#*$'\t'}" +%s)" || return 1
          now_epoch="$(date -u +%s)"
          remaining=$((created_epoch + 290 - now_epoch))
          (( remaining > 0 )) || {
            echo '清单写锁即将到期，停止旧快照写入。' >&2
            return 1
          }
          upload_timeout=$((remaining < 120 ? remaining : 120))
        }

        # 取得锁后按唯一资产 ID 下载，并在合并前核对原清单摘要及快照是否仍有效。
        snapshot_ready=false
        for snapshot_attempt in 1 2 3 4 5; do
          # 只有首次拿锁后的确认允许等待可见性，后续失锁仍立即停止。
          if (( snapshot_attempt == 1 )); then
            require_own_lock true
          else
            require_own_lock
          fi
          # 每轮按名称重新定位，404 或快照变化后不得继续下载旧 ID。
          base_row="$(read_manifest_row true)"
          if [[ -n "$base_row" ]]; then
            manifest_asset_id="${base_row%%$'\t'*}"
            base_digest="${base_row#*$'\t'}"
            [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo '原版本清单缺少有效 SHA-256，禁止合并。' >&2
              exit 1
            }
            printf '合并前读取：资产=%s ID=%s（第 %s/5 轮）。\n' "$manifest_name" "$manifest_asset_id" "$snapshot_attempt" >&2
            if read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id?publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' -H 'Accept: application/octet-stream' > "$manifest"; then
              [[ "sha256:$(sha256sum "$manifest" | awk '{print tolower($1)}')" == "$base_digest" ]] || {
                echo '原版本清单内容与资产摘要不一致，禁止用旧内容覆盖。' >&2
                exit 1
              }
              confirmed_row="$(read_manifest_row true)"
              if [[ "$confirmed_row" == "$base_row" ]]; then
                snapshot_ready=true
                break
              fi
              echo '原版本清单在读取期间已变化，禁止覆盖。' >&2
            else
              read_status=$?
              [[ "$read_status" == 44 ]] || exit "$read_status"
            fi
          else
            printf '合并前读取：资产=%s ID=未取得（第 %s/5 轮），等待重新定位。\n' "$manifest_name" "$snapshot_attempt" >&2
          fi
          if (( snapshot_attempt < 5 )); then
            sleep 2
          fi
        done
        [[ "$snapshot_ready" == true ]] || {
          echo '五轮内无法取得有效的版本清单快照，禁止合并。' >&2
          exit 1
        }
        echo "$SOFTWARE_KEY 合并清单：base_asset=$manifest_asset_id base_digest=$base_digest lock_asset=$lock_asset_id"

        python3 - "$manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        with open(path, encoding='utf-8') as f:
            data = json.load(f)
        if not isinstance(data, dict):
            raise SystemExit('software_versions.json 不是 JSON 对象')
        data[key] = {'version': version, 'asset': asset, 'sha256': sha256}
        with open(path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True)
            f.write('\n')
        PY

        manifest_sha256="$(sha256sum "$manifest" | awk '{print tolower($1)}')"
        uploaded=false
        for attempt in $(seq 1 8); do
          # 重试时允许本次 clobber 已删除旧清单，但仍拒绝覆盖其他写入者的新清单。
          allow_missing=false
          if (( attempt > 1 )); then
            allow_missing=true
          fi
          current_row="$(read_manifest_row "$allow_missing")"
          if [[ -n "$current_row" && "${current_row#*$'\t'}" == "sha256:$manifest_sha256" ]]; then
            uploaded=true
            break
          fi
          if [[ "$current_row" != "$base_row" && ( -n "$current_row" || "$allow_missing" != true ) ]]; then
            echo '清单写入前远端已变化，停止旧快照上传；交由完整性监督处理。' >&2
            exit 1
          fi
          require_own_lock
          if timeout "$upload_timeout" gh release upload latest "$manifest" --repo "$GITHUB_REPOSITORY" --clobber; then
            uploaded=true
            break
          fi
          sleep $((attempt * 2))
        done
        [[ "$uploaded" == true ]] || {
          echo "上传 $manifest_name 失败。" >&2
          exit 1
        }

        # 重新取得刚写入的唯一 Release 资产 ID，并校验 digest、内容和当前软件条目。
        verified=false
        for attempt in 1 2 3 4 5; do
          require_own_lock
          manifest_row="$(read_manifest_row true)"
          mapfile -t manifest_rows <<< "$manifest_row"
          if [[ -n "$manifest_row" ]] && (( ${#manifest_rows[@]} == 1 )); then
            manifest_asset_id="${manifest_rows[0]%%$'\t'*}"
            manifest_digest="${manifest_rows[0]#*$'\t'}"
            if [[ "$manifest_digest" == "sha256:$manifest_sha256" ]]; then
              rm -f "$verified_manifest"
              printf '上传后校验：资产=%s ID=%s（第 %s/5 轮）。\n' "$manifest_name" "$manifest_asset_id" "$attempt" >&2
              if read_release_api \
                "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id?publication_read=$(date +%s%N)" \
                -H 'Cache-Control: no-cache' -H 'Accept: application/octet-stream' > "$verified_manifest"; then
                if [[ "$(sha256sum "$verified_manifest" | awk '{print tolower($1)}')" == "$manifest_sha256" ]] && \
                  python3 - "$verified_manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        expected = {'version': version, 'asset': asset, 'sha256': sha256}
        raise SystemExit(0 if data.get(key) == expected else 1)
        PY
                then
                  verified=true
                  break
                fi
              else
                read_status=$?
                [[ "$read_status" == 44 ]] || exit "$read_status"
              fi
            fi
          fi
          if (( attempt < 5 )); then
            sleep 2
          fi
        done
        [[ "$verified" == true ]] || {
          echo "$SOFTWARE_KEY 写入 latest Release/$manifest_name 后校验失败。" >&2
          exit 1
        }

        echo "$SOFTWARE_KEY 清单校验完成：asset=$manifest_asset_id sha256=$manifest_sha256"

        gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id" >/dev/null
        lock_owned=false
        trap - EXIT

        echo "$SOFTWARE_KEY 已由当前 Build 立即更新 latest Release/$manifest_name。"
