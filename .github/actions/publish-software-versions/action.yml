name: Publish Software Version
description: 当前 Build 成功上传 Release AppImage 后，立即只更新自己的 software_versions.json 条目。

inputs:
  software_key:
    description: software_versions.json 中当前软件的固定键。
    required: true
  version_file:
    description: 当前 Build 生成的 version.txt 路径。
    required: true
  asset_name:
    description: 当前 Build 已上传到 latest Release 的固定 AppImage 资产名。
    required: true
  artifact_dir:
    description: 当前 Build 的 AppImage 产物目录；目录中必须恰好存在一个 AppImage。
    required: true
  github_token:
    description: GitHub token。
    required: true

runs:
  using: composite
  steps:
    - name: Update own software version entry immediately
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOFTWARE_KEY: ${{ inputs.software_key }}
        VERSION_FILE: ${{ inputs.version_file }}
        ASSET_NAME: ${{ inputs.asset_name }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: |
        set -Eeuo pipefail

        [[ -n "$SOFTWARE_KEY" ]] || { echo 'software_key 不能为空。' >&2; exit 1; }
        [[ -s "$VERSION_FILE" ]] || { echo "版本文件不存在或为空：$VERSION_FILE" >&2; exit 1; }
        version="$(tr -d '\r\n' < "$VERSION_FILE")"
        [[ -n "$version" ]] || { echo "$SOFTWARE_KEY 版本为空。" >&2; exit 1; }

        shopt -s nullglob
        artifacts=("$ARTIFACT_DIR"/*.AppImage)
        shopt -u nullglob
        [[ ${#artifacts[@]} -eq 1 ]] || {
          echo "期望 $ARTIFACT_DIR 中恰好存在 1 个 AppImage，实际为 ${#artifacts[@]}。" >&2
          exit 1
        }
        local_sha256="$(sha256sum "${artifacts[0]}" | awk '{print tolower($1)}')"

        lock_name='software_versions.json.lock'
        lock_file="$RUNNER_TEMP/$lock_name"
        lock_asset_id=''
        lock_owned=false
        staged_asset_id=''
        staged_promoted=false
        printf '%s\n' "run=$GITHUB_RUN_ID job=$GITHUB_JOB attempt=$GITHUB_RUN_ATTEMPT" > "$lock_file"

        cleanup() {
          if [[ "$staged_promoted" != true && -n "$staged_asset_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$staged_asset_id" >/dev/null 2>&1 || true
          fi
          if [[ "$lock_owned" == true && -n "$lock_asset_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT

        acquired=false
        for attempt in $(seq 1 180); do
          if gh release upload latest "$lock_file" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            lock_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq ".assets[] | select(.name == \"$lock_name\") | .id" | head -n 1)"
            [[ -n "$lock_asset_id" ]] || { echo '已取得版本清单锁，但无法读取锁资产 ID。' >&2; exit 1; }
            lock_owned=true
            acquired=true
            break
          fi
          lock_row="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq ".assets[] | select(.name == \"$lock_name\") | [.id,.created_at] | @tsv" | head -n 1 || true)"
          if [[ -n "$lock_row" ]]; then
            lock_id="${lock_row%%$'\t'*}"
            created_at="${lock_row#*$'\t'}"
            created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date -u +%s)"
            if (( created_epoch > 0 && now_epoch - created_epoch > 600 )); then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_id" >/dev/null 2>&1 || true
            fi
          fi
          sleep 2
        done
        [[ "$acquired" == true ]] || { echo '等待 software_versions.json 写锁超时。' >&2; exit 1; }

        release_json="$RUNNER_TEMP/latest-release.json"
        matched=false
        for attempt in $(seq 1 12); do
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > "$release_json"
          release_sha256="$(python3 - "$release_json" "$ASSET_NAME" <<'PY'
        import json, re, sys
        path, asset_name = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        rows = [a for a in data.get('assets', []) if a.get('name') == asset_name]
        if len(rows) != 1:
            raise SystemExit(0)
        digest = rows[0].get('digest') or ''
        if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
            print(digest.split(':', 1)[1].lower())
        PY
        )"
          if [[ "$release_sha256" == "$local_sha256" ]]; then
            matched=true
            break
          fi
          sleep 5
        done
        [[ "$matched" == true ]] || {
          echo "$ASSET_NAME 的 GitHub Release digest 与当前 Build AppImage SHA256 不一致，禁止写入版本清单。" >&2
          exit 1
        }

        workdir="$RUNNER_TEMP/software-versions-$SOFTWARE_KEY"
        manifest="$workdir/software_versions.json"
        verify_dir="$workdir/verify"
        rm -rf "$workdir"
        mkdir -p "$workdir" "$verify_dir"

        if gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'software_versions.json'; then
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern 'software_versions.json' --dir "$workdir" --clobber
        else
          printf '{}\n' > "$manifest"
        fi

        python3 - "$manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        with open(path, encoding='utf-8') as f:
            data = json.load(f)
        if not isinstance(data, dict):
            raise SystemExit('software_versions.json 不是 JSON 对象')
        data[key] = {'version': version, 'asset': asset, 'sha256': sha256}
        with open(path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True)
            f.write('\n')
        PY

        # 先把完整新清单作为唯一临时资产上传并校验，再切换正式名称。
        # 这样网络故障发生在上传阶段时，旧 software_versions.json 仍保持原样，不会被 --clobber 先删除。
        nonce="${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-$(date -u +%s)-$RANDOM"
        staged_name="software_versions.json.pending.$nonce"
        staged_path="$workdir/$staged_name"
        cp "$manifest" "$staged_path"
        staged_sha256="$(sha256sum "$staged_path" | awk '{print tolower($1)}')"

        gh release upload latest "$staged_path" --repo "$GITHUB_REPOSITORY"
        staged_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq ".assets[] | select(.name == \"$staged_name\") | .id" | head -n 1)"
        [[ -n "$staged_asset_id" ]] || { echo '临时版本清单已上传，但无法读取资产 ID。' >&2; exit 1; }

        staged_verify_dir="$workdir/staged-verify"
        mkdir -p "$staged_verify_dir"
        gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "$staged_name" --dir "$staged_verify_dir" --clobber
        downloaded_staged_sha256="$(sha256sum "$staged_verify_dir/$staged_name" | awk '{print tolower($1)}')"
        [[ "$downloaded_staged_sha256" == "$staged_sha256" ]] || {
          echo '临时版本清单上传后 SHA256 校验失败，保留旧正式清单。' >&2
          exit 1
        }

        release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id')"
        current_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate --jq '.[] | select(.name == "software_versions.json") | .id' | head -n 1)"
        backup_asset_id=''
        backup_name=''

        if [[ -n "$current_asset_id" ]]; then
          backup_name="software_versions.json.previous.$nonce"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$current_asset_id" -f name="$backup_name" >/dev/null
          backup_asset_id="$current_asset_id"
        fi

        if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_asset_id" -f name='software_versions.json' >/dev/null; then
          if [[ -n "$backup_asset_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$backup_asset_id" -f name='software_versions.json' >/dev/null 2>&1 || true
          fi
          echo '切换正式版本清单名称失败；已尝试恢复上一份正式清单。' >&2
          exit 1
        fi
        staged_promoted=true

        if [[ -n "$backup_asset_id" ]]; then
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$backup_asset_id" >/dev/null
        fi

        gh release download latest --repo "$GITHUB_REPOSITORY" --pattern 'software_versions.json' --dir "$verify_dir" --clobber

        python3 - "$verify_dir/software_versions.json" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        expected = {'version': version, 'asset': asset, 'sha256': sha256}
        if data.get(key) != expected:
            raise SystemExit(f'{key} 写入 software_versions.json 后校验失败')
        PY

        echo "$SOFTWARE_KEY 已由当前 Build 立即更新 software_versions.json。"
