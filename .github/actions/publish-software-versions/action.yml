name: Publish Software Versions
description: 在当前 Build AppImages run 中增量维护 software_versions.json。

inputs:
  selected_builds:
    description: Plan 选中的构建任务 JSON。
    required: true
  source_run_id:
    description: 当前 Build AppImages workflow run ID。
    required: true
  github_token:
    description: GitHub token。
    required: true

runs:
  using: composite
  steps:
    - name: Incrementally publish successful software versions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SELECTED_BUILDS: ${{ inputs.selected_builds }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        set -Eeuo pipefail

        KEYS=(adspower-global aionui alacritty alttab antigravity-ide antigravity baidunetdisk cc-switch chatgpt chromium claude-desktop copyq cursor dconf-editor deepseek-harness deskflow dingtalk escrcpy feishu folo freedownloadmanager gemini github-desktop gitkraken hermes-desktop htop i3 joplin kde-suite keepass keepassxc keyviz kitty mailmaster mission-center moderncsv mpv newsboat nvtop obs-studio obsidian parsec picom qemu rainlendar2 realvnc_connect remmina ripdrag rofi simplescreenrecorder smplayer stacher sunshine tencent-docs trae-work trae v2rayn ventoy vscode webcamoid wechat winpodx workbuddy xfreerdp3 xnconvert xnview zotero)

        declare -A PLAN_KEY JOB_NAME ASSET_NAME

        PLAN_KEY[aionui]=aionui
        PLAN_KEY[alacritty]=alacritty
        PLAN_KEY[adspower-global]=adspower_global
        PLAN_KEY[alttab]=alttab
        PLAN_KEY[antigravity-ide]=antigravity_ide
        PLAN_KEY[antigravity]=antigravity
