        JOB_NAME[zotero]='Build Zotero'

        ASSET_NAME[aionui]='aionui.AppImage'
        ASSET_NAME[alacritty]='alacritty.AppImage'
        ASSET_NAME[adspower-global]='adspower-global.AppImage'
        ASSET_NAME[alttab]='alttab.AppImage'
        ASSET_NAME[antigravity-ide]='antigravity-ide.AppImage'
        ASSET_NAME[antigravity]='antigravity.AppImage'
        ASSET_NAME[baidunetdisk]='baidunetdisk.AppImage'
        ASSET_NAME[cc-switch]='cc-switch.AppImage'
        ASSET_NAME[chatgpt]='chatgpt.AppImage'
        ASSET_NAME[chromium]='chromium.AppImage'
        ASSET_NAME[claude-desktop]='claude-desktop.AppImage'
        ASSET_NAME[copyq]='copyq.AppImage'
        ASSET_NAME[cursor]='cursor.AppImage'
        ASSET_NAME[dconf-editor]='dconf-editor.AppImage'
        ASSET_NAME[deepseek-harness]='deepseek-harness.AppImage'
        ASSET_NAME[deskflow]='deskflow.AppImage'
        ASSET_NAME[dingtalk]='dingtalk.AppImage'
        ASSET_NAME[escrcpy]='escrcpy.AppImage'
        ASSET_NAME[feishu]='feishu.AppImage'
        ASSET_NAME[folo]='folo.AppImage'
        ASSET_NAME[freedownloadmanager]='freedownloadmanager.AppImage'
        ASSET_NAME[gemini]='gemini.AppImage'
        ASSET_NAME[github-desktop]='github-desktop.AppImage'
        ASSET_NAME[gitkraken]='gitkraken.AppImage'
        ASSET_NAME[hermes-desktop]='hermes-desktop.AppImage'
        ASSET_NAME[htop]='htop.AppImage'
        ASSET_NAME[i3]='i3.AppImage'
        ASSET_NAME[joplin]='joplin.AppImage'
        ASSET_NAME[kde-suite]='kde-suite.AppImage'
        ASSET_NAME[keepass]='keepass.AppImage'
        ASSET_NAME[keepassxc]='keepassxc.AppImage'
        ASSET_NAME[keyviz]='keyviz.AppImage'
        ASSET_NAME[kitty]='kitty.AppImage'
        ASSET_NAME[mailmaster]='mailmaster.AppImage'
        ASSET_NAME[mission-center]='mission-center.AppImage'
        ASSET_NAME[moderncsv]='moderncsv.AppImage'
        ASSET_NAME[mpv]='mpv.AppImage'
        ASSET_NAME[newsboat]='newsboat.AppImage'
        ASSET_NAME[nvtop]='nvtop.AppImage'
        ASSET_NAME[obs-studio]='obs-studio.AppImage'
        ASSET_NAME[obsidian]='obsidian.AppImage'
        ASSET_NAME[parsec]='parsec.AppImage'
        ASSET_NAME[picom]='picom.AppImage'
        ASSET_NAME[qemu]='qemu.AppImage'
        ASSET_NAME[rainlendar2]='rainlendar2.AppImage'
        ASSET_NAME[realvnc_connect]='rvncconnect.AppImage'
        ASSET_NAME[remmina]='remmina.AppImage'
        ASSET_NAME[ripdrag]='ripdrag.AppImage'
        ASSET_NAME[rofi]='rofi.AppImage'
        ASSET_NAME[simplescreenrecorder]='simplescreenrecorder.AppImage'
        ASSET_NAME[smplayer]='smplayer.AppImage'
        ASSET_NAME[stacher]='stacher.AppImage'
        ASSET_NAME[sunshine]='sunshine.AppImage'
        ASSET_NAME[tencent-docs]='tencent-docs.AppImage'
        ASSET_NAME[trae-work]='trae-work.AppImage'
        ASSET_NAME[trae]='trae.AppImage'
        ASSET_NAME[v2rayn]='v2rayn.AppImage'
        ASSET_NAME[ventoy]='ventoy.AppImage'
        ASSET_NAME[vscode]='vscode.AppImage'
        ASSET_NAME[webcamoid]='webcamoid.AppImage'
        ASSET_NAME[wechat]='wechat.AppImage'
        ASSET_NAME[winpodx]='winpodx.AppImage'
        ASSET_NAME[workbuddy]='workbuddy.AppImage'
        ASSET_NAME[xfreerdp3]='xfreerdp3.AppImage'
        ASSET_NAME[xnconvert]='xnconvert.AppImage'
        ASSET_NAME[xnview]='xnviewmp.AppImage'
        ASSET_NAME[zotero]='zotero.AppImage'

        selected=()
        for key in "${KEYS[@]}"; do
          plan_key="${PLAN_KEY[$key]}"
          if [[ "$(jq -r --arg key "$plan_key" '.[$key] // "false"' <<< "$SELECTED_BUILDS")" == "true" ]]; then
            selected+=("$key")
          fi
        done

        (( ${#selected[@]} > 0 )) || exit 0

        declare -A finished
        remaining="${#selected[@]}"
        manifest="$RUNNER_TEMP/software_versions.json"
        current_dir="$RUNNER_TEMP/current-software-versions"

        rm -rf "$current_dir"
        mkdir -p "$current_dir"

        if gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'software_versions.json'; then
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern 'software_versions.json' --dir "$current_dir" --clobber
          cp "$current_dir/software_versions.json" "$manifest"
        else
          printf '{}\n' > "$manifest"
        fi

        jq -e 'type == "object"' "$manifest" >/dev/null || {
          echo "software_versions.json 不是有效 JSON 对象，停止发布。" >&2
          exit 1
        }

        while (( remaining > 0 )); do
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"

          for key in "${selected[@]}"; do
            [[ -n "${finished[$key]:-}" ]] && continue

            job_name="${JOB_NAME[$key]}"
            job_row="$(jq -c --arg name "$job_name" '.jobs[] | select(.name == $name) | {status, conclusion}' <<< "$jobs_json" | head -n 1)"
            [[ -n "$job_row" ]] || continue

            status="$(jq -r '.status // ""' <<< "$job_row")"
            [[ "$status" == "completed" ]] || continue

            conclusion="$(jq -r '.conclusion // ""' <<< "$job_row")"
            if [[ "$conclusion" != "success" ]]; then
              echo "$key 构建未成功（$conclusion），保留旧记录。"
              finished[$key]=failed
              remaining=$((remaining - 1))
              continue
            fi

            metadata_dir="$RUNNER_TEMP/software-version-$key"
            rm -rf "$metadata_dir"
            mkdir -p "$metadata_dir"

            downloaded=false
            for attempt in {1..12}; do
              if gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "software-version-$key" --dir "$metadata_dir"; then
                downloaded=true
                break
              fi
              sleep 5
            done
            [[ "$downloaded" == true ]] || {
              echo "无法下载 software-version-$key artifact。" >&2
              exit 1
            }

            version_file="$metadata_dir/version.txt"
            [[ -s "$version_file" ]] || {
              echo "$key 缺少有效 version.txt。" >&2
              exit 1
            }

            version="$(tr -d '\r\n' < "$version_file")"
            [[ -n "$version" ]] || {
              echo "$key 版本为空。" >&2
              exit 1
            }

            asset_name="${ASSET_NAME[$key]}"
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest")"
            digest="$(jq -r --arg asset "$asset_name" '[.assets[] | select(.name == $asset)] | if length == 1 then (.[0].digest // "") else "" end' <<< "$release_json")"

            [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
              echo "$asset_name 缺少有效 GitHub SHA-256 digest。" >&2
              exit 1
            }

            sha256="${digest#sha256:}"
            tmp_manifest="$RUNNER_TEMP/software_versions.tmp.json"

            # 始终基于 publisher 启动时取得并持续保留的同一份本地清单更新。
            # 某个软件成功后立即写入并上传；后续软件继续在这份已更新的本地清单上追加/覆盖。
            jq --arg key "$key" --arg version "$version" --arg asset "$asset_name" --arg sha256 "${sha256,,}" '.[$key] = {version: $version, asset: $asset, sha256: $sha256}' "$manifest" > "$tmp_manifest"
            mv "$tmp_manifest" "$manifest"

            gh release upload latest "$manifest" --repo "$GITHUB_REPOSITORY" --clobber

            echo "$key 已补入 software_versions.json。"
            finished[$key]=success
            remaining=$((remaining - 1))
          done

          (( remaining == 0 )) && break
          sleep 10
        done




