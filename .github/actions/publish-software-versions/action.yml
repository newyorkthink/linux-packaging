        JOB_NAME[claude-desktop]='Build Claude Desktop'
        JOB_NAME[copyq]='Build CopyQ'
        JOB_NAME[cursor]='Build Cursor'
        JOB_NAME[dconf-editor]='Build dconf Editor'
        JOB_NAME[deepseek-harness]='Build DeepSeek Harness'
        JOB_NAME[deskflow]='Build Deskflow'
        JOB_NAME[dingtalk]='Build DingTalk'
        JOB_NAME[escrcpy]='Build Escrcpy'
        JOB_NAME[feishu]='Build Feishu'
        JOB_NAME[folo]='Build Folo'
        JOB_NAME[freedownloadmanager]='Build Free Download Manager'
        JOB_NAME[gemini]='Build Gemini'
        JOB_NAME[github-desktop]='Build GitHub Desktop'
        JOB_NAME[gitkraken]='Build GitKraken'
        JOB_NAME[hermes-desktop]='Build Hermes Desktop'
        JOB_NAME[htop]='Build htop'
        JOB_NAME[i3]='Build i3wm'
        JOB_NAME[joplin]='Build Joplin'
        JOB_NAME[kde-suite]='Build KDE Suite'
        JOB_NAME[keepass]='Build KeePass'
        JOB_NAME[keepassxc]='Build KeePassXC'
        JOB_NAME[keyviz]='Build Keyviz'
        JOB_NAME[kitty]='Build kitty'
        JOB_NAME[mailmaster]='Build MailMaster'
        JOB_NAME[mission-center]='Build Mission Center'
        JOB_NAME[moderncsv]='Build Modern CSV'
        JOB_NAME[mpv]='Build mpv'
        JOB_NAME[newsboat]='Build Newsboat'
        JOB_NAME[nvtop]='Build nvtop'
