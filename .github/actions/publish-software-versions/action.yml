        JOB_NAME[simplescreenrecorder]='Build SimpleScreenRecorder'
        JOB_NAME[smplayer]='Build SMPlayer'
        JOB_NAME[stacher]='Build Stacher'
        JOB_NAME[sunshine]='Build Sunshine'
        JOB_NAME[tencent-docs]='Build Tencent Docs'
        JOB_NAME[trae-work]='Build TraeWork'
        JOB_NAME[trae]='Build Trae'
