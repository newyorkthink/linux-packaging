name: Publish Software Version
description: 当前 Build 成功上传 Release AppImage 后，立即只更新自己的 software_versions.json 条目。

inputs:
  software_key:
    description: software_versions.json 中当前软件的固定键。
    required: true
  version_file:
    description: 当前 Build 生成的 version.txt 路径。
    required: true
  asset_name:
    description: 当前 Build 已上传到 latest Release 的固定 AppImage 资产名。
    required: true
  artifact_dir:
    description: 当前 Build 的 AppImage 产物目录；目录中必须恰好存在一个 AppImage。
    required: true
  github_token:
    description: GitHub token。
    required: true

runs:
  using: composite
  steps:
    - name: Update own software version entry immediately
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOFTWARE_KEY: ${{ inputs.software_key }}
        VERSION_FILE: ${{ inputs.version_file }}
        ASSET_NAME: ${{ inputs.asset_name }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: |
        set -Eeuo pipefail

        [[ -n "$SOFTWARE_KEY" ]] || { echo 'software_key 不能为空。' >&2; exit 1; }
        [[ -s "$VERSION_FILE" ]] || { echo "版本文件不存在或为空：$VERSION_FILE" >&2; exit 1; }
        version="$(tr -d '\r\n' < "$VERSION_FILE")"
        [[ -n "$version" ]] || { echo "$SOFTWARE_KEY 版本为空。" >&2; exit 1; }

        shopt -s nullglob
        artifacts=("$ARTIFACT_DIR"/*.AppImage)
        shopt -u nullglob
        [[ ${#artifacts[@]} -eq 1 ]] || {
          echo "期望 $ARTIFACT_DIR 中恰好存在 1 个 AppImage，实际为 ${#artifacts[@]}。" >&2
          exit 1
        }
        local_sha256="$(sha256sum "${artifacts[0]}" | awk '{print tolower($1)}')"

        # 先确认当前 Build 已上传到 latest Release 的 AppImage 与本地产物完全一致。
        release_json="$RUNNER_TEMP/latest-release.json"
        matched=false
        for attempt in $(seq 1 12); do
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > "$release_json"
          release_sha256="$(python3 - "$release_json" "$ASSET_NAME" <<'PY'
        import json, re, sys
        path, asset_name = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        rows = [a for a in data.get('assets', []) if a.get('name') == asset_name]
        if len(rows) != 1:
            raise SystemExit(0)
        digest = rows[0].get('digest') or ''
        if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
            print(digest.split(':', 1)[1].lower())
        PY
        )"
          if [[ "$release_sha256" == "$local_sha256" ]]; then
            matched=true
            break
          fi
          sleep 5
        done
        [[ "$matched" == true ]] || {
          echo "$ASSET_NAME 的 GitHub Release digest 与当前 Build AppImage SHA256 不一致，禁止写入版本清单。" >&2
          exit 1
        }

        manifest_path='software_versions.json'
        default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
        [[ -n "$default_branch" ]] || { echo '无法取得仓库默认分支。' >&2; exit 1; }

        workdir="$RUNNER_TEMP/software-versions-$SOFTWARE_KEY"
        current_json="$workdir/current.json"
        manifest="$workdir/software_versions.json"
        payload="$workdir/payload.json"
        rm -rf "$workdir"
        mkdir -p "$workdir"

        # 每个 Build 自己立即写清单。并发冲突只重新读取最新清单、合并当前条目并重试；
        # 不等待其他 Build 完成，也不等待 all 结束。
        updated=false
        for attempt in $(seq 1 60); do
          rm -f "$current_json" "$manifest" "$payload"

          if gh api "repos/$GITHUB_REPOSITORY/contents/$manifest_path?ref=$default_branch" > "$current_json" 2>/dev/null; then
            manifest_sha="$(python3 - "$current_json" "$manifest" <<'PY'
        import base64, json, sys
        src, dst = sys.argv[1:]
        data = json.load(open(src, encoding='utf-8'))
        sha = data.get('sha') or ''
        content = (data.get('content') or '').replace('\n', '')
        if not sha or not content:
            raise SystemExit(1)
        raw = base64.b64decode(content, validate=True)
        open(dst, 'wb').write(raw)
        print(sha)
        PY
        )" || { sleep 1; continue; }
          else
            # 仅首次迁移允许从现有 latest Release 清单初始化；以后都直接更新仓库根清单。
            if gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$manifest_path"; then
              if ! gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "$manifest_path" --dir "$workdir" --clobber; then
                sleep 1
                continue
              fi
            else
              printf '{}\n' > "$manifest"
            fi
            manifest_sha=''
          fi

          python3 - "$manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        with open(path, encoding='utf-8') as f:
            data = json.load(f)
        if not isinstance(data, dict):
            raise SystemExit('software_versions.json 不是 JSON 对象')
        data[key] = {'version': version, 'asset': asset, 'sha256': sha256}
        with open(path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True)
            f.write('\n')
        PY

          python3 - "$manifest" "$payload" "$manifest_sha" "$default_branch" "$SOFTWARE_KEY" <<'PY'
        import base64, json, sys
        manifest, payload, sha, branch, key = sys.argv[1:]
        body = {
            'message': f'Update {key} software version',
            'content': base64.b64encode(open(manifest, 'rb').read()).decode('ascii'),
            'branch': branch,
        }
        if sha:
            body['sha'] = sha
        with open(payload, 'w', encoding='utf-8') as f:
            json.dump(body, f, ensure_ascii=False)
        PY

          if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$manifest_path" --input "$payload" >/dev/null 2>&1; then
            updated=true
            break
          fi

          # 典型情况是另一个 Build 刚刚先写入；立即读取新 SHA 后重新合并当前条目。
          sleep 1
        done

        [[ "$updated" == true ]] || {
          echo "$SOFTWARE_KEY 未能写入 $manifest_path。" >&2
          exit 1
        }

        # 回读默认分支上的正式清单，只确认当前 Build 自己的条目。
        verified=false
        for attempt in $(seq 1 12); do
          if gh api "repos/$GITHUB_REPOSITORY/contents/$manifest_path?ref=$default_branch" > "$current_json" 2>/dev/null; then
            if python3 - "$current_json" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import base64, json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        meta = json.load(open(path, encoding='utf-8'))
        raw = base64.b64decode((meta.get('content') or '').replace('\n', ''), validate=True)
        data = json.loads(raw.decode('utf-8'))
        expected = {'version': version, 'asset': asset, 'sha256': sha256}
        raise SystemExit(0 if data.get(key) == expected else 1)
        PY
            then
              verified=true
              break
            fi
          fi
          sleep 1
        done

        [[ "$verified" == true ]] || {
          echo "$SOFTWARE_KEY 写入 software_versions.json 后校验失败。" >&2
          exit 1
        }

        echo "$SOFTWARE_KEY 已由当前 Build 立即更新 software_versions.json。"
