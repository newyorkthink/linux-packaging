        PLAN_KEY[obsidian]=obsidian
        PLAN_KEY[parsec]=parsec
        PLAN_KEY[picom]=picom
        PLAN_KEY[qemu]=qemu
        PLAN_KEY[rainlendar2]=rainlendar2
        PLAN_KEY[realvnc_connect]=realvnc_connect
        PLAN_KEY[remmina]=remmina
