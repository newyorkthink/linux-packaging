name: Build AnyLinux AppImage
# 共享构建 Action；修改本文件时，Plan 会触发全量 AppImage 构建。
description: Prepare yay, build one AppImage, and publish it to the latest Release.

inputs:
  build_script:
    description: Repository-relative build script path.
    required: true
  artifact_dir:
    description: Repository-relative directory containing the built AppImage.
    required: true
  release_name:
    description: Fixed filename to publish to the latest Release.
    required: true
  run_from_root:
    description: Run the script from repository root instead of its own directory.
    required: false
    default: 'false'
  github_token:
    description: GitHub token used to publish the Release asset.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Yay for Root execution
      shell: bash
      run: |
        set -Eeuo pipefail
        useradd -m -G wheel builduser || true
        echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
        for attempt in 1 2 3; do
          rm -rf /tmp/yay-bin
          if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
            break
          fi
          if [[ "$attempt" -eq 3 ]]; then
            echo '无法克隆 yay-bin。' >&2
            exit 1
          fi
          sleep 5
        done
        test -f /tmp/yay-bin/PKGBUILD
        su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
        # 在统一 yay 入口处理仓库包低速超时，应用构建脚本继续使用原安装命令。
        cat > /usr/local/bin/yay <<'YAY_EOF'
        #!/bin/bash
        set -Eeuo pipefail

        # 非标准安装调用保持原有参数、环境和返回码。
        if [[ "${1:-}" != -S && "${1:-}" != --sync ]]; then
          exec sudo -HE -u builduser /usr/bin/yay "$@"
        fi

        # 仅在本次安装期间保留临时输出，退出时删除，不清理软件包缓存。
        download_log="$(mktemp "${TMPDIR:-/tmp}/yay-download.XXXXXXXX")"
        trap 'rm -f -- "$download_log"' EXIT

        for attempt in 1 2 3 4 5; do
          # 保留原有构建用户和完整参数，实时输出每次安装的日志。
          if sudo -HE -u builduser /usr/bin/yay "$@" 2>&1 | tee "$download_log"; then
            exit 0
          else
            download_status=("${PIPESTATUS[@]}")
          fi

          # 日志写入失败时保留该错误，不将其误判为下载超时。
          if (( download_status[1] != 0 )); then
            exit "${download_status[1]}"
          fi

          # 只重试仓库包下载过慢且尚未安装任何软件包的失败事务。
          if ! grep -Eq "failed retrieving file '[^']+[.]pkg[.]tar[.][^']+' from .* : Operation too slow[.]" "$download_log" ||
             ! grep -Fq 'failed to retrieve some files' "$download_log" ||
             ! grep -Fq 'Errors occurred, no packages were upgraded.' "$download_log" ||
             ! grep -Fq 'error installing repo packages' "$download_log"; then
            exit "${download_status[0]}"
          fi

          # 达到尝试上限时仍以原安装失败状态退出。
          if (( attempt == 5 )); then
            printf '仓库软件包下载过慢，已尝试 5 次，停止安装。\n' >&2
            exit "${download_status[0]}"
          fi

          # 依次等待 5、10、15、20 秒，再用原参数重试安装。
          delay=$((attempt * 5))
          printf '仓库软件包下载过慢，%d 秒后重试（第 %d/5 次尝试失败）。\n' "$delay" "$attempt" >&2
          sleep "$delay"
        done
        YAY_EOF
        chmod +x /usr/local/bin/yay

    - name: Build and publish AppImage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BUILD_SCRIPT: ${{ inputs.build_script }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        RELEASE_NAME: ${{ inputs.release_name }}
        RUN_FROM_ROOT: ${{ inputs.run_from_root }}
      run: |
        set -euo pipefail
        chmod +x "$BUILD_SCRIPT"
        SCRIPT_DIR="$(dirname "$BUILD_SCRIPT")"
        SCRIPT_NAME="$(basename "$BUILD_SCRIPT")"

        if [[ "$RUN_FROM_ROOT" == 'true' ]]; then
          "$BUILD_SCRIPT"
        else
          (
            cd "$SCRIPT_DIR"
            "./$SCRIPT_NAME"
          )
        fi

        shopt -s nullglob
        ARTIFACTS=("$ARTIFACT_DIR"/*.AppImage)
        shopt -u nullglob

        if [[ ${#ARTIFACTS[@]} -ne 1 ]]; then
          echo "期望 $ARTIFACT_DIR 中恰好有 1 个 AppImage，实际为 ${#ARTIFACTS[@]}。" >&2
          printf '%s\n' "${ARTIFACTS[@]:-}"
          exit 1
        fi

        if [[ -s "$ARTIFACT_DIR/release-name.txt" ]]; then
          RELEASE_NAME="$(tr -d '\r\n' < "$ARTIFACT_DIR/release-name.txt")"
        fi
        if [[ -z "$RELEASE_NAME" || "$RELEASE_NAME" == */* ]]; then
          echo "错误：无效的 Release 资产名：$RELEASE_NAME" >&2
          exit 1
        fi

        RELEASE_FILE="$RUNNER_TEMP/$RELEASE_NAME"
        cp -f "${ARTIFACTS[0]}" "$RELEASE_FILE"
        test -s "$RELEASE_FILE"

        # Release 资产超过单页时，按完整分页列表精确删除本应用旧资产。
        # gh release upload --clobber 曾未识别已有同名资产，连续返回 422。
        for attempt in 1 2 3 4 5 6 7 8; do
          # 查询失败后进入本轮退避，不使用分页未完成时的部分结果。
          if release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq .id)" &&
             asset_ids="$(gh api --paginate \
               "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
               | jq -r --arg name "$RELEASE_NAME" '.[] | select(.name == $name) | .id')"; then
            assets_deleted=true
            for asset_id in $asset_ids; do
              if ! gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; then
                assets_deleted=false
                break
              fi
            done
            # 删除失败后重新列举附件；仅在全部删除成功时进入上传。
            if [[ "$assets_deleted" == true ]] &&
               timeout 180 gh release upload latest "$RELEASE_FILE" \
                 --repo "$GITHUB_REPOSITORY"; then
              break
            fi
          fi
          if [[ "$attempt" -eq 8 ]]; then
            echo '发布 Release 资产失败，已尝试 8 次。' >&2
            exit 1
          fi
          echo "发布 Release 资产失败，$((attempt * 5)) 秒后重试（$attempt/8）。" >&2
          sleep $((attempt * 5))
        done
