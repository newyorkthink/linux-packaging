# 独立清理已确认归档的版本条目，不改变原有构建、监督或逐项发布流程。
name: Clean Archived Versions

on:
  push:
    branches: [main]
    paths:
      - 'archive/**'
      - '.github/appimage-apps.json'
      - '.github/workflows/**'
      - '.github/scripts/prune_archived_versions.*'
  workflow_run:
    workflows: [Build AppImages]
    types: [requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-archived-software-versions
  cancel-in-progress: false

jobs:
  clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove confirmed archived version entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune_archived_versions.sh
