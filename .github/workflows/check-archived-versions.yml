# 独立只读检查，不修改 Release，不接入原有构建、监督或自愈流程。
name: Check Archived Versions

on:
  push:
    branches: [main]
    paths:
      - 'archive/**'
      - '.github/appimage-apps.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report archived version entries
        uses: actions/github-script@v9
        with:
          script: |
            return await (async function checkArchived({github,context,core,fetch,Buffer,require}) {
              const repo = context.repo;
              const {data: ref} = await github.rest.git.getRef({...repo,ref:"heads/main"});
              const sha = ref.object.sha;
              const {data: commit} = await github.rest.git.getCommit({...repo,commit_sha:sha});
              const {data: tree} = await github.rest.git.getTree({...repo,tree_sha:commit.tree.sha,recursive:"true"});
              if (tree.truncated || !Array.isArray(tree.tree)) throw new Error("仓库目录列表不完整，停止检查。");
              const paths = new Set(tree.tree.map(row=>row.path));
              const files = new Set(tree.tree.filter(row=>row.type==="blob").map(row=>row.path));
              const read = async path => {
                const {data} = await github.rest.repos.getContent({...repo,path,ref:sha});
                if (data.type!=="file" || typeof data.content!=="string") throw new Error(`无法读取文件：${path}`);
                return Buffer.from(data.content,data.encoding).toString("utf8");
              };
              const [catalog,archive,index] = await Promise.all([
                read(".github/appimage-apps.json").then(JSON.parse),
                read("archive/appimage-apps.json").then(JSON.parse),
                read("archive/README.md")
              ]);
              for (const data of [catalog,archive]) {
                if (!data || !Array.isArray(data.apps) || data.apps.some(row=>!row || typeof row!=="object" || Array.isArray(row))) {
                  throw new Error("活动清单或归档映射格式无效，停止检查。");
                }
              }
              const workflowPaths = [...files].filter(path=>/^\.github\/workflows\/[^/]+\.ya?ml$/.test(path));
              if (!workflowPaths.length) throw new Error("未找到工作流，无法判断活动入口。");
              const workflows = (await Promise.all(workflowPaths.map(read))).join("\n");
              const mentions = value => {
                const escaped = value.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
                return new RegExp("(^|[^A-Za-z0-9_./-])"+escaped+"($|[^A-Za-z0-9_./-])").test(workflows);
              };
              const mapping = new Map();
              for (const row of archive.apps) {
                if (typeof row.dir!=="string" || !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(row.dir) ||
                    typeof row.script!=="string" || !row.script.startsWith(row.dir+"/") ||
                    row.script.split("/").includes("..") || !row.script.endsWith(".sh") ||
                    typeof row.release_name!=="string" || !/^[A-Za-z0-9][A-Za-z0-9_.+-]*\.AppImage$/.test(row.release_name) ||
                    mapping.has(row.release_name)) throw new Error("归档映射无效或重复，停止检查。");
                mapping.set(row.release_name,row);
              }
              const {data: release} = await github.rest.repos.getReleaseByTag({...repo,tag:"latest"});
              const assets = await github.paginate(github.rest.repos.listReleaseAssets,{...repo,release_id:release.id,per_page:100});
              if (!Array.isArray(assets) || assets.some(asset=>typeof asset.name!=="string")) throw new Error("Release 资产列表无效。");
              const manifests = assets.filter(asset=>asset.name==="software_versions.json");
              if (manifests.length!==1) throw new Error("版本清单不存在或不唯一，停止检查。");
              const response = await fetch(manifests[0].browser_download_url);
              if (!response.ok) throw new Error(`下载版本清单失败：HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const digest = "sha256:"+require("node:crypto").createHash("sha256").update(bytes).digest("hex");
              if (manifests[0].digest!==digest) throw new Error("版本清单摘要不一致，停止检查。");
              const manifest = JSON.parse(bytes.toString("utf8"));
              if (!manifest || typeof manifest!=="object" || Array.isArray(manifest)) throw new Error("版本清单必须是 JSON 对象。");
              const candidates = [], retained = [];
              for (const [key,entry] of Object.entries(manifest)) {
                const row = entry && typeof entry==="object" ? mapping.get(entry.asset) : undefined;
                if (!row) continue;
                const reasons = [];
                if (!files.has(`archive/${row.dir}/README.md`) || !files.has(`archive/${row.script}`) ||
                    !index.includes(`(./${row.dir}/README.md)`)) reasons.push("归档登记不完整");
                if (paths.has(row.dir)) reasons.push("原应用目录仍存在");
                if (catalog.apps.some(app=>app.software_key===key || app.release_name===entry.asset ||
                    app.dir===row.dir || app.script===row.script)) reasons.push("活动构建入口仍存在");
                if ([key,entry.asset,row.script,`archive/${row.script}`].some(mentions)) reasons.push("工作流仍有对应引用");
                if (assets.some(asset=>asset.name===entry.asset)) reasons.push("Release 资产仍存在");
                if (reasons.length) retained.push({key,asset:entry.asset,reason:reasons.join("；")});
                else candidates.push({key,asset:entry.asset});
              }
              const lines = ["## 归档版本条目检查","",`仓库快照：${sha}`,""];
              if (!candidates.length) lines.push("未发现符合条件的归档残留条目。");
              for (const row of candidates) lines.push(`- 待人工清理：\`${row.key}\` / \`${row.asset}\``);
              for (const row of retained) lines.push(`- 保留：\`${row.key}\`：${row.reason}。`);
              lines.push("","本工作流只读检查，没有修改 Release 或版本清单。");
              core.info(lines.join("\n"));
              await core.summary.addRaw(lines.join("\n")+"\n").write();
              return {candidates,retained};
            })({github,context,core,fetch,Buffer,require});
