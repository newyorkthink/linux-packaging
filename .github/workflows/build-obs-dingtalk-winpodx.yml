# 从 dev-ivan-user/AppImage_build 迁移的独立构建；每个项目使用独立 Job 和独立运行环境。
name: Build OBS DingTalk WinPodX
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.script_to_build == 'all' && 'Build OBS DingTalk WinPodX' || format('Build {0}', inputs.script_to_build)) || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - 'obs-studio/**'
      - 'dingtalk/**'
      - 'winpodx/**'
      - '.github/workflows/build-obs-dingtalk-winpodx.yml'
  workflow_dispatch:
    inputs:
      script_to_build:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - obs-studio/build_obs-studio.sh
          - dingtalk/build_dingtalk.sh
          - winpodx/build_winpodx_release.sh

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      obs_studio: ${{ steps.plan.outputs.obs_studio }}
      dingtalk: ${{ steps.plan.outputs.dingtalk }}
      winpodx: ${{ steps.plan.outputs.winpodx }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          OBS_STUDIO=false
          DINGTALK=false
          WINPODX=false

          select_all() {
            OBS_STUDIO=true
            DINGTALK=true
            WINPODX=true
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              case "${SELECTED_SCRIPT:-all}" in
                all) select_all ;;
                obs-studio/build_obs-studio.sh) OBS_STUDIO=true ;;
                dingtalk/build_dingtalk.sh) DINGTALK=true ;;
                winpodx/build_winpodx_release.sh) WINPODX=true ;;
                *) echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2; exit 1 ;;
              esac
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"
              else
                CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              fi
              if grep -Fxq '.github/workflows/build-obs-dingtalk-winpodx.yml' <<< "$CHANGED_FILES"; then
                select_all
              else
                grep -q '^obs-studio/' <<< "$CHANGED_FILES" && OBS_STUDIO=true || true
                grep -q '^dingtalk/' <<< "$CHANGED_FILES" && DINGTALK=true || true
                grep -q '^winpodx/' <<< "$CHANGED_FILES" && WINPODX=true || true
              fi
              ;;
            *) exit 1 ;;
          esac

          SHOULD_BUILD=false
          if [[ "$OBS_STUDIO" == true || "$DINGTALK" == true || "$WINPODX" == true ]]; then
            SHOULD_BUILD=true
          fi

          echo "obs_studio=$OBS_STUDIO" >> "$GITHUB_OUTPUT"
          echo "dingtalk=$DINGTALK" >> "$GITHUB_OUTPUT"
          echo "winpodx=$WINPODX" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title latest --notes latest --latest
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes latest --latest
          fi

  build_obs_studio:
    name: Build OBS Studio
    needs: plan
    if: needs.plan.outputs.obs_studio == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparing AnyLinux Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af
      - name: Build and Verify OBS Studio AppImage
        working-directory: obs-studio
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x build_obs-studio.sh
          ./build_obs-studio.sh 2>&1 | tee build_obs-studio.log
          test -x dist/OBS-Studio.AppImage
          test -s dist/OBS-Studio.AppImage.sha256
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory '*'
          pacman -S --noconfirm --needed github-cli
          gh release upload latest obs-studio/dist/OBS-Studio.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  build_dingtalk:
    name: Build DingTalk
    needs: plan
    if: needs.plan.outputs.dingtalk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and Validate DingTalk AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x dingtalk/ci_build_dingtalk.sh
          ./dingtalk/ci_build_dingtalk.sh
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dingtalk/dist/DingTalk.AppImage
          gh release upload latest dingtalk/dist/DingTalk.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  build_winpodx:
    name: Build WinPodX
    needs: plan
    if: needs.plan.outputs.winpodx == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and Validate WinPodX AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x winpodx/ci_build_winpodx.sh
          ./winpodx/ci_build_winpodx.sh
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s winpodx/dist/winpodx.AppImage
          gh release upload latest winpodx/dist/winpodx.AppImage --repo "$GITHUB_REPOSITORY" --clobber
