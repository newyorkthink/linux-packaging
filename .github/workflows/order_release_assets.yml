# 临时恢复此前错误改名的 RunImage Release 资产；恢复完成后删除本 workflow。
name: Restore Latest Release RunImage Names
run-name: Restore latest Release RunImage names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/order_release_assets.yml'

permissions:
  contents: write

jobs:
  restore_runimage_names:
    name: Restore RunImage asset names
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore original RunImage asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_TAG=latest
          WORK_DIR="$RUNNER_TEMP/release-runimage-restore"
          mkdir -p "$WORK_DIR"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          if [[ -z "$release_id" || "$release_id" == null ]]; then
            echo "未找到 $RELEASE_TAG Release。" >&2
            exit 1
          fi

          fetch_assets() {
            local output="$1"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              | jq 'add' > "$output"
          }

          : > "$WORK_DIR/runimage-names.txt"
          shopt -s nullglob
          runimage_scripts=(runimage/setup_*.sh)
          shopt -u nullglob

          if [[ "${#runimage_scripts[@]}" -eq 0 ]]; then
            echo '未找到 runimage/setup_*.sh。' >&2
            exit 1
          fi

          for script in "${runimage_scripts[@]}"; do
            output_name="$(awk '/^[[:space:]]*rim-build[[:space:]]+/ {print $NF}' "$script" | tail -n 1)"
            output_name="${output_name#\'}"
            output_name="${output_name%\'}"
            output_name="${output_name#\"}"
            output_name="${output_name%\"}"

            if [[ -z "$output_name" ]]; then
              echo "无法从 $script 读取 rim-build 输出名称。" >&2
              exit 1
            fi

            printf '%s\n' "$output_name" >> "$WORK_DIR/runimage-names.txt"
          done

          sort -f -u "$WORK_DIR/runimage-names.txt" -o "$WORK_DIR/runimage-names.txt"

          while IFS= read -r original_name; do
            [[ -n "$original_name" ]] || continue
            wrong_name="runimage-$original_name"

            fetch_assets "$WORK_DIR/assets-current.json"

            original_json="$(jq -c --arg name "$original_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-current.json")"
            wrong_json="$(jq -c --arg name "$wrong_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-current.json")"

            if [[ -n "$original_json" ]]; then
              if [[ -n "$wrong_json" ]]; then
                wrong_id="$(jq -r '.id' <<< "$wrong_json")"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$wrong_id" >/dev/null
                echo "已删除错误命名的重复资产：$wrong_name"
              else
                echo "原文件名已存在：$original_name"
              fi
              continue
            fi

            if [[ -z "$wrong_json" ]]; then
              echo "latest Release 同时缺少 $original_name 和 $wrong_name。" >&2
              exit 1
            fi

            wrong_id="$(jq -r '.id' <<< "$wrong_json")"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$wrong_id" \
              -f name="$original_name" >/dev/null

            echo "已恢复：$wrong_name -> $original_name"
          done < "$WORK_DIR/runimage-names.txt"

          fetch_assets "$WORK_DIR/assets-final.json"

          while IFS= read -r original_name; do
            [[ -n "$original_name" ]] || continue
            wrong_name="runimage-$original_name"

            if ! jq -e --arg name "$original_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-final.json" >/dev/null; then
              echo "恢复后缺少原文件名资产：$original_name" >&2
              exit 1
            fi

            if jq -e --arg name "$wrong_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-final.json" >/dev/null; then
              echo "恢复后仍存在错误文件名：$wrong_name" >&2
              exit 1
            fi
          done < "$WORK_DIR/runimage-names.txt"

          echo 'RunImage Release 资产文件名已全部恢复。'
