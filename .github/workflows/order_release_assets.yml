# GitHub Release 资产列表按文件名显示；统一给 RunImage 资产加前缀，使其在页面中连续分组。
name: Group Latest Release RunImages
run-name: Group latest Release RunImages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/order_release_assets.yml'
  workflow_run:
    workflows:
      - Build RunImages
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: group-latest-release-runimages
  cancel-in-progress: false

jobs:
  group_latest_release_runimages:
    name: Group latest Release RunImages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Group RunImage assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_TAG=latest
          WORK_DIR="$RUNNER_TEMP/release-runimage-group"
          mkdir -p "$WORK_DIR"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          if [[ -z "$release_id" || "$release_id" == null ]]; then
            echo "未找到 $RELEASE_TAG Release。" >&2
            exit 1
          fi

          fetch_assets() {
            local output="$1"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              | jq 'add' > "$output"
          }

          : > "$WORK_DIR/runimage-names.txt"
          shopt -s nullglob
          runimage_scripts=(runimage/setup_*.sh)
          shopt -u nullglob

          if [[ "${#runimage_scripts[@]}" -eq 0 ]]; then
            echo '未找到 runimage/setup_*.sh。' >&2
            exit 1
          fi

          for script in "${runimage_scripts[@]}"; do
            output_name="$(awk '/^[[:space:]]*rim-build[[:space:]]+/ {print $NF}' "$script" | tail -n 1)"
            output_name="${output_name#\'}"
            output_name="${output_name%\'}"
            output_name="${output_name#\"}"
            output_name="${output_name%\"}"

            if [[ -z "$output_name" ]]; then
              echo "无法从 $script 读取 rim-build 输出名称。" >&2
              exit 1
            fi

            printf '%s\n' "$output_name" >> "$WORK_DIR/runimage-names.txt"
          done

          sort -f -u "$WORK_DIR/runimage-names.txt" -o "$WORK_DIR/runimage-names.txt"

          while IFS= read -r legacy_name; do
            [[ -n "$legacy_name" ]] || continue
            grouped_name="runimage-$legacy_name"

            fetch_assets "$WORK_DIR/assets-current.json"

            legacy_json="$(jq -c --arg name "$legacy_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-current.json")"
            grouped_json="$(jq -c --arg name "$grouped_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-current.json")"

            if [[ -z "$legacy_json" ]]; then
              if [[ -n "$grouped_json" ]]; then
                echo "已分组：$grouped_name"
                continue
              fi

              echo "latest Release 缺少 RunImage 资产：$legacy_name / $grouped_name" >&2
              exit 1
            fi

            legacy_id="$(jq -r '.id' <<< "$legacy_json")"

            if [[ -n "$grouped_json" ]]; then
              grouped_id="$(jq -r '.id' <<< "$grouped_json")"
              if [[ "$grouped_id" != "$legacy_id" ]]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$grouped_id" >/dev/null
                echo "已删除旧分组资产：$grouped_name"
              fi
            fi

            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$legacy_id" \
              -f name="$grouped_name" >/dev/null

            echo "已分组：$legacy_name -> $grouped_name"
          done < "$WORK_DIR/runimage-names.txt"

          fetch_assets "$WORK_DIR/assets-final.json"

          while IFS= read -r legacy_name; do
            [[ -n "$legacy_name" ]] || continue
            grouped_name="runimage-$legacy_name"

            if jq -e --arg name "$legacy_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-final.json" >/dev/null; then
              echo "仍存在未分组 RunImage 资产：$legacy_name" >&2
              exit 1
            fi

            if ! jq -e --arg name "$grouped_name" '.[] | select(.name == $name)' "$WORK_DIR/assets-final.json" >/dev/null; then
              echo "缺少分组后的 RunImage 资产：$grouped_name" >&2
              exit 1
            fi
          done < "$WORK_DIR/runimage-names.txt"

          echo 'RunImage Release 资产已统一使用 runimage- 前缀并连续分组。'
