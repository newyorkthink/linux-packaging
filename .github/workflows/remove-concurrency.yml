# 临时一次性清理工作流；执行后会自动删除自身。
name: Remove workflow concurrency guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-concurrency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove concurrency guard
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text()
          updated, count = re.subn(
              r'\nconcurrency:\n(?:  .*\n)+(?=\njobs:)',
              '\n',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit('concurrency block not found')

          workflow.write_text(updated)
          Path('.github/workflows/remove-concurrency.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml .github/workflows/remove-concurrency.yml
          git commit -m 'fix: allow workflow runs to start immediately'
          git push origin HEAD:main
