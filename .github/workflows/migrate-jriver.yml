name: Prepare JRiver workflow blob

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-jriver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_jriver_workflow_blob:
    name: Prepare JRiver workflow blob
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate unified workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import shlex

          source = Path('.github/workflows/build.yml')
          target = Path('/tmp/build-jriver.yml')
          text = source.read_text()

          def replace_once(name, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'push path',
              "      - 'joplin/**'\n      - 'chatgpt/**'\n",
              "      - 'joplin/**'\n      - 'jriver/**'\n      - 'chatgpt/**'\n",
          )
          replace_once(
              'workflow dispatch option',
              "          - joplin/build_joplin.sh\n          - chatgpt/build_chatgpt.sh\n",
              "          - joplin/build_joplin.sh\n          - jriver/build_jriver.sh\n          - chatgpt/build_chatgpt.sh\n",
          )

          lines = text.splitlines()
          array_changes = {
              'KEYS=': ('joplin chatgpt', 'joplin jriver chatgpt'),
              'SCRIPTS=': (
                  "'joplin/build_joplin.sh' 'chatgpt/build_chatgpt.sh'",
                  "'joplin/build_joplin.sh' 'jriver/build_jriver.sh' 'chatgpt/build_chatgpt.sh'",
              ),
              'DIRS=': ('joplin chatgpt', 'joplin jriver chatgpt'),
          }
          for prefix, (old, new) in array_changes.items():
              indexes = [i for i, line in enumerate(lines) if line.lstrip().startswith(prefix)]
              if len(indexes) != 1:
                  raise SystemExit(f'{prefix}: expected exactly one array, found {len(indexes)}')
              index = indexes[0]
              if lines[index].count(old) != 1:
                  raise SystemExit(f'{prefix}: insertion anchor mismatch')
              lines[index] = lines[index].replace(old, new, 1)
          text = '\n'.join(lines) + '\n'

          jriver_job = """  build_jriver:
              name: Build JRiver
              needs: plan
              if: fromJSON(needs.plan.outputs.builds).jriver == 'true'
              runs-on: *arch_runner
              timeout-minutes: 90
              container: *arch_container
              permissions: *arch_permissions
              env: {BUILD_SCRIPT: 'jriver/build_jriver.sh', ARTIFACT_DIR: 'jriver/dist', RELEASE_NAME: 'jriver.AppImage', RUN_FROM_ROOT: 'false'}
              steps: *arch_steps

          """
          # The Python here-doc itself is indented by YAML. Normalize the job body to
          # exactly two spaces for the job key and four for its fields.
          jriver_job = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in jriver_job.splitlines()
          ) + '\n'
          replace_once('JRiver job', '  build_chatgpt:\n', jriver_job + '  build_chatgpt:\n')

          lines = text.splitlines()

          def parse_array(prefix):
              matches = [line.strip() for line in lines if line.lstrip().startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'{prefix}: expected one final array')
              value = matches[0].split('=', 1)[1]
              if not (value.startswith('(') and value.endswith(')')):
                  raise SystemExit(f'{prefix}: malformed array')
              return shlex.split(value[1:-1])

          keys = parse_array('KEYS=')
          scripts = parse_array('SCRIPTS=')
          dirs = parse_array('DIRS=')
          if not (len(keys) == len(scripts) == len(dirs)):
              raise SystemExit('KEYS/SCRIPTS/DIRS length mismatch')
          if len(keys) != len(set(keys)) or len(scripts) != len(set(scripts)) or len(dirs) != len(set(dirs)):
              raise SystemExit('KEYS/SCRIPTS/DIRS contains duplicates')
          index = keys.index('jriver')
          if scripts[index] != 'jriver/build_jriver.sh' or dirs[index] != 'jriver':
              raise SystemExit('JRiver KEYS/SCRIPTS/DIRS mapping mismatch')

          checks = {
              "'jriver/**'": 1,
              'jriver/build_jriver.sh': 3,
              'build_jriver:': 1,
              "fromJSON(needs.plan.outputs.builds).jriver == 'true'": 1,
              "RELEASE_NAME: 'jriver.AppImage'": 1,
          }
          for needle, expected in checks.items():
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(f'{needle}: expected {expected}, found {count}')

          target.write_text(text)
          PY

          test "$(git hash-object /tmp/build-jriver.yml)" = 'bbe0500b371f04a4d57d873a78e774638c393d06'

      - name: Store verified workflow as Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          python3 <<'PY' > /tmp/blob.json
          from pathlib import Path
          import base64
          import json

          data = Path('/tmp/build-jriver.yml').read_bytes()
          print(json.dumps({
              'content': base64.b64encode(data).decode('ascii'),
              'encoding': 'base64',
          }))
          PY

          BLOB_SHA="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq '.sha')"
          echo "BLOB_SHA=$BLOB_SHA"
          test "$BLOB_SHA" = 'bbe0500b371f04a4d57d873a78e774638c393d06'
