name: Build WorkBuddy AppImage

on:
  push:
    branches: [main]
    paths:
      - 'workbuddy/**'
      - '.github/workflows/workbuddy-audit.yml'
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workbuddy-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WorkBuddy AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparing AnyLinux Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '无法克隆 yay-bin。' >&2
              exit 1
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -Syu --noconfirm --needed github-cli

      - name: Build WorkBuddy AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x workbuddy/build_workbuddy.sh workbuddy/test_workbuddy_aur.sh
          cd workbuddy
          ./build_workbuddy.sh

      - name: Smoke test under Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s workbuddy/dist/workbuddy.AppImage
          mkdir -p "$RUNNER_TEMP/workbuddy-home"
          LOG="$RUNNER_TEMP/workbuddy-smoke.log"

          set +e
          HOME="$RUNNER_TEMP/workbuddy-home" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          timeout 30s xvfb-run -a \
            ./workbuddy/dist/workbuddy.AppImage \
            --no-sandbox \
            --disable-gpu \
            >"$LOG" 2>&1
          rc=$?
          set -e

          cat "$LOG"
          echo "Smoke test exit code: $rc"

          if grep -Eqi 'invalid ELF header|wrong ELF class|Exec format error|Cannot find module.*node-pty-linux|FATAL:|Trace/breakpoint trap|Segmentation fault' "$LOG"; then
            echo 'WorkBuddy smoke test detected a fatal Linux porting error.' >&2
            exit 1
          fi

          if [[ "$rc" -ne 0 && "$rc" -ne 124 ]]; then
            echo "WorkBuddy exited unexpectedly during smoke test: $rc" >&2
            exit "$rc"
          fi

      - name: Publish AppImage to latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -s workbuddy/dist/workbuddy.AppImage
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload latest workbuddy/dist/workbuddy.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
