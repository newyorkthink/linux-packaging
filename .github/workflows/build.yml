          HOME="$RUNNER_TEMP/workbuddy-home" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          timeout 30s xvfb-run -a \
            ./workbuddy/dist/workbuddy.AppImage \
            --no-sandbox \
            --disable-gpu \
            >"$LOG" 2>&1
          rc=$?
          set -e

          cat "$LOG"
          echo "Smoke test exit code: $rc"

          if grep -Eqi 'invalid ELF header|wrong ELF class|Exec format error|Cannot find module.*node-pty-linux|FATAL:|Trace/breakpoint trap|Segmentation fault' "$LOG"; then
            echo 'WorkBuddy smoke test detected a fatal Linux porting error.' >&2
            exit 1
          fi

          if [[ "$rc" -ne 0 && "$rc" -ne 124 ]]; then
            echo "WorkBuddy exited unexpectedly during smoke test: $rc" >&2
            exit "$rc"
          fi

      - name: Publish AppImage to latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -s workbuddy/dist/workbuddy.AppImage
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload latest workbuddy/dist/workbuddy.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

