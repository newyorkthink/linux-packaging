  build_remmina:
    name: Build Remmina
    needs: plan
    if: needs.plan.outputs.remmina == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Remmina AppImage
        shell: bash
        run: |
          chmod +x remmina/build_remmina.sh
          set +e
          env -u GITHUB_ACTIONS ./remmina/build_remmina.sh > build-remmina.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "===== build-remmina.log 最后 300 行 ====="
            tail -n 300 build-remmina.log
            exit "$status"
          fi
          tail -n 120 build-remmina.log

      - name: Fix WebKitGTK and desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fcitx5-frontend-gtk3 \
            ibus-gtk3 \
            libgtk-3-bin

          chmod +x remmina/fix_remmina_webkit.sh
          ./remmina/fix_remmina_webkit.sh dist/remmina.AppImage 2>&1 | tee fix-remmina-webkit.log

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          test -s remmina/dist/remmina.AppImage
          chmod +x remmina/dist/remmina.AppImage
          file remmina/dist/remmina.AppImage

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset latest remmina-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release delete-asset latest remmina-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release upload latest remmina/dist/remmina.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  update_upstream_state:
    name: Update Upstream State
    needs:
      - plan
      - build_antigravity_ide
      - build_antigravity
      - build_cc_switch
      - build_zen
    if: >-
      always() &&
      (needs.plan.outputs.antigravity_ide == 'true' ||
       needs.plan.outputs.antigravity == 'true' ||
       needs.plan.outputs.cc_switch == 'true' ||
       needs.plan.outputs.zen == 'true') &&
      (needs.plan.outputs.antigravity_ide != 'true' || needs.build_antigravity_ide.result == 'success') &&
      (needs.plan.outputs.antigravity != 'true' || needs.build_antigravity.result == 'success') &&
      (needs.plan.outputs.cc_switch != 'true' || needs.build_cc_switch.result == 'success') &&
      (needs.plan.outputs.zen != 'true' || needs.build_zen.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update upstream state
        shell: bash
        env:
          ANTIGRAVITY_IDE_BUILD: ${{ needs.plan.outputs.antigravity_ide }}
          ANTIGRAVITY_BUILD: ${{ needs.plan.outputs.antigravity }}
          CC_SWITCH_BUILD: ${{ needs.plan.outputs.cc_switch }}
          ZEN_BUILD: ${{ needs.plan.outputs.zen }}
          ANTIGRAVITY_IDE_UPSTREAM: ${{ needs.plan.outputs.antigravity_ide_upstream }}
          ANTIGRAVITY_UPSTREAM: ${{ needs.plan.outputs.antigravity_upstream }}
          CC_SWITCH_UPSTREAM: ${{ needs.plan.outputs.cc_switch_upstream }}
          ZEN_UPSTREAM: ${{ needs.plan.outputs.zen_upstream }}
        run: |
          set -euo pipefail

          STATE_DIR='.github/upstream-state'
          STATE_FILES=()
          mkdir -p "$STATE_DIR"

          if [[ "$ANTIGRAVITY_IDE_BUILD" == 'true' && -n "$ANTIGRAVITY_IDE_UPSTREAM" ]]; then
            printf '%s\n' "$ANTIGRAVITY_IDE_UPSTREAM" > "$STATE_DIR/antigravity-ide.url"
            STATE_FILES+=("$STATE_DIR/antigravity-ide.url")
          fi

          if [[ "$ANTIGRAVITY_BUILD" == 'true' && -n "$ANTIGRAVITY_UPSTREAM" ]]; then
            printf '%s\n' "$ANTIGRAVITY_UPSTREAM" > "$STATE_DIR/antigravity.url"
            STATE_FILES+=("$STATE_DIR/antigravity.url")
          fi

          if [[ "$CC_SWITCH_BUILD" == 'true' && -n "$CC_SWITCH_UPSTREAM" ]]; then
            printf '%s\n' "$CC_SWITCH_UPSTREAM" > "$STATE_DIR/cc-switch.version"
            STATE_FILES+=("$STATE_DIR/cc-switch.version")
          fi

          if [[ "$ZEN_BUILD" == 'true' && -n "$ZEN_UPSTREAM" ]]; then
            printf '%s\n' "$ZEN_UPSTREAM" > "$STATE_DIR/zen.version"
            STATE_FILES+=("$STATE_DIR/zen.version")
          fi

          if [[ ${#STATE_FILES[@]} -eq 0 ]] ||
             [[ -z "$(git status --porcelain -- "${STATE_FILES[@]}")" ]]; then
            echo '上游状态没有变化。'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${STATE_FILES[@]}"
          git commit -m 'chore: update upstream state'

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep 2
          done

          echo '无法写回上游状态。' >&2
          exit 1
