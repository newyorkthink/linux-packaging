  build_xnviewmp:
    name: Build XnView MP
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).xnviewmp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Qt packaging dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt5-qmake qtbase5-dev libqt5svg5 xvfb
      - name: Build XnView MP AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x xnviewmp/build_xnviewmp.sh
          ./xnviewmp/build_xnviewmp.sh
          test -s xnviewmp/dist/xnviewmp.AppImage
      - name: Smoke test XnView MP
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/xnviewmp-smoke.log"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 20s xvfb-run -a ./xnviewmp/dist/xnviewmp.AppImage >"$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"
          if grep -Eqi 'Could not load the Qt platform plugin|no Qt platform plugin could be initialized|error while loading shared libraries|Segmentation fault|Aborted' "$LOG"; then
            exit 1
          fi
          [[ "$rc" -eq 0 || "$rc" -eq 124 ]]
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload latest xnviewmp/dist/xnviewmp.AppImage --repo "$GITHUB_REPOSITORY" --clobber

