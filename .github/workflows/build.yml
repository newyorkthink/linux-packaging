# 统一 AppImage 构建入口；每个项目都是独立 Job、独立运行环境，不使用 Matrix。
name: Build AppImages
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.script_to_build == 'all' && 'Build all AppImages' || format('Build {0}', inputs.script_to_build)) || github.event_name == 'schedule' && 'Daily build all AppImages' || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - 'antigravity-ide/**'
      - 'antigravity/**'
      - 'cc-switch/**'
      - 'zen/**'
      - 'copyq/**'
      - 'flameshot/**'
      - 'goldendict-ng/**'
      - 'htop/**'
      - 'i3wm/**'
      - 'keepassxc/**'
      - 'keepass/**'
      - 'kde-suite/**'
      - 'kitty/**'
      - 'mpv/**'
      - 'nvtop/**'
      - 'ripdrag/**'
      - 'smplayer/**'
      - 'sunshine/**'
      - 'freerdp/**'
      - 'newsboat/**'
      - 'zotero/**'
      - 'vscode/**'
      - 'simplescreenrecorder/**'
      - 'rofi/**'
      - 'picom/**'
      - 'obsidian/**'
      - 'freedownloadmanager/**'
      - 'deskflow/**'
      - 'cursor/**'
      - 'trae/**'
      - 'trae-work/**'
      - 'deepseek-harness/**'
      - 'obs-studio/**'
      - 'dingtalk/**'
      - 'winpodx/**'
      - 'alacritty/**'
      - 'Keyviz/**'
      - 'remmina/**'
      - 'dconf-editor/**'
      - 'rainlendar/**'
      - 'realvnc-rvnc-connect/**'
      - 'remotedesktopmanager/**'
      - 'github-desktop/**'
      - 'workbuddy/**'
      - 'mailmaster/**'
      - 'alttab/**'
      - 'baidunetdisk/**'
      - 'aionui/**'
      - 'wechat/**'
      - 'folo/**'
      - 'feishu/**'
      - 'joplin/**'
      - 'chatgpt/**'
      - 'xmind/**'
      - 'postman/**'
      - 'v2rayn/**'
      - 'xnviewmp/**'
      - 'xnconvert/**'
      - 'stacher/**'
      - 'tencent-docs/**'
      - '.github/workflows/build.yml'
      - '.github/actions/build-anylinux/**'
      - '.github/scripts/**'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      script_to_build:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - antigravity-ide/build_antigravity-ide.sh
          - antigravity/build_antigravity.sh
          - cc-switch/build_cc-switch.sh
          - zen/build_zen.sh
          - copyq/build_copyq.sh
          - flameshot/build_flameshot.sh
          - goldendict-ng/build_goldendict-ng.sh
          - htop/build_htop.sh
          - i3wm/build_i3wm.sh
          - keepassxc/build_keepassxc.sh
          - keepass/build_keepass.sh
          - kde-suite/build_kde_suite.sh
          - kitty/build_kitty.sh
          - mpv/build_mpv.sh
          - nvtop/build_nvtop.sh
          - ripdrag/build_ripdrag.sh
          - smplayer/build_smplayer.sh
          - sunshine/build_sunshine.sh
          - freerdp/build_freerdp.sh
          - newsboat/build_newsboat.sh
          - alacritty/build_alacritty_linuxdeploy.sh
          - Keyviz/build_keyviz.sh
          - remmina/build_remmina.sh
          - zotero/build_zotero.sh
          - vscode/build_vscode.sh
          - simplescreenrecorder/build_simplescreenrecorder.sh
          - rofi/build_rofi.sh
          - picom/build_picom.sh
          - obsidian/build_obsidian.sh
          - freedownloadmanager/build_freedownloadmanager.sh
          - deskflow/build_deskflow.sh
          - cursor/build_cursor.sh
          - trae/build_trae.sh
          - trae-work/build_trae-work.sh
          - deepseek-harness/build_deepseek-harness.sh
          - obs-studio/build_obs-studio.sh
          - dingtalk/build_dingtalk.sh
          - winpodx/build_winpodx_release.sh
          - dconf-editor/build_dconf-editor.sh
          - rainlendar/build_rainlendar.sh
          - realvnc-rvnc-connect/build_realvnc-rvnc-connect.sh
          - remotedesktopmanager/build_remotedesktopmanager.sh
          - github-desktop/build_github-desktop.sh
          - workbuddy/build_workbuddy.sh
          - mailmaster/build_mailmaster.sh
          - alttab/build_alttab.sh
          - baidunetdisk/build_baidunetdisk.sh
          - aionui/build_aionui.sh
          - wechat/build_wechat.sh
          - folo/build_folo.sh
          - feishu/build_feishu.sh
          - joplin/build_joplin.sh
          - chatgpt/build_chatgpt.sh
          - xmind/build_xmind.sh
          - postman/build_postman.sh
          - v2rayn/build_v2rayn.sh
          - xnviewmp/build_xnviewmp.sh
          - xnconvert/build_xnconvert.sh

          - stacher/build_stacher.sh
          - tencent-docs/build_tencent-docs.sh

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEYS=(antigravity_ide antigravity cc_switch zen copyq flameshot goldendict_ng htop i3wm keepassxc keepass kde_suite kitty mpv nvtop ripdrag smplayer sunshine freerdp newsboat zotero vscode simplescreenrecorder rofi picom obsidian freedownloadmanager deskflow cursor trae trae_work deepseek_harness obs_studio dingtalk winpodx alacritty keyviz remmina dconf_editor rainlendar realvnc_connect remotedesktopmanager github_desktop workbuddy mailmaster alttab baidunetdisk aionui wechat folo feishu joplin chatgpt xmind postman v2rayn xnviewmp xnconvert stacher tencent_docs)
          SCRIPTS=('antigravity-ide/build_antigravity-ide.sh' 'antigravity/build_antigravity.sh' 'cc-switch/build_cc-switch.sh' 'zen/build_zen.sh' 'copyq/build_copyq.sh' 'flameshot/build_flameshot.sh' 'goldendict-ng/build_goldendict-ng.sh' 'htop/build_htop.sh' 'i3wm/build_i3wm.sh' 'keepassxc/build_keepassxc.sh' 'keepass/build_keepass.sh' 'kde-suite/build_kde_suite.sh' 'kitty/build_kitty.sh' 'mpv/build_mpv.sh' 'nvtop/build_nvtop.sh' 'ripdrag/build_ripdrag.sh' 'smplayer/build_smplayer.sh' 'sunshine/build_sunshine.sh' 'freerdp/build_freerdp.sh' 'newsboat/build_newsboat.sh' 'zotero/build_zotero.sh' 'vscode/build_vscode.sh' 'simplescreenrecorder/build_simplescreenrecorder.sh' 'rofi/build_rofi.sh' 'picom/build_picom.sh' 'obsidian/build_obsidian.sh' 'freedownloadmanager/build_freedownloadmanager.sh' 'deskflow/build_deskflow.sh' 'cursor/build_cursor.sh' 'trae/build_trae.sh' 'trae-work/build_trae-work.sh' 'deepseek-harness/build_deepseek-harness.sh' 'obs-studio/build_obs-studio.sh' 'dingtalk/build_dingtalk.sh' 'winpodx/build_winpodx_release.sh' 'alacritty/build_alacritty_linuxdeploy.sh' 'Keyviz/build_keyviz.sh' 'remmina/build_remmina.sh' 'dconf-editor/build_dconf-editor.sh' 'rainlendar/build_rainlendar.sh' 'realvnc-rvnc-connect/build_realvnc-rvnc-connect.sh' 'remotedesktopmanager/build_remotedesktopmanager.sh' 'github-desktop/build_github-desktop.sh' 'workbuddy/build_workbuddy.sh' 'mailmaster/build_mailmaster.sh' 'alttab/build_alttab.sh' 'baidunetdisk/build_baidunetdisk.sh' 'aionui/build_aionui.sh' 'wechat/build_wechat.sh' 'folo/build_folo.sh' 'feishu/build_feishu.sh' 'joplin/build_joplin.sh' 'chatgpt/build_chatgpt.sh' 'xmind/build_xmind.sh' 'postman/build_postman.sh' 'v2rayn/build_v2rayn.sh' 'xnviewmp/build_xnviewmp.sh' 'xnconvert/build_xnconvert.sh' 'stacher/build_stacher.sh' 'tencent-docs/build_tencent-docs.sh')
          DIRS=(antigravity-ide antigravity cc-switch zen copyq flameshot goldendict-ng htop i3wm keepassxc keepass kde-suite kitty mpv nvtop ripdrag smplayer sunshine freerdp newsboat zotero vscode simplescreenrecorder rofi picom obsidian freedownloadmanager deskflow cursor trae trae-work deepseek-harness obs-studio dingtalk winpodx alacritty Keyviz remmina dconf-editor rainlendar realvnc-rvnc-connect remotedesktopmanager github-desktop workbuddy mailmaster alttab baidunetdisk aionui wechat folo feishu joplin chatgpt xmind postman v2rayn xnviewmp xnconvert stacher tencent-docs)
          declare -A BUILD SCRIPT_KEY DIR_KEY
          for i in "${!KEYS[@]}"; do key=${KEYS[$i]}; BUILD[$key]=false; SCRIPT_KEY[${SCRIPTS[$i]}]=$key; DIR_KEY[${DIRS[$i]}]=$key; done
          select_all() { for key in "${KEYS[@]}"; do BUILD[$key]=true; done; }
          case "$EVENT_NAME" in
            workflow_dispatch) if [[ "${SELECTED_SCRIPT:-all}" == all ]]; then select_all; elif [[ -n "${SCRIPT_KEY[${SELECTED_SCRIPT:-}]:-}" ]]; then BUILD[${SCRIPT_KEY[$SELECTED_SCRIPT]}]=true; else echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2; exit 1; fi ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"; else CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"; fi
              if grep -Eq '^\.github/actions/build-anylinux/' <<< "$CHANGED_FILES"; then
                select_all
              else
                while IFS= read -r file; do
                  case "$file" in
                    .github/scripts/ci_build_dingtalk.sh) BUILD[dingtalk]=true ;;
                    .github/scripts/ci_build_winpodx.sh) BUILD[winpodx]=true ;;
                    *) dir=${file%%/*}; [[ -n "${DIR_KEY[$dir]:-}" ]] && BUILD[${DIR_KEY[$dir]}]=true ;;
                  esac
                done <<< "$CHANGED_FILES"
                if grep -Fxq '.github/workflows/build.yml' <<< "$CHANGED_FILES"; then
                  selected=false
                  for key in "${KEYS[@]}"; do
                    if [[ "${BUILD[$key]}" == true ]]; then selected=true; break; fi
                  done
                  [[ "$selected" == false ]] && select_all
                fi
              fi ;;
            schedule) select_all ;;
            *) exit 1 ;;
          esac
          BUILDS_JSON="$(for key in "${KEYS[@]}"; do printf '%s=%s\n' "$key" "${BUILD[$key]}"; done | python3 -c 'import json,sys; print(json.dumps(dict(line.rstrip().split("=",1) for line in sys.stdin), separators=(",",":")))')"
          SHOULD_BUILD=false; [[ "$BUILDS_JSON" == *':"true"'* ]] && SHOULD_BUILD=true
          echo "builds=$BUILDS_JSON" >> "$GITHUB_OUTPUT"; echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null; gh release edit latest --repo "$GITHUB_REPOSITORY" --title latest --notes latest --latest; else gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes latest --latest; fi

  build_antigravity_ide:
    name: Build Antigravity IDE
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).antigravity_ide == 'true'
    runs-on: &arch_runner ubuntu-latest
    timeout-minutes: &arch_timeout 60
    container: &arch_container ghcr.io/pkgforge-dev/archlinux:latest
    permissions: &arch_permissions {contents: write, packages: read}
    env: {BUILD_SCRIPT: 'antigravity-ide/build_antigravity-ide.sh', ARTIFACT_DIR: 'antigravity-ide/dist', RELEASE_NAME: 'antigravity-ide.AppImage', RUN_FROM_ROOT: 'false'}
    steps: &arch_steps
      - {name: Pre-install Git, run: 'pacman -Sy --noconfirm git'}
      - {name: Checkout Code, uses: 'actions/checkout@v4', with: {fetch-depth: 0}}
      - {name: Preparing Container, uses: 'pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d'} # v1
      - name: Build and publish AppImage
        uses: ./.github/actions/build-anylinux
        with: {build_script: '${{ env.BUILD_SCRIPT }}', artifact_dir: '${{ env.ARTIFACT_DIR }}', release_name: '${{ env.RELEASE_NAME }}', run_from_root: '${{ env.RUN_FROM_ROOT }}', github_token: '${{ github.token }}'}

  build_antigravity:
    name: Build Antigravity
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).antigravity == 'true'
    runs-on: *arch_runner
    timeout-minutes: *arch_timeout
    container: *arch_container
    permissions: *arch_permissions
    env: {BUILD_SCRIPT: 'antigravity/build_antigravity.sh', ARTIFACT_DIR: 'antigravity/dist', RELEASE_NAME: 'antigravity.AppImage', RUN_FROM_ROOT: 'false'}
    steps: *arch_steps

  build_cc_switch:
    name: Build CC Switch
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).cc_switch == 'true'
    runs-on: *arch_runner
    timeout-minutes: *arch_timeout
