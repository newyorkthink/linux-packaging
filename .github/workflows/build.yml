# 统一 AppImage 构建入口。标准 Arch 应用由清单 + matrix 调度；特例保持独立 Job。
# 每个选中的应用仍是独立 runner（matrix fail-fast: false），完成后立即写入 software_versions.json。
name: Build AppImages
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release_integrity_repair == true && format('Release integrity repair: {0}', inputs.release_integrity_keys) || github.event_name == 'workflow_dispatch' && (inputs.script_search != '' && format('Build {0}', inputs.script_search) || inputs.script_to_build == 'all' && 'Build all AppImages' || format('Build {0}', inputs.script_to_build)) || github.event_name == 'schedule' && 'Daily build all AppImages' || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/build-anylinux/**'
      - '.github/actions/publish-software-versions/**'
      - '.github/appimage-apps.json'
      - '.github/scripts/**'
      - '*/**'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      script_to_build:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - adspower-global/build_adspower-global.sh
          - aionui/build_aionui.sh
          - alacritty/build_alacritty_linuxdeploy.sh
          - alttab/build_alttab.sh
          - android-tools/build_android-tools.sh
          - antigravity-ide/build_antigravity-ide.sh
          - antigravity/build_antigravity.sh
          - baidunetdisk/build_baidunetdisk.sh
          - cc-switch/build_cc-switch.sh
          - chatgpt/build_chatgpt.sh
          - chromium/build_chromium.sh
          - claude-desktop/build_claude-desktop.sh
          - copyq/build_copyq.sh
          - cursor/build_cursor.sh
          - dconf-editor/build_dconf-editor.sh
          - deepseek-harness/build_deepseek-harness.sh
          - deskflow/build_deskflow.sh
          - dingtalk/build_dingtalk.sh
          - escrcpy/build_escrcpy.sh
          - feishu/build_feishu.sh
          - flameshot/build_flameshot.sh
          - folo/build_folo.sh
          - freedownloadmanager/build_freedownloadmanager.sh
          - freerdp/build_freerdp.sh
          - gemini/build_gemini.sh
          - github-desktop/build_github-desktop.sh
          - gitkraken/build_gitkraken.sh
          - goldendict-ng/build_goldendict-ng.sh
          - hermes-desktop/build_hermes-desktop.sh
          - htop/build_htop.sh
          - i3wm/build_i3wm.sh
          - joplin/build_joplin.sh
          - jriver/build_jriver.sh
          - kde-suite/build_kde_suite.sh
          - keepass/build_keepass.sh
          - keepassxc/build_keepassxc.sh
          - Keyviz/build_keyviz.sh
          - kitty/build_kitty.sh
          - mailmaster/build_mailmaster.sh
          - mediainfo/build_mediainfo_linuxdeploy.sh
          - mission-center/build_mission-center.sh
          - moderncsv/build_moderncsv.sh
          - mpv/build_mpv.sh
          - newsboat/build_newsboat.sh
          - nvtop/build_nvtop.sh
          - obs-studio/build_obs-studio.sh
          - obsidian/build_obsidian.sh
          - parsec/build_parsec.sh
          - peazip/build_peazip.sh
          - picom/build_picom.sh
          - poppler-utils/build_poppler-utils.sh
          - postman/build_postman.sh
          - qemu/build_qemu.sh
          - qq/build_qq.sh
          - rainlendar2/build_rainlendar2.sh
          - realvnc-rvnc-connect/build_realvnc-rvnc-connect.sh
          - remmina/build_remmina.sh
          - remotedesktopmanager/build_remotedesktopmanager.sh
          - ripdrag/build_ripdrag.sh
          - rofi/build_rofi.sh
          - simplescreenrecorder/build_simplescreenrecorder.sh
          - smplayer/build_smplayer.sh
          - stacer/build_stacer.sh
          - stacher/build_stacher.sh
          - sunshine/build_sunshine.sh
          - tencent-docs/build_tencent-docs.sh
          - trae-work/build_trae-work.sh
          - trae/build_trae.sh
          - v2rayn/build_v2rayn.sh
          - ventoy/build_ventoy.sh
          - virt-manager/build_virt-manager.sh
          - vscode/build_vscode.sh
          - webcamoid/build_webcamoid.sh
          - wechat/build_wechat.sh
          - wine/build_wine.sh
          - winpodx/build_winpodx_release.sh
          - workbuddy/build_workbuddy.sh
          - xmind/build_xmind.sh
          - xnconvert/build_xnconvert.sh
          - xnviewmp/build_xnviewmp.sh
          - zen/build_zen.sh
          - zotero/build_zotero.sh
      script_search:
        description: '模糊输入脚本名称（可留空；填写时优先于上方下拉）'
        required: false
        default: ''
        type: string
      release_integrity_repair:
        description: '内部使用：由 Release 完整性监督触发'
        required: false
        default: false
        type: boolean
      release_integrity_keys:
        description: '内部使用：需要自愈的构建 key JSON 数组'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: &arch_runner ubuntu-latest
    timeout-minutes: &arch_timeout 60
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      builds: ${{ steps.plan.outputs.builds }}
      matrix: ${{ steps.plan.outputs.matrix }}
      standard_count: ${{ steps.plan.outputs.standard_count }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          SCRIPT_SEARCH: ${{ inputs.script_search }}
          RELEASE_INTEGRITY_REPAIR: ${{ inputs.release_integrity_repair }}
          RELEASE_INTEGRITY_KEYS: ${{ inputs.release_integrity_keys }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plan_appimage_jobs.py
      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null; gh release edit latest --repo "$GITHUB_REPOSITORY" --title latest --notes latest --latest; else gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes latest --latest; fi

  build_standard:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.standard_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: *arch_runner
    timeout-minutes: ${{ matrix.timeout_minutes }}
    container: &arch_container ghcr.io/pkgforge-dev/archlinux:latest
    permissions: &arch_permissions {contents: write, packages: read}
    env:
      BUILD_SCRIPT: ${{ matrix.script }}
      ARTIFACT_DIR: ${{ matrix.artifact_dir }}
      RELEASE_NAME: ${{ matrix.release_name }}
      RUN_FROM_ROOT: ${{ matrix.run_from_root }}
      SOFTWARE_KEY: ${{ matrix.software_key }}
    steps: &arch_steps
      - {name: Pre-install Git, run: 'pacman -Sy --noconfirm git'}
      - {name: Checkout Code, uses: 'actions/checkout@v4', with: {fetch-depth: 0}}
      - {name: Preparing Container, uses: 'pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d'} # v1
      - name: Build and publish AppImage
        uses: ./.github/actions/build-anylinux
        with: {build_script: '${{ env.BUILD_SCRIPT }}', artifact_dir: '${{ env.ARTIFACT_DIR }}', release_name: '${{ env.RELEASE_NAME }}', run_from_root: '${{ env.RUN_FROM_ROOT }}', github_token: '${{ github.token }}'}
      - name: Prepare software version metadata
        if: env.SOFTWARE_KEY != '' && env.SOFTWARE_VERSION_SOURCE != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -s "${SOFTWARE_VERSION_SOURCE}" ]] || {
            echo "版本元数据源文件不存在或为空：${SOFTWARE_VERSION_SOURCE}" >&2
            exit 1
          }
          version="$(
            awk -F= '$1 == "version" {sub(/^[^=]*=/, ""); print; exit}' "${SOFTWARE_VERSION_SOURCE}"
          )"
          [[ -n "${version}" ]] || {
            echo "无法从 ${SOFTWARE_VERSION_SOURCE} 解析 version=。" >&2
            exit 1
          }
          printf '%s\n' "${version}" > "${ARTIFACT_DIR}/version.txt"

      - name: Upload software version metadata
        if: env.SOFTWARE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: software-version-${{ env.SOFTWARE_KEY }}
          path: ${{ env.ARTIFACT_DIR }}/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish software version immediately
        if: env.SOFTWARE_KEY != ''
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: ${{ env.SOFTWARE_KEY }}
          version_file: ${{ env.ARTIFACT_DIR }}/version.txt
          asset_name: ${{ env.RELEASE_NAME }}
          artifact_dir: ${{ env.ARTIFACT_DIR }}
          github_token: ${{ github.token }}

  build_alacritty:
    name: Build Alacritty
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).alacritty == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Alacritty AppImage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x alacritty/build_alacritty_linuxdeploy.sh
          env -u GITHUB_ACTIONS ./alacritty/build_alacritty_linuxdeploy.sh
          test -s alacritty/dist/alacritty.AppImage

      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-alacritty
          path: alacritty/dist/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload latest alacritty/dist/alacritty.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'alacritty'
          version_file: 'alacritty/dist/version.txt'
          asset_name: 'alacritty.AppImage'
          artifact_dir: 'alacritty/dist'
          github_token: ${{ github.token }}


  build_baidunetdisk:
    name: Build Baidu Netdisk
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).baidunetdisk == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and validate Baidu Netdisk AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n baidunetdisk/build_baidunetdisk.sh
          chmod +x baidunetdisk/build_baidunetdisk.sh
          ./baidunetdisk/build_baidunetdisk.sh
          test -s baidunetdisk/dist/baidunetdisk.AppImage
      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-baidunetdisk
          path: baidunetdisk/dist/version.txt
          if-no-files-found: error
          retention-days: 1
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload latest baidunetdisk/dist/baidunetdisk.AppImage --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'baidunetdisk'
          version_file: 'baidunetdisk/dist/version.txt'
          asset_name: 'baidunetdisk.AppImage'
          artifact_dir: 'baidunetdisk/dist'
          github_token: ${{ github.token }}


  build_chatgpt:
    name: Build ChatGPT
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).chatgpt == 'true'
    runs-on: *arch_runner
    timeout-minutes: 90
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged
    permissions: *arch_permissions
    env: {BUILD_SCRIPT: 'chatgpt/build_chatgpt.sh', ARTIFACT_DIR: 'chatgpt/dist', RELEASE_NAME: 'chatgpt.AppImage', RUN_FROM_ROOT: 'false', SOFTWARE_KEY: 'chatgpt'}
    steps: *arch_steps


  build_dconf_editor:
    name: Build dconf Editor
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).dconf_editor == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: build-dconf-editor
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build dconf-editor AppImage
        working-directory: dconf-editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_dconf-editor.sh
          ./build_dconf-editor.sh

      - name: Prepare software version metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -nE 's/^readonly EXPECTED_DCONF_EDITOR_VERSION="([^"]+)"/\1/p' dconf-editor/build_dconf-editor.sh | head -n 1)"
          [[ -n "$version" ]] || {
            echo "无法从 dconf-editor/build_dconf-editor.sh 解析版本。" >&2
            exit 1
          }
          printf '%s\n' "$version" > dconf-editor/dist/version.txt

      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-dconf-editor
          path: dconf-editor/dist/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dconf-editor/dist/dconf-editor.AppImage
          gh release upload latest dconf-editor/dist/dconf-editor.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'dconf-editor'
          version_file: 'dconf-editor/dist/version.txt'
          asset_name: 'dconf-editor.AppImage'
          artifact_dir: 'dconf-editor/dist'
          github_token: ${{ github.token }}


  build_dingtalk:
    name: Build DingTalk
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).dingtalk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and Validate DingTalk AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x .github/scripts/ci_build_dingtalk.sh
          ./.github/scripts/ci_build_dingtalk.sh
      - name: Prepare software version metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(
            awk -F= '$1 == "version" {sub(/^[^=]*=/, ""); print; exit}' dingtalk/dist/dingtalk-version.txt
          )"
          [[ -n "${version}" ]] || {
            echo "无法从 dingtalk-version.txt 解析版本。" >&2
            exit 1
          }
          printf '%s\n' "${version}" > dingtalk/dist/version.txt
      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-dingtalk
          path: dingtalk/dist/version.txt
          if-no-files-found: error
          retention-days: 1
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dingtalk/dist/dingtalk.AppImage
          gh release delete-asset latest DingTalk.AppImage --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release upload latest dingtalk/dist/dingtalk.AppImage --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'dingtalk'
          version_file: 'dingtalk/dist/version.txt'
          asset_name: 'dingtalk.AppImage'
          artifact_dir: 'dingtalk/dist'
          github_token: ${{ github.token }}


  build_github_desktop:
    name: Build GitHub Desktop
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).github_desktop == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build official-source AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd github-desktop
          chmod +x build_github-desktop.sh
          ./build_github-desktop.sh
          test -s dist/github-desktop.AppImage
          sha256sum dist/github-desktop.AppImage

      - name: Prepare software version metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(python3 -c 'import json; print(json.load(open("github-desktop/source/app/package.json", encoding="utf-8"))["version"])')"
          [[ -n "${version}" ]] || {
            echo "无法从 GitHub Desktop package.json 解析版本。" >&2
            exit 1
          }
          printf '%s\n' "${version}" > github-desktop/dist/version.txt

      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-github-desktop
          path: github-desktop/dist/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish latest AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release upload latest github-desktop/dist/github-desktop.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'github-desktop'
          version_file: 'github-desktop/dist/version.txt'
          asset_name: 'github-desktop.AppImage'
          artifact_dir: 'github-desktop/dist'
          github_token: ${{ github.token }}


  build_hermes_desktop:
    name: Build Hermes Desktop
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).hermes_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Static check Hermes Desktop migration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n hermes-desktop/build_hermes-desktop.sh
          python3 -m py_compile hermes-desktop/patch_hermes_desktop.py

      - name: Build and verify Hermes Desktop AppImage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x hermes-desktop/build_hermes-desktop.sh hermes-desktop/patch_hermes_desktop.py
          ./hermes-desktop/build_hermes-desktop.sh
          test -s hermes-desktop/dist/hermes-desktop.AppImage
          sha256sum hermes-desktop/dist/hermes-desktop.AppImage

      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-hermes-desktop
          path: hermes-desktop/dist/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload latest hermes-desktop/dist/hermes-desktop.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'hermes-desktop'
          version_file: 'hermes-desktop/dist/version.txt'
          asset_name: 'hermes-desktop.AppImage'
          artifact_dir: 'hermes-desktop/dist'
          github_token: ${{ github.token }}


  build_joplin:
    name: Build Joplin
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).joplin == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build and validate Joplin AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n joplin/build_joplin.sh
          chmod +x joplin/build_joplin.sh
          ./joplin/build_joplin.sh
          test -s joplin/dist/joplin.AppImage
      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-joplin
          path: joplin/dist/version.txt
          if-no-files-found: error
          retention-days: 1
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload latest joplin/dist/joplin.AppImage --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'joplin'
          version_file: 'joplin/dist/version.txt'
          asset_name: 'joplin.AppImage'
          artifact_dir: 'joplin/dist'
          github_token: ${{ github.token }}


  build_jriver:
    name: Build JRiver
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).jriver == 'true'
    runs-on: *arch_runner
    timeout-minutes: 90
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse
    permissions: *arch_permissions
    env: {BUILD_SCRIPT: 'jriver/build_jriver.sh', ARTIFACT_DIR: 'jriver/dist', RELEASE_NAME: 'mediacenter36.AppImage', RUN_FROM_ROOT: 'false'}
    steps: *arch_steps


  build_keyviz:
    name: Build Keyviz
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).keyviz == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing anylinux Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin" && break
            sleep 5
          done
