    env: {BUILD_SCRIPT: 'kde-suite/build_kde_suite.sh', ARTIFACT_DIR: 'kde-suite/dist', RELEASE_NAME: 'kde-suite.AppImage', RUN_FROM_ROOT: 'false'}
