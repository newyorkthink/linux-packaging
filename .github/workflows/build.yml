          env -u GITHUB_ACTIONS ./remmina/build_remmina.sh > build-remmina.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "===== build-remmina.log 最后 300 行 ====="
            tail -n 300 build-remmina.log
            exit "$status"
          fi
          tail -n 120 build-remmina.log

      - name: Fix WebKitGTK and desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fcitx5-frontend-gtk3 \
            ibus-gtk3 \
            libgtk-3-bin

          chmod +x remmina/fix_remmina_webkit.sh
          ./remmina/fix_remmina_webkit.sh dist/remmina.AppImage 2>&1 | tee fix-remmina-webkit.log

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          test -s remmina/dist/remmina.AppImage
          chmod +x remmina/dist/remmina.AppImage
          file remmina/dist/remmina.AppImage

      - name: Prepare software version metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(
            awk '/^Remmina 版本：/ {sub(/^Remmina 版本：/, ""); value=$0} END {print value}' build-remmina.log
          )"
          [[ -n "${version}" ]] || {
            echo "无法从 Remmina 构建日志解析版本。" >&2
            exit 1
          }
          printf '%s\n' "${version}" | sudo tee remmina/dist/version.txt >/dev/null

      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-remmina
