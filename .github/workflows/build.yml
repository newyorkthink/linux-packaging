# 统一 AppImage 构建入口；各项目使用独立 Job/Matrix 子 Job 并行构建，产物发布到固定 latest Release。
name: Build AppImages

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      (inputs.script_to_build == 'all' && 'Build all AppImages' || format('Build {0}', inputs.script_to_build)) ||
      github.event_name == 'schedule' && 'Check upstream updates' ||
      github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - 'antigravity-ide/**'
      - 'antigravity/**'
      - 'cc-switch/**'
      - 'zen/**'
      - 'copyq/**'
      - 'flameshot/**'
      - 'goldendict-ng/**'
      - 'htop/**'
      - 'i3wm/**'
      - 'keepassxc/**'
      - 'kitty/**'
      - 'mpv/**'
      - 'nvtop/**'
      - 'ripdrag/**'
      - 'smplayer/**'
      - 'sunshine/**'
      - 'alacritty/**'
      - 'Keyviz/**'
      - 'freerdp/**'
      - 'newsboat/**'
      - 'remmina/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      script_to_build:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - antigravity-ide/build_antigravity-ide.sh
          - antigravity/build_antigravity.sh
          - cc-switch/build_cc-switch.sh
          - zen/build_zen.sh
          - copyq/build_copyq.sh
          - flameshot/build_flameshot.sh
          - goldendict-ng/build_goldendict-ng.sh
          - htop/build_htop.sh
          - i3wm/build_i3wm.sh
          - keepassxc/build_keepassxc.sh
          - kitty/build_kitty.sh
          - mpv/build_mpv.sh
          - nvtop/build_nvtop.sh
          - ripdrag/build_ripdrag.sh
          - smplayer/build_smplayer.sh
          - sunshine/build_sunshine.sh
          - alacritty/build_alacritty_linuxdeploy.sh
          - Keyviz/build_keyviz.sh
          - freerdp/build_freerdp.sh
          - newsboat/build_newsboat.sh
          - remmina/build_remmina.sh

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      antigravity_ide: ${{ steps.plan.outputs.antigravity_ide }}
      antigravity: ${{ steps.plan.outputs.antigravity }}
      cc_switch: ${{ steps.plan.outputs.cc_switch }}
      zen: ${{ steps.plan.outputs.zen }}
      migrated_matrix: ${{ steps.plan.outputs.migrated_matrix }}
      migrated_count: ${{ steps.plan.outputs.migrated_count }}
      alacritty: ${{ steps.plan.outputs.alacritty }}
      keyviz: ${{ steps.plan.outputs.keyviz }}
      remmina: ${{ steps.plan.outputs.remmina }}
      antigravity_ide_upstream: ${{ steps.plan.outputs.antigravity_ide_upstream }}
      antigravity_upstream: ${{ steps.plan.outputs.antigravity_upstream }}
      cc_switch_upstream: ${{ steps.plan.outputs.cc_switch_upstream }}
      zen_upstream: ${{ steps.plan.outputs.zen_upstream }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ANTIGRAVITY_IDE_SCRIPT='antigravity-ide/build_antigravity-ide.sh'
          ANTIGRAVITY_SCRIPT='antigravity/build_antigravity.sh'
          CC_SWITCH_SCRIPT='cc-switch/build_cc-switch.sh'
          ZEN_SCRIPT='zen/build_zen.sh'
          ALACRITTY_SCRIPT='alacritty/build_alacritty_linuxdeploy.sh'
          KEYVIZ_SCRIPT='Keyviz/build_keyviz.sh'
          REMMINA_SCRIPT='remmina/build_remmina.sh'
          STATE_DIR='.github/upstream-state'
          MATRIX_FILE="$RUNNER_TEMP/migrated-appimages.tsv"
          : > "$MATRIX_FILE"

          ANTIGRAVITY_IDE_BUILD=false
          ANTIGRAVITY_BUILD=false
          CC_SWITCH_BUILD=false
          ZEN_BUILD=false
          ALACRITTY_BUILD=false
          KEYVIZ_BUILD=false
          REMMINA_BUILD=false

          ANTIGRAVITY_IDE_UPSTREAM=''
          ANTIGRAVITY_UPSTREAM=''
          CC_SWITCH_UPSTREAM=''
          ZEN_UPSTREAM=''

          get_antigravity_ide_upstream() {
            local page
            page="$(curl -sSfL --compressed 'https://antigravity.google/download')"

            ANTIGRAVITY_IDE_UPSTREAM="$(
              grep -oP "https://edgedl\.me\.gvt1\.com[^\"']+linux-x64/Antigravity%20IDE\.tar\.gz" <<< "$page" |
                sed -n '1p'
            )"

            if [[ -z "$ANTIGRAVITY_IDE_UPSTREAM" ]]; then
              echo '无法获取 Antigravity IDE 当前上游下载地址。' >&2
              exit 1
            fi
          }

          get_antigravity_upstream() {
            local page
            page="$(curl -sSfL --compressed 'https://antigravity.google/download')"

            ANTIGRAVITY_UPSTREAM="$(
              grep -oP "https://storage\.googleapis\.com/antigravity-public/antigravity-hub/[^\"']+/linux-x64/Antigravity\.tar\.gz" <<< "$page" |
                sed -n '1p'
            )"

            if [[ -z "$ANTIGRAVITY_UPSTREAM" ]]; then
              echo '无法获取 Antigravity 当前上游下载地址。' >&2
              exit 1
            fi
          }

          get_cc_switch_upstream() {
            CC_SWITCH_UPSTREAM="$(
              curl -sSfL 'https://aur.archlinux.org/rpc/v5/info?arg[]=cc-switch-bin' |
                python3 -c 'import json,sys; data=json.load(sys.stdin); results=data.get("results", []); print(results[0]["Version"] if results else "")'
            )"

            if [[ -z "$CC_SWITCH_UPSTREAM" ]]; then
              echo '无法获取 cc-switch-bin 当前 AUR 版本。' >&2
              exit 1
            fi
          }

          get_zen_upstream() {
            ZEN_UPSTREAM="$(
              curl -sSfL \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                'https://api.github.com/repos/irbis-sh/zen-desktop/releases/latest' |
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name", ""))'
            )"

            if [[ -z "$ZEN_UPSTREAM" ]]; then
              echo '无法获取 Zen 当前官方版本。' >&2
              exit 1
            fi
          }

          add_migrated() {
            printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" >> "$MATRIX_FILE"
          }

          select_all_migrated() {
            add_migrated 'CopyQ' 'copyq/build_copyq.sh' 'copyq/dist' 'copyq.AppImage'
            add_migrated 'Flameshot' 'flameshot/build_flameshot.sh' 'flameshot/dist' 'flameshot.AppImage'
            add_migrated 'GoldenDict-ng' 'goldendict-ng/build_goldendict-ng.sh' 'goldendict-ng/dist' 'goldendict-ng.AppImage'
            add_migrated 'htop' 'htop/build_htop.sh' 'htop/dist' 'htop.AppImage'
            add_migrated 'i3wm' 'i3wm/build_i3wm.sh' 'i3wm/dist' 'i3.AppImage'
            add_migrated 'KeePassXC' 'keepassxc/build_keepassxc.sh' 'keepassxc/dist' 'keepassxc.AppImage'
            add_migrated 'kitty' 'kitty/build_kitty.sh' 'kitty/dist' 'kitty.AppImage'
            add_migrated 'mpv' 'mpv/build_mpv.sh' 'mpv/dist' 'mpv.AppImage'
            add_migrated 'nvtop' 'nvtop/build_nvtop.sh' 'nvtop/dist' 'nvtop.AppImage'
            add_migrated 'ripdrag' 'ripdrag/build_ripdrag.sh' 'ripdrag/dist' 'ripdrag.AppImage'
            add_migrated 'SMPlayer' 'smplayer/build_smplayer.sh' 'smplayer/dist' 'smplayer.AppImage'
            add_migrated 'Sunshine' 'sunshine/build_sunshine.sh' 'sunshine/dist' 'sunshine.AppImage'
            add_migrated 'FreeRDP' 'freerdp/build_freerdp.sh' 'freerdp/dist' 'xfreerdp3.AppImage'
            add_migrated 'Newsboat' 'newsboat/build_newsboat.sh' 'dist' 'newsboat.AppImage'
          }

          select_all() {
            ANTIGRAVITY_IDE_BUILD=true
            ANTIGRAVITY_BUILD=true
            CC_SWITCH_BUILD=true
            ZEN_BUILD=true
            ALACRITTY_BUILD=true
            KEYVIZ_BUILD=true
            REMMINA_BUILD=true
            select_all_migrated
          }

          select_migrated_script() {
            case "$1" in
              copyq/build_copyq.sh) add_migrated 'CopyQ' 'copyq/build_copyq.sh' 'copyq/dist' 'copyq.AppImage' ;;
              flameshot/build_flameshot.sh) add_migrated 'Flameshot' 'flameshot/build_flameshot.sh' 'flameshot/dist' 'flameshot.AppImage' ;;
              goldendict-ng/build_goldendict-ng.sh) add_migrated 'GoldenDict-ng' 'goldendict-ng/build_goldendict-ng.sh' 'goldendict-ng/dist' 'goldendict-ng.AppImage' ;;
              htop/build_htop.sh) add_migrated 'htop' 'htop/build_htop.sh' 'htop/dist' 'htop.AppImage' ;;
              i3wm/build_i3wm.sh) add_migrated 'i3wm' 'i3wm/build_i3wm.sh' 'i3wm/dist' 'i3.AppImage' ;;
              keepassxc/build_keepassxc.sh) add_migrated 'KeePassXC' 'keepassxc/build_keepassxc.sh' 'keepassxc/dist' 'keepassxc.AppImage' ;;
              kitty/build_kitty.sh) add_migrated 'kitty' 'kitty/build_kitty.sh' 'kitty/dist' 'kitty.AppImage' ;;
              mpv/build_mpv.sh) add_migrated 'mpv' 'mpv/build_mpv.sh' 'mpv/dist' 'mpv.AppImage' ;;
              nvtop/build_nvtop.sh) add_migrated 'nvtop' 'nvtop/build_nvtop.sh' 'nvtop/dist' 'nvtop.AppImage' ;;
              ripdrag/build_ripdrag.sh) add_migrated 'ripdrag' 'ripdrag/build_ripdrag.sh' 'ripdrag/dist' 'ripdrag.AppImage' ;;
              smplayer/build_smplayer.sh) add_migrated 'SMPlayer' 'smplayer/build_smplayer.sh' 'smplayer/dist' 'smplayer.AppImage' ;;
              sunshine/build_sunshine.sh) add_migrated 'Sunshine' 'sunshine/build_sunshine.sh' 'sunshine/dist' 'sunshine.AppImage' ;;
              freerdp/build_freerdp.sh) add_migrated 'FreeRDP' 'freerdp/build_freerdp.sh' 'freerdp/dist' 'xfreerdp3.AppImage' ;;
              newsboat/build_newsboat.sh) add_migrated 'Newsboat' 'newsboat/build_newsboat.sh' 'dist' 'newsboat.AppImage' ;;
              *) return 1 ;;
            esac
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              case "${SELECTED_SCRIPT:-all}" in
                all)
                  select_all
                  ;;
                "$ANTIGRAVITY_IDE_SCRIPT") ANTIGRAVITY_IDE_BUILD=true ;;
                "$ANTIGRAVITY_SCRIPT") ANTIGRAVITY_BUILD=true ;;
                "$CC_SWITCH_SCRIPT") CC_SWITCH_BUILD=true ;;
                "$ZEN_SCRIPT") ZEN_BUILD=true ;;
                "$ALACRITTY_SCRIPT") ALACRITTY_BUILD=true ;;
                "$KEYVIZ_SCRIPT") KEYVIZ_BUILD=true ;;
                "$REMMINA_SCRIPT") REMMINA_BUILD=true ;;
                *)
                  if ! select_migrated_script "${SELECTED_SCRIPT:-}"; then
                    echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2
                    exit 1
                  fi
                  ;;
              esac
              ;;

            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] ||
                 ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"
              else
                CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              fi

              printf '%s\n' "$CHANGED_FILES"

              if grep -Fxq '.github/workflows/build.yml' <<< "$CHANGED_FILES"; then
                select_all
              else
                if grep -Eq '^antigravity-ide/' <<< "$CHANGED_FILES"; then ANTIGRAVITY_IDE_BUILD=true; fi
                if grep -Eq '^antigravity/' <<< "$CHANGED_FILES"; then ANTIGRAVITY_BUILD=true; fi
                if grep -Eq '^cc-switch/' <<< "$CHANGED_FILES"; then CC_SWITCH_BUILD=true; fi
                if grep -Eq '^zen/' <<< "$CHANGED_FILES"; then ZEN_BUILD=true; fi
                if grep -Eq '^alacritty/' <<< "$CHANGED_FILES"; then ALACRITTY_BUILD=true; fi
                if grep -Eq '^Keyviz/' <<< "$CHANGED_FILES"; then KEYVIZ_BUILD=true; fi
                if grep -Eq '^remmina/' <<< "$CHANGED_FILES"; then REMMINA_BUILD=true; fi

                if grep -Eq '^copyq/' <<< "$CHANGED_FILES"; then select_migrated_script 'copyq/build_copyq.sh'; fi
                if grep -Eq '^flameshot/' <<< "$CHANGED_FILES"; then select_migrated_script 'flameshot/build_flameshot.sh'; fi
                if grep -Eq '^goldendict-ng/' <<< "$CHANGED_FILES"; then select_migrated_script 'goldendict-ng/build_goldendict-ng.sh'; fi
                if grep -Eq '^htop/' <<< "$CHANGED_FILES"; then select_migrated_script 'htop/build_htop.sh'; fi
                if grep -Eq '^i3wm/' <<< "$CHANGED_FILES"; then select_migrated_script 'i3wm/build_i3wm.sh'; fi
                if grep -Eq '^keepassxc/' <<< "$CHANGED_FILES"; then select_migrated_script 'keepassxc/build_keepassxc.sh'; fi
                if grep -Eq '^kitty/' <<< "$CHANGED_FILES"; then select_migrated_script 'kitty/build_kitty.sh'; fi
                if grep -Eq '^mpv/' <<< "$CHANGED_FILES"; then select_migrated_script 'mpv/build_mpv.sh'; fi
                if grep -Eq '^nvtop/' <<< "$CHANGED_FILES"; then select_migrated_script 'nvtop/build_nvtop.sh'; fi
                if grep -Eq '^ripdrag/' <<< "$CHANGED_FILES"; then select_migrated_script 'ripdrag/build_ripdrag.sh'; fi
                if grep -Eq '^smplayer/' <<< "$CHANGED_FILES"; then select_migrated_script 'smplayer/build_smplayer.sh'; fi
                if grep -Eq '^sunshine/' <<< "$CHANGED_FILES"; then select_migrated_script 'sunshine/build_sunshine.sh'; fi
                if grep -Eq '^freerdp/' <<< "$CHANGED_FILES"; then select_migrated_script 'freerdp/build_freerdp.sh'; fi
                if grep -Eq '^newsboat/' <<< "$CHANGED_FILES"; then select_migrated_script 'newsboat/build_newsboat.sh'; fi
              fi
              ;;

            schedule)
              get_antigravity_ide_upstream
              get_antigravity_upstream
              get_cc_switch_upstream
              get_zen_upstream

              if [[ "$ANTIGRAVITY_IDE_UPSTREAM" != "$(cat "$STATE_DIR/antigravity-ide.url" 2>/dev/null || true)" ]]; then
                ANTIGRAVITY_IDE_BUILD=true
              fi

              if [[ "$ANTIGRAVITY_UPSTREAM" != "$(cat "$STATE_DIR/antigravity.url" 2>/dev/null || true)" ]]; then
                ANTIGRAVITY_BUILD=true
              fi

              if [[ "$CC_SWITCH_UPSTREAM" != "$(cat "$STATE_DIR/cc-switch.version" 2>/dev/null || true)" ]]; then
                CC_SWITCH_BUILD=true
              fi

              if [[ "$ZEN_UPSTREAM" != "$(cat "$STATE_DIR/zen.version" 2>/dev/null || true)" ]]; then
                ZEN_BUILD=true
              fi
              ;;

            *)
              echo "不支持的触发事件：$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$ANTIGRAVITY_IDE_BUILD" == true && -z "$ANTIGRAVITY_IDE_UPSTREAM" ]]; then
            get_antigravity_ide_upstream
          fi

          if [[ "$ANTIGRAVITY_BUILD" == true && -z "$ANTIGRAVITY_UPSTREAM" ]]; then
            get_antigravity_upstream
          fi

          if [[ "$CC_SWITCH_BUILD" == true && -z "$CC_SWITCH_UPSTREAM" ]]; then
            get_cc_switch_upstream
          fi

          if [[ "$ZEN_BUILD" == true && -z "$ZEN_UPSTREAM" ]]; then
            get_zen_upstream
          fi

          MIGRATED_MATRIX="$(python3 - "$MATRIX_FILE" <<'PY'
          import csv
          import json
          import sys

          rows = []
          with open(sys.argv[1], newline='', encoding='utf-8') as handle:
              for name, script, artifact_dir, release_name in csv.reader(handle, delimiter='\t'):
                  rows.append({
                      'name': name,
                      'script': script,
                      'artifact_dir': artifact_dir,
                      'release_name': release_name,
                  })
          print(json.dumps({'include': rows}, separators=(',', ':')))
          PY
          )"
          MIGRATED_COUNT="$(wc -l < "$MATRIX_FILE" | tr -d ' ')"

          SHOULD_BUILD=false
          if [[ "$ANTIGRAVITY_IDE_BUILD" == true ||
                "$ANTIGRAVITY_BUILD" == true ||
                "$CC_SWITCH_BUILD" == true ||
                "$ZEN_BUILD" == true ||
                "$ALACRITTY_BUILD" == true ||
                "$KEYVIZ_BUILD" == true ||
                "$REMMINA_BUILD" == true ||
                "$MIGRATED_COUNT" -gt 0 ]]; then
            SHOULD_BUILD=true
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "antigravity_ide=$ANTIGRAVITY_IDE_BUILD" >> "$GITHUB_OUTPUT"
          echo "antigravity=$ANTIGRAVITY_BUILD" >> "$GITHUB_OUTPUT"
          echo "cc_switch=$CC_SWITCH_BUILD" >> "$GITHUB_OUTPUT"
          echo "zen=$ZEN_BUILD" >> "$GITHUB_OUTPUT"
          echo "migrated_matrix=$MIGRATED_MATRIX" >> "$GITHUB_OUTPUT"
          echo "migrated_count=$MIGRATED_COUNT" >> "$GITHUB_OUTPUT"
          echo "alacritty=$ALACRITTY_BUILD" >> "$GITHUB_OUTPUT"
          echo "keyviz=$KEYVIZ_BUILD" >> "$GITHUB_OUTPUT"
          echo "remmina=$REMMINA_BUILD" >> "$GITHUB_OUTPUT"
          echo "antigravity_ide_upstream=$ANTIGRAVITY_IDE_UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "antigravity_upstream=$ANTIGRAVITY_UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "cc_switch_upstream=$CC_SWITCH_UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "zen_upstream=$ZEN_UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG='latest'

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'latest' \
              --notes 'latest' \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'latest' \
              --notes 'latest' \
              --latest
          fi

  build_antigravity_ide:
    name: Build Antigravity IDE
    needs: plan
    if: needs.plan.outputs.antigravity_ide == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          su - builduser -c "git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin && cd /tmp/yay-bin && makepkg -si --noconfirm"
          echo '#!/bin/bash' > /usr/local/bin/yay
          echo 'sudo -HE -u builduser /usr/bin/yay "$@"' >> /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo pacman -Syu --noconfirm github-cli || yay -S --noconfirm github-cli

      - name: Build and publish Antigravity IDE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd antigravity-ide
          chmod +x build_antigravity-ide.sh
          ./build_antigravity-ide.sh
          test -s dist/antigravity-ide.AppImage

          gh release upload latest dist/antigravity-ide.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_antigravity:
    name: Build Antigravity
    needs: plan
    if: needs.plan.outputs.antigravity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          su - builduser -c "git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin && cd /tmp/yay-bin && makepkg -si --noconfirm"
          echo '#!/bin/bash' > /usr/local/bin/yay
          echo 'sudo -HE -u builduser /usr/bin/yay "$@"' >> /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo pacman -Syu --noconfirm github-cli || yay -S --noconfirm github-cli

      - name: Build and publish Antigravity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd antigravity
          chmod +x build_antigravity.sh
          ./build_antigravity.sh
          test -s dist/antigravity.AppImage

          gh release upload latest dist/antigravity.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_cc_switch:
    name: Build CC Switch
    needs: plan
    if: needs.plan.outputs.cc_switch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
