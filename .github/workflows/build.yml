            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release delete-asset latest remmina-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release upload latest remmina/dist/remmina.AppImage \
            --repo "$GITHUB_REPOSITORY" \
