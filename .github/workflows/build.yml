  verify_direct_appimage:
    name: Verify direct AppImage GUI launch
    needs: build_github_desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Install direct-launch smoke dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils fuse3 libfuse2

      - name: Download the just-published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'github-desktop.AppImage' \
            --clobber
          chmod +x github-desktop.AppImage
          sha256sum github-desktop.AppImage

      - name: Launch AppImage directly and require a visible GUI
        run: |
          set -Eeuo pipefail
          PROFILE="$RUNNER_TEMP/github-desktop-direct-profile"
          LOG="$RUNNER_TEMP/github-desktop-direct.log"
          WINDOWS="$RUNNER_TEMP/github-desktop-direct-windows.log"
          rm -rf "$PROFILE"
          mkdir -p "$PROFILE"

          set +e
          xvfb-run -a bash -c '
            set -u
            app="$1"
            profile="$2"
            log="$3"
            windows="$4"

            start_epoch="$(date +%s)"
            ELECTRON_ENABLE_LOGGING=1 "$app" \
              --user-data-dir="$profile" \
              >"$log" 2>&1 &
            app_pid=$!
            window_found=0

            for _ in $(seq 1 45); do
              window_id="$(xdotool search --onlyvisible --name "^GitHub Desktop$" 2>/dev/null | head -n 1 || true)"
              if [[ -n "$window_id" ]] && xwininfo -id "$window_id" 2>/dev/null | grep -q "Map State: IsViewable"; then
                window_found=1
                break
              fi

              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid"
                exit $?
              fi

              sleep 1
            done

            elapsed="$(( $(date +%s) - start_epoch ))"
            echo "Direct AppImage GUI startup: ${elapsed}s"
            xwininfo -root -tree >"$windows" 2>&1 || true

            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi

            if [[ "$window_found" -ne 1 ]]; then
              exit 125
            fi
          ' bash "$PWD/github-desktop.AppImage" "$PROFILE" "$LOG" "$WINDOWS"
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo "Direct AppImage GUI smoke failed: $rc" >&2
            echo '--- AppImage log ---' >&2
            tail -n 250 "$LOG" >&2 || true
            echo '--- X11 window tree ---' >&2
            tail -n 250 "$WINDOWS" >&2 || true
            exit "$rc"
          fi

          if grep -Fq 'Fontconfig warning: We will not regenerate the cache because some cache files were generated by a newer version' "$LOG"; then
            echo 'Fontconfig incompatible-cache warning detected in direct AppImage launch.' >&2
            tail -n 250 "$LOG" >&2 || true
            exit 126
          fi

