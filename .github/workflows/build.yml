  build_migrated_arch:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.migrated_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.migrated_matrix) }}

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '无法克隆 yay-bin。' >&2
              exit 1
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo pacman -Syu --noconfirm github-cli || yay -S --noconfirm github-cli

      - name: Build and publish AppImage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SCRIPT: ${{ matrix.script }}
          ARTIFACT_DIR: ${{ matrix.artifact_dir }}
          RELEASE_NAME: ${{ matrix.release_name }}
        run: |
          set -euo pipefail

          chmod +x "$BUILD_SCRIPT"
          SCRIPT_DIR="$(dirname "$BUILD_SCRIPT")"
          SCRIPT_NAME="$(basename "$BUILD_SCRIPT")"

          if [[ "$SCRIPT_DIR" == 'newsboat' ]]; then
            "$BUILD_SCRIPT"
          else
            (
              cd "$SCRIPT_DIR"
              "./$SCRIPT_NAME"
            )
          fi

          shopt -s nullglob
          ARTIFACTS=("$ARTIFACT_DIR"/*.AppImage)
          shopt -u nullglob

          if [[ ${#ARTIFACTS[@]} -ne 1 ]]; then
            echo "期望 $ARTIFACT_DIR 中恰好有 1 个 AppImage，实际为 ${#ARTIFACTS[@]}。" >&2
            printf '%s\n' "${ARTIFACTS[@]:-}"
            exit 1
          fi

          RELEASE_FILE="$RUNNER_TEMP/$RELEASE_NAME"
          cp -f "${ARTIFACTS[0]}" "$RELEASE_FILE"
          test -s "$RELEASE_FILE"

          gh release upload latest "$RELEASE_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

