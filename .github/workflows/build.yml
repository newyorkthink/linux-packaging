  build_keyviz:
    name: Build Keyviz
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).keyviz == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing anylinux Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin" && break
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: 静态检查并构建 Keyviz AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n Keyviz/build_keyviz.sh
          bash Keyviz/build_keyviz.sh
          test -s dist/keyviz.AppImage

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -S --noconfirm --needed github-cli
          gh release upload latest dist/keyviz.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_remmina:
    name: Build Remmina
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).remmina == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Remmina AppImage
        shell: bash
        run: |
          chmod +x remmina/build_remmina.sh
          set +e
          env -u GITHUB_ACTIONS ./remmina/build_remmina.sh > build-remmina.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "===== build-remmina.log 最后 300 行 ====="
            tail -n 300 build-remmina.log
            exit "$status"
          fi
          tail -n 120 build-remmina.log

      - name: Fix WebKitGTK and desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fcitx5-frontend-gtk3 \
            ibus-gtk3 \
            libgtk-3-bin

          chmod +x remmina/fix_remmina_webkit.sh
          ./remmina/fix_remmina_webkit.sh dist/remmina.AppImage 2>&1 | tee fix-remmina-webkit.log

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          test -s remmina/dist/remmina.AppImage
          chmod +x remmina/dist/remmina.AppImage
          file remmina/dist/remmina.AppImage

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset latest remmina-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release delete-asset latest remmina-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release upload latest remmina/dist/remmina.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

