          cat "$LOG"
          if grep -Eqi 'Could not load the Qt platform plugin|no Qt platform plugin could be initialized|error while loading shared libraries|Segmentation fault|Aborted' "$LOG"; then
            exit 1
          fi
          [[ "$rc" -eq 0 || "$rc" -eq 124 ]]
      - name: Upload software version metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-version-xnconvert
          path: xnconvert/dist/version.txt
          if-no-files-found: error
          retention-days: 1
      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload latest xnconvert/dist/xnconvert.AppImage --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish software version immediately
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: 'xnconvert'
          version_file: 'xnconvert/dist/version.txt'
          asset_name: 'xnconvert.AppImage'
          artifact_dir: 'xnconvert/dist'
          github_token: ${{ github.token }}


