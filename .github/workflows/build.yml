    permissions: *arch_permissions
    env: {BUILD_SCRIPT: 'cc-switch/build_cc-switch.sh', ARTIFACT_DIR: 'cc-switch/dist', RELEASE_NAME: 'cc-switch.AppImage', RUN_FROM_ROOT: 'false'}
    steps: *arch_steps

  build_zen:
