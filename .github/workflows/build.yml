    steps: *arch_steps

  build_trae_work:
    name: Build TraeWork
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).trae_work == 'true'
    runs-on: *arch_runner
    timeout-minutes: *arch_timeout
    container: *arch_container
    permissions: *arch_permissions

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '无法克隆 yay-bin。' >&2
              exit 1
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo pacman -Syu --noconfirm github-cli || yay -S --noconfirm github-cli

      - name: Build TraeWork AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x trae-work/build_trae-work.sh
          cd trae-work
          ./build_trae-work.sh

      - name: Smoke test under Xvfb
        shell: bash
        run: |
          set -uo pipefail
          LOG=trae-work/dist/smoke-test.log
          REPORT=trae-work/dist/port-report.txt
          mkdir -p "$(dirname "$LOG")"

          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 30s xvfb-run -a \
            ./trae-work/dist/trae-work.AppImage \
            --no-sandbox \
            --disable-gpu \
            --user-data-dir="$RUNNER_TEMP/trae-work-profile" \
            >"$LOG" 2>&1
          rc=$?
          set -e

          {
            echo
            echo '=== Xvfb smoke test ==='
            echo "exit_code=$rc"
            echo 'exit_code=124 means the GUI process survived until the 30-second timeout.'
            echo
            echo '=== Relevant smoke-test log lines ==='
            grep -Ei 'unknown service|solo-lite|projectservice|fatal|error' "$LOG" | tail -n 160 || true
          } >> "$REPORT"

          cat "$REPORT"

          if grep -Eqi 'unknown service:[[:space:]]*(lite|solo-lite)' "$LOG"; then
            echo 'Detected the historical lite/solo-lite service incompatibility.' >&2
            exit 1
          fi

          if [[ "$rc" -ne 0 && "$rc" -ne 124 ]]; then
            echo "TraeWork exited unexpectedly during smoke test: $rc" >&2
            exit "$rc"
          fi

      - name: Publish AppImage to latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -s trae-work/dist/trae-work.AppImage
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload latest trae-work/dist/trae-work.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

