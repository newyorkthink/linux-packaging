# 手动归档 rainlendar2-pro、moderncsv、xnviewmp 和固定版本 Sunshine 的官方原始包。
# 仅在 Actions 页面手动触发，不随 push、release 或定时运行。
name: Archive Original Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: 要下载并归档的软件
        required: true
        type: choice
        options:
          - rainlendar2-pro
          - moderncsv
          - xnviewmp
          - sunshine
          - all
      version:
        description: 指定版本（可选，留空保留最新 2 版并补齐缺失；填如 2、2.、2.x、2.4 则保留该线最高 2 版并清理更高和更旧版本）
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: archive-original-packages
  cancel-in-progress: false

jobs:
  archive:
    name: Archive ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync official packages to original-package-archive
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          RAW_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          [[ -n "${GITHUB_TOKEN:-}" ]] || {
            echo 'ERROR: missing GITHUB_TOKEN for authenticated GitHub API access' >&2
            exit 1
          }

          case "$PACKAGE" in
            rainlendar2-pro|moderncsv|xnviewmp|sunshine|all) ;;
            *)
              echo "ERROR: unsupported package: $PACKAGE" >&2
              exit 1
              ;;
          esac

          for command_name in dpkg dpkg-deb gh gpg gpgv gzip jq python3 sha256sum tar; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "ERROR: required command missing: $command_name" >&2
              exit 1
            }
          done

          # 归一化可选版本筛选：兼容 2、2.、2.x、2.*、v2.x、2.4、2.4.5 等写法。
          VERSION_FILTER="$(
            python3 - "$PACKAGE" "$RAW_VERSION" <<'PY'
          import re
          import sys

          package = sys.argv[1]
          raw = sys.argv[2].strip()
          if not raw:
              print("")
              raise SystemExit(0)

          if package == "all":
              raise SystemExit("ERROR: 选择 all 时不支持填写版本号，请单独选择具体软件。")
          if package == "sunshine":
              raise SystemExit("ERROR: sunshine 已固定锁定 2025.924.154138，不支持通过版本号覆盖。")

          normalized = raw
          if len(normalized) >= 2 and normalized[0] in ("v", "V") and normalized[1].isdigit():
              normalized = normalized[1:]
          normalized = re.sub(r"\.[xX*]$", "", normalized)
          normalized = normalized.rstrip(".")

          if (
              not normalized
              or "/" in normalized
              or ".." in normalized
              or not re.fullmatch(r"[0-9][0-9A-Za-z.+:~-]*", normalized)
          ):
              raise SystemExit(f"ERROR: 版本输入无效：{raw}")

          print(normalized)
          PY
          )"

          # shellcheck source=Common/github/github_api.sh
          source ./Common/github/github_api.sh

          BROWSER_UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ARCHIVE_DIR="$RUNNER_TEMP/original-package-archive"
          mkdir -p "$ARCHIVE_DIR"
          KEEP_LIST="$RUNNER_TEMP/archive-keep.txt"
          UPLOAD_LIST="$RUNNER_TEMP/archive-files.txt"
          REGEX_LIST="$RUNNER_TEMP/archive-regexes.txt"
          : > "$KEEP_LIST"
          : > "$UPLOAD_LIST"
          : > "$REGEX_LIST"

          # 通过公共认证入口分页读取 GitHub API 数组响应。
          fetch_github_pages() {
            local base_url="$1"
            local output_json="$2"
            local page=1
            local page_json="$RUNNER_TEMP/github-page.json"
            local merged_dir="$RUNNER_TEMP/github-pages-$$"
            rm -rf -- "$merged_dir"
            mkdir -p -- "$merged_dir"

            while (( page <= 50 )); do
              github_api_get "${base_url}&page=${page}" "$page_json"
              local count
              count="$(jq -r 'if type == "array" then length else error("expected JSON array") end' "$page_json")"
              cp -f -- "$page_json" "$merged_dir/$(printf '%03d.json' "$page")"
              (( count < 100 )) && break
              if (( page == 50 )); then
                echo "ERROR: GitHub API pagination exceeded 50 pages: $base_url" >&2
                exit 1
              fi
              page=$((page + 1))
            done

            jq -s 'add // []' "$merged_dir"/*.json > "$output_json"
            rm -rf -- "$merged_dir" "$page_json"
          }

          # 校验归档标签与 latest 标签状态，并在下载前读取归档 Release 现有资产清单。
          ARCHIVE_RELEASE_JSON="$RUNNER_TEMP/archive-release.json"
          LATEST_RELEASE_JSON="$RUNNER_TEMP/latest-release.json"
          ARCHIVE_ASSETS_JSON="$RUNNER_TEMP/archive-assets.json"
          github_api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/original-package-archive" \
            "$ARCHIVE_RELEASE_JSON"
          jq -e '.tag_name == "original-package-archive" and .draft == false and .prerelease == false' \
            "$ARCHIVE_RELEASE_JSON" >/dev/null
          ARCHIVE_RELEASE_ID="$(jq -er '.id | select(type == "number" and . > 0)' "$ARCHIVE_RELEASE_JSON")"

          github_api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" "$LATEST_RELEASE_JSON"
          jq -e '.tag_name == "latest" and .draft == false and .prerelease == false' "$LATEST_RELEASE_JSON" >/dev/null

          fetch_github_pages \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${ARCHIVE_RELEASE_ID}/assets?per_page=100" \
            "$ARCHIVE_ASSETS_JSON"

          # 检查归档 Release 中是否已存在同名、已上传且摘要符合预期的资产。
          archive_has_valid_asset() {
            local asset_name="$1"
            local expected_sha="${2:-}"
            python3 - "$ARCHIVE_ASSETS_JSON" "$asset_name" "$expected_sha" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              assets = json.load(stream)
          name = sys.argv[2]
          expected_sha = sys.argv[3].strip().lower()

          matches = [item for item in assets if isinstance(item, dict) and item.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(1)
          asset = matches[0]
          if asset.get("state") != "uploaded":
              raise SystemExit(1)
          digest = asset.get("digest") or ""
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-fA-F]{64}", digest):
              raise SystemExit(1)
          actual_sha = digest.split(":", 1)[1].lower()
          if expected_sha and actual_sha != expected_sha:
              raise SystemExit(1)
          raise SystemExit(0)
          PY
          }

          note_keep() {
            printf '%s\n' "$1" >> "$KEEP_LIST"
          }

          note_upload() {
            printf '%s\n' "$1" >> "$UPLOAD_LIST"
            sha256sum "$1"
          }

          note_regex() {
            printf '%s\n' "$1" >> "$REGEX_LIST"
          }

          archive_rainlendar() {
            ###### Rainlendar2 Pro：按版本筛选官方正式 Releases，保留最高 2 版并补齐缺失 ######
            local releases_json="$RUNNER_TEMP/rainlendar-releases.json"
            fetch_github_pages \
              'https://api.github.com/repos/rainlendar/Rainlendar-Resources/releases?per_page=100' "$releases_json"

            mapfile -t selected_rows < <(
              python3 - "$releases_json" "$VERSION_FILTER" <<'PY'
          import functools
          import json
          import re
          import subprocess
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              releases = json.load(stream)
          version_filter = sys.argv[2].strip()

          asset_re = re.compile(r"^rainlendar2-pro_([0-9][0-9A-Za-z.+:~-]*)_amd64\.deb$")
          tag_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")

          def matches_filter(ver):
              if not version_filter:
                  return True
              return (
                  ver == version_filter
                  or ver.startswith(version_filter + ".")
                  or ver.startswith(version_filter + "-")
              )

          def compare_versions(left, right):
              for relation, result in (("lt", -1), ("gt", 1)):
                  status = subprocess.run(
                      ["dpkg", "--compare-versions", left, relation, right], check=False,
                  ).returncode
                  if status == 0:
                      return result
                  if status != 1:
                      return -1 if left < right else (1 if left > right else 0)
              return 0

          by_version = {}
          for rel in releases:
              if not isinstance(rel, dict) or rel.get("draft") or rel.get("prerelease"):
                  continue
              tag = rel.get("tag_name") or ""
              if not isinstance(tag, str) or ".." in tag or not tag_re.fullmatch(tag):
                  continue
              hits = []
              for asset in rel.get("assets") or []:
                  if not isinstance(asset, dict) or asset.get("state") != "uploaded":
                      continue
                  name = asset.get("name") or ""
                  match = asset_re.fullmatch(name)
                  if not match:
                      continue
                  digest = asset.get("digest") or ""
                  if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-fA-F]{64}", digest):
                      continue
                  hits.append((match.group(1), tag, name, digest.split(":", 1)[1].lower()))
              if len(hits) != 1:
                  continue
              ver, tag, name, sha = hits[0]
              if not matches_filter(ver):
                  continue
              prev = by_version.get(ver)
              if prev and prev != (tag, name, sha):
                  raise SystemExit(f"ERROR: Rainlendar2 Pro 同一版本存在冲突资产：{ver}")
              by_version[ver] = (tag, name, sha)

          if not by_version:
              raise SystemExit(
                  f"ERROR: Rainlendar2 Pro 上游没有匹配版本（筛选：{version_filter or '最新'}）且带官方 SHA-256 的正式 Release。"
              )

          versions = sorted(by_version.keys(), key=functools.cmp_to_key(compare_versions), reverse=True)
          for ver in versions[:2]:
              tag, name, sha = by_version[ver]
              print(f"{ver}\t{tag}\t{name}\t{sha}")
          PY
            )

            (( ${#selected_rows[@]} > 0 )) || {
              echo 'ERROR: no Rainlendar2 Pro releases selected' >&2
              exit 1
            }

            local ver tag name sha
            for row in "${selected_rows[@]}"; do
              IFS=$'\t' read -r ver tag name sha <<< "$row"
              note_keep "$name"
              if archive_has_valid_asset "$name" "$sha"; then
                printf 'Rainlendar2 Pro already archived (skip download): %s\n' "$name"
              else
                ./Common/github/download_tagged_release_asset.sh \
                  rainlendar/Rainlendar-Resources "$tag" "$name" "$ARCHIVE_DIR/$name" >/dev/null
                printf '%s  %s\n' "$sha" "$ARCHIVE_DIR/$name" | sha256sum -c -
                dpkg-deb --contents "$ARCHIVE_DIR/$name" >/dev/null
                note_upload "$ARCHIVE_DIR/$name"
              fi
              printf 'Resolved Rainlendar2 Pro: %s (%s)\n' "$ver" "$name"
            done
            note_regex '^rainlendar2-pro_.*_amd64\.deb$'
          }

          archive_moderncsv() {
            ###### Modern CSV：从官方 /release/ 目录按版本筛选保留最高 2 版，3.x 同版一并归档签名 APT DEB ######
            local release_html="$RUNNER_TEMP/moderncsv-release-index.html"
            ./Common/download/download_file.sh 'https://www.moderncsv.com/release/' "$release_html" "" "$BROWSER_UA"

            mapfile -t selected_versions < <(
              python3 - "$release_html" "$VERSION_FILTER" <<'PY'
          import functools
          from html.parser import HTMLParser
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlparse

          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              html = stream.read()
          version_filter = sys.argv[2].strip()

          tar_re = re.compile(r"^ModernCSV-Linux-v([0-9][0-9A-Za-z.+:~-]*)\.tar\.gz$")
          found = set()

          class LinkCollector(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return
                  for key, value in attrs:
                      if key.lower() != "href" or not value:
                          continue
                      base = os.path.basename(urlparse(value).path)
                      match = tar_re.fullmatch(base)
                      if match:
                          ver = match.group(1)
                          if ".." not in ver:
                              found.add(ver)

          LinkCollector().feed(html)
          if not found:
              raise SystemExit(
                  "ERROR: 无法从 https://www.moderncsv.com/release/ 读取 Modern CSV 版本列表（可能触发官网校验或目录不可用）。"
              )

          def matches_filter(ver):
              if not version_filter:
                  return True
              return (
                  ver == version_filter
                  or ver.startswith(version_filter + ".")
                  or ver.startswith(version_filter + "-")
              )

          def compare_versions(left, right):
              for relation, result in (("lt", -1), ("gt", 1)):
                  status = subprocess.run(
                      ["dpkg", "--compare-versions", left, relation, right], check=False,
                  ).returncode
                  if status == 0:
                      return result
                  if status != 1:
                      return -1 if left < right else (1 if left > right else 0)
              return 0

          candidates = [ver for ver in found if matches_filter(ver)]
          if not candidates:
              raise SystemExit(f"ERROR: Modern CSV 上游目录中没有匹配版本：{version_filter}")

          candidates.sort(key=functools.cmp_to_key(compare_versions), reverse=True)
          for ver in candidates[:2]:
              print(ver)
          PY
            )

            (( ${#selected_versions[@]} > 0 )) || {
              echo 'ERROR: no Modern CSV versions selected' >&2
              exit 1
            }

            local apt_fetched=0
            local apt_version=""
            local apt_deb_tmp="$RUNNER_TEMP/moderncsv-apt.deb"
            local apt_version_file="$RUNNER_TEMP/moderncsv-apt.version"

            local ver tar_file deb_file
            for ver in "${selected_versions[@]}"; do
              tar_file="ModernCSV-Linux-v${ver}.tar.gz"
              note_keep "$tar_file"
              if archive_has_valid_asset "$tar_file"; then
                printf 'Modern CSV already archived (skip download): %s\n' "$tar_file"
              else
                ./Common/download/download_file.sh \
                  "https://www.moderncsv.com/release/${tar_file}" "$ARCHIVE_DIR/$tar_file" "" "$BROWSER_UA"
                gzip -t "$ARCHIVE_DIR/$tar_file"
                tar -tzf "$ARCHIVE_DIR/$tar_file" >/dev/null
                note_upload "$ARCHIVE_DIR/$tar_file"
              fi

              # 3.0 及以上版本同步保留或补齐官方签名 APT 同版本 DEB。
              if dpkg --compare-versions "$ver" ge 3.0; then
                deb_file="moderncsv_${ver}_amd64.deb"
                if archive_has_valid_asset "$deb_file"; then
                  note_keep "$deb_file"
                  printf 'Modern CSV DEB already archived (skip download): %s\n' "$deb_file"
                else
                  if (( apt_fetched == 0 )); then
                    ./Common/download/download_apt_repository_deb.sh \
                      https://www.moderncsv.com/release/apt stable main moderncsv amd64 \
                      https://www.moderncsv.com/release/apt/public.key \
                      "$apt_deb_tmp" "$apt_version_file" >/dev/null
                    apt_version="$(tr -d '\r\n' < "$apt_version_file")"
                    apt_fetched=1
                  fi
                  if [[ "$apt_version" == "$ver" ]]; then
                    cp -f -- "$apt_deb_tmp" "$ARCHIVE_DIR/$deb_file"
                    dpkg-deb --contents "$ARCHIVE_DIR/$deb_file" >/dev/null
                    note_keep "$deb_file"
                    note_upload "$ARCHIVE_DIR/$deb_file"
                  fi
                fi
              fi

              printf 'Resolved Modern CSV: %s\n' "$ver"
            done
            rm -f -- "$apt_deb_tmp" "$apt_version_file"
            note_regex '^moderncsv_.*_amd64\.deb$'
            note_regex '^ModernCSV-Linux-v.*\.tar\.gz$'
          }

          archive_xnview() {
            ###### XnView MP：按官方校验清单筛选同时具备 deb/tgz 的最高 2 版并补齐缺失 ######
            local checksum="$RUNNER_TEMP/XnView_MP-CHECKSUMS.txt"
            ./Common/download/download_file.sh \
              'https://download.xnview.com/versions/XnView_MP/XnView_MP-CHECKSUMS.txt' "$checksum"

            mapfile -t selected_rows < <(
              python3 - "$checksum" "$VERSION_FILTER" <<'PY'
          import functools
          import re
          import subprocess
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              lines = stream.readlines()
          version_filter = sys.argv[2].strip()

          line_re = re.compile(r"^([0-9a-fA-F]{64})\s+\*?(\S+)$")
          asset_re = re.compile(r"^XnView_MP-([0-9]+(?:\.[0-9]+)+)-linux-x64\.(deb|tgz)$")

          def matches_filter(ver):
              if not version_filter:
                  return True
              return (
                  ver == version_filter
                  or ver.startswith(version_filter + ".")
                  or ver.startswith(version_filter + "-")
              )

          def compare_versions(left, right):
              for relation, result in (("lt", -1), ("gt", 1)):
                  status = subprocess.run(
                      ["dpkg", "--compare-versions", left, relation, right], check=False,
                  ).returncode
                  if status == 0:
                      return result
                  if status != 1:
                      return -1 if left < right else (1 if left > right else 0)
              return 0

          by_version = {}
          for raw_line in lines:
              match = line_re.match(raw_line.strip())
              if not match:
                  continue
              sha = match.group(1).lower()
              name = match.group(2)
              asset_match = asset_re.fullmatch(name)
              if not asset_match:
                  continue
              ver, ext = asset_match.group(1), asset_match.group(2)
              entry = by_version.setdefault(ver, {})
              prev = entry.get(ext)
              if prev and prev != (name, sha):
                  raise SystemExit(f"ERROR: XnView 校验清单中同一文件存在冲突摘要：{name}")
              entry[ext] = (name, sha)

          complete = [
              ver for ver, items in by_version.items()
              if "deb" in items and "tgz" in items and matches_filter(ver)
          ]
          if not complete:
              raise SystemExit(f"ERROR: XnView 官方校验清单中没有匹配的完整版本：{version_filter or '最新'}")

          complete.sort(key=functools.cmp_to_key(compare_versions), reverse=True)
          for ver in complete[:2]:
              deb_name, deb_sha = by_version[ver]["deb"]
              tgz_name, tgz_sha = by_version[ver]["tgz"]
              print(f"{ver}\t{deb_name}\t{deb_sha}\t{tgz_name}\t{tgz_sha}")
          PY
            )

            (( ${#selected_rows[@]} > 0 )) || {
              echo 'ERROR: no XnView MP versions selected' >&2
              exit 1
            }

            local ver deb_file deb_sha tgz_file tgz_sha
            for row in "${selected_rows[@]}"; do
              IFS=$'\t' read -r ver deb_file deb_sha tgz_file tgz_sha <<< "$row"
              note_keep "$deb_file"
              note_keep "$tgz_file"

              if archive_has_valid_asset "$deb_file" "$deb_sha"; then
                printf 'XnView MP already archived (skip download): %s\n' "$deb_file"
              else
                ./Common/download/download_file.sh \
                  "https://download.xnview.com/versions/XnView_MP/${deb_file}" "$ARCHIVE_DIR/$deb_file" "$deb_sha"
                dpkg-deb --contents "$ARCHIVE_DIR/$deb_file" >/dev/null
                note_upload "$ARCHIVE_DIR/$deb_file"
              fi

              if archive_has_valid_asset "$tgz_file" "$tgz_sha"; then
                printf 'XnView MP already archived (skip download): %s\n' "$tgz_file"
              else
                ./Common/download/download_file.sh \
                  "https://download.xnview.com/versions/XnView_MP/${tgz_file}" "$ARCHIVE_DIR/$tgz_file" "$tgz_sha"
                gzip -t "$ARCHIVE_DIR/$tgz_file"
                tar -tzf "$ARCHIVE_DIR/$tgz_file" >/dev/null
                note_upload "$ARCHIVE_DIR/$tgz_file"
              fi

              printf 'Resolved XnView MP: %s\n' "$ver"
            done
            note_regex '^XnView_MP-[0-9]+(\.[0-9]+)+-linux-x64\.(deb|tgz)$'
          }

          archive_sunshine() {
            ###### Sunshine：固定锁死 2025.924.154138，不跟随新版，缺失时自动补传 ######
            local version='2025.924.154138'
            local tag="v${version}"
            local deb_name="sunshine-${version}-debian-trixie-amd64.deb"
            local zst_name="sunshine-${version}.pkg.tar.zst"
            local deb_sha='eb74caedb8c03215b6897a4a9e0d24efeb02d13a917c86c4ac5180693d39bad0'
            local zst_sha='2d7be01ffde6fb346c86f102edb5158b513db5f194c0481cd5e782cadafd9c3c'

            note_keep "$deb_name"
            note_keep "$zst_name"

            if archive_has_valid_asset "$deb_name" "$deb_sha"; then
              printf 'Sunshine already archived (skip download): %s\n' "$deb_name"
            else
              ./Common/github/download_tagged_release_asset.sh \
                LizardByte/Sunshine "$tag" 'sunshine-debian-trixie-amd64.deb' "$ARCHIVE_DIR/$deb_name" >/dev/null
              printf '%s  %s\n' "$deb_sha" "$ARCHIVE_DIR/$deb_name" | sha256sum -c -
              dpkg-deb --contents "$ARCHIVE_DIR/$deb_name" >/dev/null
              note_upload "$ARCHIVE_DIR/$deb_name"
            fi

            if archive_has_valid_asset "$zst_name" "$zst_sha"; then
              printf 'Sunshine already archived (skip download): %s\n' "$zst_name"
            else
              ./Common/github/download_tagged_release_asset.sh \
                LizardByte/Sunshine "$tag" 'sunshine.pkg.tar.zst' "$ARCHIVE_DIR/$zst_name" >/dev/null
              printf '%s  %s\n' "$zst_sha" "$ARCHIVE_DIR/$zst_name" | sha256sum -c -
              note_upload "$ARCHIVE_DIR/$zst_name"
            fi

            note_regex '^sunshine-.+\.(deb|pkg\.tar\.zst)$'
            printf 'Resolved Sunshine (locked): %s\n' "$version"
          }

          case "$PACKAGE" in
            rainlendar2-pro) archive_rainlendar ;;
            moderncsv) archive_moderncsv ;;
            xnviewmp) archive_xnview ;;
            sunshine) archive_sunshine ;;
            all)
              archive_rainlendar
              archive_moderncsv
              archive_xnview
              archive_sunshine
              ;;
          esac

          mapfile -t keep_names < <(sort -u "$KEEP_LIST")
          mapfile -t upload_files < <(awk '!seen[$0]++' "$UPLOAD_LIST")
          mapfile -t cleanup_regexes < <(sort -u "$REGEX_LIST")

          (( ${#keep_names[@]} > 0 )) || {
            echo 'ERROR: no target archive assets resolved' >&2
            exit 1
          }

          # 先补齐或替换缺失/校验不符的目标资产，确认全部就位后再清理旧版与高于指定线的版本。
          if (( ${#upload_files[@]} > 0 )); then
            for file_path in "${upload_files[@]}"; do
              [[ -s "$file_path" ]] || {
                echo "ERROR: downloaded file is empty: $file_path" >&2
                exit 1
              }
              asset_name="$(basename -- "$file_path")"
              if jq -e --arg name "$asset_name" 'any(.[]; .name == $name)' "$ARCHIVE_ASSETS_JSON" >/dev/null; then
                echo "Replacing mismatched archive asset: $asset_name"
                bash ./Scripts/release/delete_asset.sh \
                  --repo "$GITHUB_REPOSITORY" --tag original-package-archive --asset "$asset_name" --yes
              fi
            done
            gh release upload original-package-archive "${upload_files[@]}" --repo "$GITHUB_REPOSITORY"
          else
            echo 'All target archive assets are already present; skipping upload.'
          fi

          # 复核归档 Release，确认全部目标资产均已上传且具备有效摘要后，再执行清理。
          ARCHIVE_ASSETS_AFTER_JSON="$RUNNER_TEMP/archive-assets-after.json"
          fetch_github_pages \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${ARCHIVE_RELEASE_ID}/assets?per_page=100" \
            "$ARCHIVE_ASSETS_AFTER_JSON"

          python3 - "$ARCHIVE_ASSETS_AFTER_JSON" "$KEEP_LIST" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              assets = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              keep = sorted({line.strip() for line in stream if line.strip()})

          uploaded = {}
          for item in assets:
              if not isinstance(item, dict) or item.get("state") != "uploaded":
                  continue
              name = item.get("name") or ""
              digest = item.get("digest") or ""
              if name and isinstance(digest, str) and re.fullmatch(r"sha256:[0-9a-fA-F]{64}", digest):
                  uploaded[name] = digest

          missing = [name for name in keep if name not in uploaded]
          if missing:
              raise SystemExit(f"ERROR: 目标归档资产未全部就位，已中止清理：{', '.join(missing)}")
          print(f"Verified target archive assets ({len(keep)}): {', '.join(keep)}")
          PY

          while IFS= read -r asset_name; do
            [[ -n "$asset_name" ]] || continue
            matched=0
            for asset_regex in "${cleanup_regexes[@]}"; do
              if [[ "$asset_name" =~ $asset_regex ]]; then
                matched=1
                break
              fi
            done
            (( matched == 1 )) || continue
            if grep -Fxq -- "$asset_name" "$KEEP_LIST"; then
              continue
            fi
            echo "Deleting outdated or out-of-range archive asset: $asset_name"
            bash ./Scripts/release/delete_asset.sh \
              --repo "$GITHUB_REPOSITORY" --tag original-package-archive --asset "$asset_name" --yes
          done < <(jq -r '.[].name // empty' "$ARCHIVE_ASSETS_AFTER_JSON" | sort -u)
