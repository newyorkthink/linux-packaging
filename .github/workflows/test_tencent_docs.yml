name: Integrate Tencent Docs AppImage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_tencent_docs.yml'

permissions:
  contents: write

jobs:
  integrate_tencent_docs:
    name: Integrate Tencent Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate into unified workflow
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/integrate_tencent_docs.py <<'PY'
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text(encoding='utf-8')

          def insert_before(marker: str, addition: str) -> None:
              global text
              if addition in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f'无法唯一定位 workflow 锚点: {marker!r}')
              text = text.replace(marker, addition + marker, 1)

          # 路径过滤：放在 workflow 自身之前，不依赖某个应用恰好排在最后。
          insert_before(
              "      - '.github/workflows/build.yml'\n",
              "      - 'tencent-docs/**'\n",
          )

          # workflow_dispatch：放在 permissions 前，避免依赖 XMind/Stacher 等并行项目的顺序。
          insert_before(
              "\npermissions:\n",
              "          - tencent-docs/build_tencent-docs.sh\n",
          )

          lines = text.splitlines(keepends=True)
          array_tokens = {
              'KEYS': 'tencent_docs',
              'SCRIPTS': "'tencent-docs/build_tencent-docs.sh'",
              'DIRS': 'tencent-docs',
          }
          for array_name, token in array_tokens.items():
              matches = [i for i, line in enumerate(lines) if line.lstrip().startswith(f'{array_name}=(')]
              if len(matches) != 1:
                  raise SystemExit(f'无法唯一定位 {array_name} 数组。')
              index = matches[0]
              values = lines[index]
              if token in values:
                  continue
              stripped = values.rstrip('\n')
              if not stripped.endswith(')'):
                  raise SystemExit(f'{array_name} 数组格式异常。')
              lines[index] = stripped[:-1] + f' {token})\n'
          text = ''.join(lines)

          job = """

  build_tencent_docs:
    name: Build Tencent Docs
    needs: plan
    if: fromJSON(needs.plan.outputs.builds).tencent_docs == 'true'
    runs-on: *arch_runner
    container: *arch_container
    permissions: *arch_permissions
    env:
      BUILD_SCRIPT: tencent-docs/build_tencent-docs.sh
      ARTIFACT_DIR: tencent-docs/dist
      RELEASE_NAME: tencent-docs.AppImage
      RUN_FROM_ROOT: "0"
    steps: *arch_steps
          """.strip('\n') + '\n'

          if '\n  build_tencent_docs:\n' not in text:
              text = text.rstrip() + '\n\n' + job

          workflow.write_text(text, encoding='utf-8')
          PY

          cat > /tmp/validate_tencent_docs.py <<'PY'
          import re
          import shlex
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          yaml.safe_load(text)

          def parse_array(name: str):
              match = re.search(rf'^\s*{name}=\((.*)\)$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'缺少 {name} 数组。')
              return shlex.split(match.group(1))

          keys = parse_array('KEYS')
          scripts = parse_array('SCRIPTS')
          dirs = parse_array('DIRS')
          if not (len(keys) == len(scripts) == len(dirs)):
              raise SystemExit('KEYS/SCRIPTS/DIRS 长度不一致。')

          mapping = dict(zip(keys, zip(scripts, dirs)))
          expected = ('tencent-docs/build_tencent-docs.sh', 'tencent-docs')
          if mapping.get('tencent_docs') != expected:
              raise SystemExit(f'Tencent Docs plan 映射异常：{mapping.get("tencent_docs")}')

          checks = {
              "      - 'tencent-docs/**'\n": 'push path',
              '          - tencent-docs/build_tencent-docs.sh\n': 'workflow_dispatch option',
              '\n  build_tencent_docs:\n': 'build job',
              '      BUILD_SCRIPT: tencent-docs/build_tencent-docs.sh\n': 'job build script',
              '      ARTIFACT_DIR: tencent-docs/dist\n': 'job artifact dir',
              '      RELEASE_NAME: tencent-docs.AppImage\n': 'job release name',
          }
          for needle, label in checks.items():
              if text.count(needle) != 1:
                  raise SystemExit(f'Tencent Docs {label} 数量异常。')
          PY

          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Integration attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            python3 /tmp/integrate_tencent_docs.py

            cat > tencent-docs/README.md <<'README_EOF'
          # Tencent Docs

          将腾讯文档官方 Linux Debian 包封装为 AppImage。

          - 上游包：`https://docs.qq.com/api/package/get?channel_id=30001&version_id=latest&package_name=TencentDocs-x64.deb`
          - 保留官方 `/opt/腾讯文档` Electron 运行时及 resources（含 app.asar 和原生模块）
          - 不替换上游 Electron，不修改 app.asar
          - 仅补齐 AppImage 运行时依赖和入口
          - 产物：`tencent-docs.AppImage`
          - 统一构建入口：`.github/workflows/build.yml`
          README_EOF

            rm -f .github/workflows/test_tencent_docs.yml

            bash -n tencent-docs/build_tencent-docs.sh
            python3 /tmp/validate_tencent_docs.py
            git diff --check

            mapfile -t changed_files < <(git status --porcelain=v1 | sed -E 's/^.. //')
            printf '%s\n' "${changed_files[@]}" | sort > /tmp/tencent-docs-changed-files
            printf '%s\n' \
              '.github/workflows/build.yml' \
              '.github/workflows/test_tencent_docs.yml' \
              'tencent-docs/README.md' \
              | sort > /tmp/tencent-docs-expected-files
            diff -u /tmp/tencent-docs-expected-files /tmp/tencent-docs-changed-files

            git add .github/workflows/build.yml .github/workflows/test_tencent_docs.yml tencent-docs/README.md
            git commit -m 'build: integrate Tencent Docs AppImage'
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo '连续 3 次非强推均遇到 main 并发更新，停止以避免覆盖其他改动。' >&2
          exit 1
