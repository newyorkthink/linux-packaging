name: Integrate Tencent Docs AppImage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test_tencent_docs.yml'

permissions:
  contents: write

jobs:
  integrate:
    name: Integrate Tencent Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch latest main and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Integration attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            test -f tencent-docs/.integrate_workflow.py

            python3 tencent-docs/.integrate_workflow.py
            bash -n tencent-docs/build_tencent-docs.sh
            ruby -e "require 'yaml'; YAML.load_file('.github/workflows/build.yml', aliases: true)"
            git diff --check

            mapfile -t changed_files < <(git status --porcelain=v1 | sed -E 's/^.. //')
            printf '%s\n' "${changed_files[@]}" | sort > /tmp/tencent-docs-changed-files
            printf '%s\n' \
              '.github/workflows/build.yml' \
              '.github/workflows/test_tencent_docs.yml' \
              'tencent-docs/.integrate_workflow.py' \
              'tencent-docs/README.md' \
              | sort > /tmp/tencent-docs-expected-files
            diff -u /tmp/tencent-docs-expected-files /tmp/tencent-docs-changed-files

            git add -A -- .github/workflows/build.yml .github/workflows/test_tencent_docs.yml tencent-docs/.integrate_workflow.py tencent-docs/README.md
            git commit -m 'build: integrate Tencent Docs AppImage'
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'main changed during all 3 attempts; stopped without force-pushing.' >&2
          exit 1
