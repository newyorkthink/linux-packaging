# 统一 RunImage 构建入口；每个 RunImage 都使用独立 Job、独立 runner，不使用 Matrix。
name: Build RunImages
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.script_to_build == 'all' && 'Build all RunImages' || format('Build {0}', inputs.script_to_build)) || github.event_name == 'schedule' && 'Daily build all RunImages' || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - 'runimage/setup_browser.sh'
      - 'runimage/setup_general_env.sh'
      - 'runimage/setup_trading_env.sh'
      - 'runimage/setup_jriver.sh'
      - 'runimage/setup_touchegg.sh'
      - '.github/workflows/build_runimage.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      script_to_build:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - runimage/setup_browser.sh
          - runimage/setup_general_env.sh
          - runimage/setup_trading_env.sh
          - runimage/setup_jriver.sh
          - runimage/setup_touchegg.sh

permissions:
  contents: write

jobs:
  plan:
    name: Plan RunImages
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      general_env: ${{ steps.plan.outputs.general_env }}
      trading_env: ${{ steps.plan.outputs.trading_env }}
      jriver: ${{ steps.plan.outputs.jriver }}
      touchegg: ${{ steps.plan.outputs.touchegg }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Select RunImage build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          KEYS=(browser general_env trading_env jriver touchegg)
          SCRIPTS=(
            'runimage/setup_browser.sh'
            'runimage/setup_general_env.sh'
            'runimage/setup_trading_env.sh'
            'runimage/setup_jriver.sh'
            'runimage/setup_touchegg.sh'
          )

          declare -A BUILD SCRIPT_KEY
          for i in "${!KEYS[@]}"; do
            key="${KEYS[$i]}"
            script="${SCRIPTS[$i]}"
            BUILD[$key]=false
            SCRIPT_KEY[$script]="$key"
          done

          select_all() {
            for key in "${KEYS[@]}"; do
              BUILD[$key]=true
            done
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "${SELECTED_SCRIPT:-all}" == all ]]; then
                select_all
              elif [[ -n "${SCRIPT_KEY[${SELECTED_SCRIPT:-}]:-}" ]]; then
                BUILD["${SCRIPT_KEY[$SELECTED_SCRIPT]}"]=true
              else
                echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2
                exit 1
              fi
              ;;

            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"
              else
                CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              fi

              if grep -Fxq '.github/workflows/build_runimage.yml' <<< "$CHANGED_FILES"; then
                select_all
              else
                for i in "${!SCRIPTS[@]}"; do
                  script="${SCRIPTS[$i]}"
                  key="${KEYS[$i]}"
                  if grep -Fxq "$script" <<< "$CHANGED_FILES"; then
                    BUILD[$key]=true
                  fi
                done
              fi
              ;;

            schedule)
              select_all
              ;;

            *)
              echo "不支持的触发事件：$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          SHOULD_BUILD=false
          for key in "${KEYS[@]}"; do
            echo "$key=${BUILD[$key]}" >> "$GITHUB_OUTPUT"
            if [[ "${BUILD[$key]}" == true ]]; then
              SHOULD_BUILD=true
            fi
          done
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title latest --notes latest --latest
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes latest --latest
          fi

  build_browser:
    name: Build Browser RunImage
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: &runimage_runner ubuntu-latest
    timeout-minutes: &runimage_timeout 60
    permissions: &runimage_permissions {contents: write}
    env: {SCRIPT: 'runimage/setup_browser.sh'}
    steps: &runimage_steps
      - name: Checkout Code
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Install FUSE and allow unprivileged user namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Download RunImage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if wget https://github.com/VHSgunzo/runimage/releases/latest/download/runimage-x86_64 -O "$RUNNER_TEMP/runimage-x86_64"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "错误：RunImage 下载连续 5 次失败" >&2
              exit 1
            fi
            echo "RunImage 下载失败（第 $attempt 次），5 秒后重试" >&2
            sleep 5
          done
          chmod +x "$RUNNER_TEMP/runimage-x86_64"

      - name: Build and publish RunImage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "$SCRIPT"
          SCRIPT_DIR="$(dirname "$SCRIPT")"
          SCRIPT_FILE="$(basename "$SCRIPT")"
          RUNIMAGE_BIN="$RUNNER_TEMP/runimage-x86_64"

          pushd "$SCRIPT_DIR" >/dev/null
          RIM_NO_NVIDIA_CHECK=1 RIM_OVERFS_MODE=1 "$RUNIMAGE_BIN" "./$SCRIPT_FILE"
          OUTPUT_NAME="$(awk '/^[[:space:]]*rim-build[[:space:]]+/ {print $NF}' "$SCRIPT_FILE" | tail -n 1)"
          popd >/dev/null

          if [[ -z "$OUTPUT_NAME" ]]; then
            echo "错误：无法从 $SCRIPT 读取 rim-build 输出名称" >&2
            exit 1
          fi

          OUTPUT_PATH="$SCRIPT_DIR/$OUTPUT_NAME"
          if [[ ! -f "$OUTPUT_PATH" ]]; then
            echo "错误：未找到构建产物 $OUTPUT_PATH" >&2
            exit 1
          fi

          gh release upload latest "$OUTPUT_PATH" --repo "$GITHUB_REPOSITORY" --clobber

  build_general_env:
    name: Build General Env RunImage
    needs: plan
    if: needs.plan.outputs.general_env == 'true'
    runs-on: *runimage_runner
    timeout-minutes: *runimage_timeout
    permissions: *runimage_permissions
    env: {SCRIPT: 'runimage/setup_general_env.sh'}
    steps: *runimage_steps

  build_trading_env:
    name: Build Trading Env RunImage
    needs: plan
    if: needs.plan.outputs.trading_env == 'true'
    runs-on: *runimage_runner
    timeout-minutes: *runimage_timeout
    permissions: *runimage_permissions
    env: {SCRIPT: 'runimage/setup_trading_env.sh'}
    steps: *runimage_steps

  build_jriver:
    name: Build JRiver RunImage
    needs: plan
    if: needs.plan.outputs.jriver == 'true'
    runs-on: *runimage_runner
    timeout-minutes: *runimage_timeout
    permissions: *runimage_permissions
    env: {SCRIPT: 'runimage/setup_jriver.sh'}
    steps: *runimage_steps

  build_touchegg:
    name: Build Touchegg RunImage
    needs: plan
    if: needs.plan.outputs.touchegg == 'true'
    runs-on: *runimage_runner
    timeout-minutes: *runimage_timeout
    permissions: *runimage_permissions
    env: {SCRIPT: 'runimage/setup_touchegg.sh'}
    steps: *runimage_steps
