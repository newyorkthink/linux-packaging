name: Test v2rayN AppImage

on:
  push:
    branches: [main]
    paths:
      - 'v2rayn/**'
      - '.github/workflows/test-v2rayn.yml'

permissions:
  contents: read

jobs:
  test_v2rayn:
    name: Test v2rayN
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '无法克隆 yay-bin。' >&2
              exit 1
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Build and validate v2rayN AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n v2rayn/build_v2rayn.sh
          chmod +x v2rayn/build_v2rayn.sh
          cd v2rayn
          ./build_v2rayn.sh
          test -s dist/v2rayn.AppImage
          test -s dist/v2rayn.AppImage.sha256
