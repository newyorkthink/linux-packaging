name: Finalize Stacher Packaging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-stacher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize_stacher:
    name: Finalize Stacher Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate final Stacher commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shlex

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')

          markers = (
              "      - 'stacher/**'",
              '          - stacher/build_stacher.sh',
              '  build_stacher:',
          )
          if any(marker in text for marker in markers):
              raise SystemExit('检测到 Stacher 已部分或完整接入，拒绝重复修改。')

          workflow_marker = "      - '.github/workflows/build.yml'"
          if text.count(workflow_marker) != 1:
              raise SystemExit('无法唯一定位 build.yml push path。')
          text = text.replace(
              workflow_marker,
              "      - 'stacher/**'\n" + workflow_marker,
              1,
          )

          permissions_marker = '\npermissions:\n'
          if text.count(permissions_marker) != 1:
              raise SystemExit('无法唯一定位顶层 permissions。')
          text = text.replace(
              permissions_marker,
              '\n          - stacher/build_stacher.sh\n\npermissions:\n',
              1,
          )

          def append_array(name: str, value: str) -> None:
              global text
              match = re.search(rf'^(\s*{re.escape(name)}=\()(.*)(\))$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'无法唯一定位 {name} 数组。')
              values = shlex.split(match.group(2))
              if name == 'KEYS':
                  expected = 'stacher'
              elif name == 'SCRIPTS':
                  expected = 'stacher/build_stacher.sh'
              else:
                  expected = 'stacher'
              if expected in values:
                  raise SystemExit(f'{name} 已包含 Stacher，拒绝重复添加。')
              replacement = match.group(1) + match.group(2) + ' ' + value + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]

          append_array('KEYS', 'stacher')
          append_array('SCRIPTS', "'stacher/build_stacher.sh'")
          append_array('DIRS', 'stacher')

          job = """

          build_stacher:
            name: Build Stacher
            needs: plan
            if: fromJSON(needs.plan.outputs.builds).stacher == 'true'
            runs-on: *arch_runner
            timeout-minutes: 90
            container: *arch_container
            permissions: *arch_permissions
            env: {BUILD_SCRIPT: 'stacher/build_stacher.sh', ARTIFACT_DIR: 'stacher/dist', RELEASE_NAME: 'stacher.AppImage', RUN_FROM_ROOT: 'false'}
            steps: *arch_steps
          """
          text = text.rstrip() + job
          path.write_text(text, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          for marker in markers:
              if final.count(marker) != 1:
                  raise SystemExit(f'Stacher 接入标记数量异常：{marker}')

          def array_values(name: str):
              match = re.search(rf'^\s*{re.escape(name)}=\((.*)\)$', final, re.MULTILINE)
              if not match:
                  raise SystemExit(f'无法读取 {name} 数组。')
              return shlex.split(match.group(1))

          keys = array_values('KEYS')
          scripts = array_values('SCRIPTS')
          dirs = array_values('DIRS')
          if not (len(keys) == len(scripts) == len(dirs)):
              raise SystemExit(f'KEYS/SCRIPTS/DIRS 长度不一致：{len(keys)}/{len(scripts)}/{len(dirs)}')
          if list(zip(keys, scripts, dirs)).count(('stacher', 'stacher/build_stacher.sh', 'stacher')) != 1:
              raise SystemExit('Stacher plan 映射不唯一或不一致。')
          PY

          git rm .github/workflows/test-stacher.yml
          chmod 0755 stacher/build_stacher.sh
          bash -n stacher/build_stacher.sh
          git add --chmod=+x stacher/build_stacher.sh
          git add .github/workflows/build.yml
          git diff --cached --check

          echo '===== Final Stacher diff ====='
          git diff --cached --stat
          git diff --cached -- .github/workflows/build.yml .github/workflows/test-stacher.yml stacher/build_stacher.sh

          git commit -m 'feat: add Stacher AppImage packaging'
          FINAL_STACHER_COMMIT="$(git rev-parse HEAD)"
          echo "FINAL_STACHER_COMMIT=$FINAL_STACHER_COMMIT"

          set +e
          git push origin HEAD:main
          push_rc=$?
          set -e
          echo "PUSH_RC=$push_rc"
          exit 0
