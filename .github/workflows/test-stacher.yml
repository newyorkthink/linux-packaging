name: Test Stacher Packaging

on:
  push:
    branches: [main]
    paths:
      - 'stacher/**'
      - '.github/workflows/test-stacher.yml'

permissions:
  contents: write

jobs:
  test_stacher:
    name: Test Stacher AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Build, validate, and publish Stacher AppImage
        uses: ./.github/actions/build-anylinux
        with:
          build_script: stacher/build_stacher.sh
          artifact_dir: stacher/dist
          release_name: stacher.AppImage
          run_from_root: 'false'
          github_token: ${{ github.token }}

      - name: Integrate Stacher into unified workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -S --noconfirm --needed python python-yaml

          git config --global --add safe.directory '*'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shlex

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')

          def array_values(name: str):
              match = re.search(rf'^\s*{re.escape(name)}=\((.*)\)$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'无法定位 {name} 数组。')
              return shlex.split(match.group(1))

          markers = {
              'push path': "      - 'stacher/**'",
              'dispatch option': '          - stacher/build_stacher.sh',
              'job': '  build_stacher:',
          }
          keys = array_values('KEYS')
          scripts = array_values('SCRIPTS')
          dirs = array_values('DIRS')
          present = {
              **{name: marker in text for name, marker in markers.items()},
              'KEYS': 'stacher' in keys,
              'SCRIPTS': 'stacher/build_stacher.sh' in scripts,
              'DIRS': 'stacher' in dirs,
          }

          if any(present.values()) and not all(present.values()):
              raise SystemExit(f'Stacher 统一 workflow 存在部分接入，拒绝自动覆盖：{present}')

          if not all(present.values()):
              lines = text.splitlines()

              workflow_path = "      - '.github/workflows/build.yml'"
              try:
                  path_index = lines.index(workflow_path)
              except ValueError as exc:
                  raise SystemExit('无法定位 build.yml 的 push.paths。') from exc
              lines.insert(path_index, "      - 'stacher/**'")

              try:
                  permissions_index = lines.index('permissions:')
              except ValueError as exc:
                  raise SystemExit('无法定位顶层 permissions。') from exc
              option_index = permissions_index
              while option_index > 0 and lines[option_index - 1] == '':
                  option_index -= 1
              lines.insert(option_index, '          - stacher/build_stacher.sh')

              def append_shell_array(name: str, value: str) -> None:
                  for index, line in enumerate(lines):
                      if line.lstrip().startswith(f'{name}=(') and line.endswith(')'):
                          lines[index] = line[:-1] + f' {value})'
                          return
                  raise SystemExit(f'无法定位 {name} 数组。')

              append_shell_array('KEYS', 'stacher')
              append_shell_array('SCRIPTS', "'stacher/build_stacher.sh'")
              append_shell_array('DIRS', 'stacher')

              job_block = (
                  "\n\n  build_stacher:\n"
                  "    name: Build Stacher\n"
                  "    needs: plan\n"
                  "    if: fromJSON(needs.plan.outputs.builds).stacher == 'true'\n"
                  "    runs-on: *arch_runner\n"
                  "    timeout-minutes: 90\n"
                  "    container: *arch_container\n"
                  "    permissions: *arch_permissions\n"
                  "    env: {BUILD_SCRIPT: 'stacher/build_stacher.sh', ARTIFACT_DIR: 'stacher/dist', RELEASE_NAME: 'stacher.AppImage', RUN_FROM_ROOT: 'false'}\n"
                  "    steps: *arch_steps\n"
              )
              text = '\n'.join(lines).rstrip() + job_block
              path.write_text(text, encoding='utf-8')

          text = path.read_text(encoding='utf-8')
          keys = array_values('KEYS')
          scripts = array_values('SCRIPTS')
          dirs = array_values('DIRS')
          if not (len(keys) == len(scripts) == len(dirs)):
              raise SystemExit(f'KEYS/SCRIPTS/DIRS 长度不一致：{len(keys)}/{len(scripts)}/{len(dirs)}')
          mapping = list(zip(keys, scripts, dirs))
          if mapping.count(('stacher', 'stacher/build_stacher.sh', 'stacher')) != 1:
              raise SystemExit('Stacher KEYS/SCRIPTS/DIRS 映射不是唯一且一致。')
          if text.count("      - 'stacher/**'") != 1:
              raise SystemExit('Stacher push path 数量异常。')
          if text.count('          - stacher/build_stacher.sh') != 1:
              raise SystemExit('Stacher workflow_dispatch 选项数量异常。')
          if text.count('  build_stacher:') != 1:
              raise SystemExit('Stacher Job 数量异常。')
          PY

          git rm .github/workflows/test-stacher.yml
          chmod 0755 stacher/build_stacher.sh
          bash -n stacher/build_stacher.sh
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/build.yml', 'r', encoding='utf-8') as fh:
              yaml.safe_load(fh)
          print('build.yml YAML parse: OK')
          PY
          git add --chmod=+x stacher/build_stacher.sh
          git add .github/workflows/build.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/build.yml .github/workflows/test-stacher.yml stacher/build_stacher.sh

          if git diff --cached --quiet; then
            echo 'Stacher 已正式接入，无需提交。'
            exit 0
          fi
          git commit -m 'feat: add Stacher AppImage packaging'
          git push origin HEAD:main
