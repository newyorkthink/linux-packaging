name: Record migrated build validation

on:
  workflow_run:
    workflows:
      - Build AppImages
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record validation result
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          result_file=".ci-migrated-result-$HEAD_SHA"
          printf 'head_sha=%s\nconclusion=%s\nrun_id=%s\n' \
            "$HEAD_SHA" "$RESULT" "$RUN_ID" > "$result_file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$result_file"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: record migrated build validation [skip ci]'
          git push origin HEAD:main
