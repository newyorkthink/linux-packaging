name: Record migrated build validation

on:
  workflow_run:
    workflows:
      - Build AppImages
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_sha == 'e5d73442f0242ecf0dc9994f5f2b96f57d36a292'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record validation result
        shell: bash
        env:
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          printf 'head_sha=%s\nconclusion=%s\nrun_id=%s\n' \
            'e5d73442f0242ecf0dc9994f5f2b96f57d36a292' "$RESULT" "$RUN_ID" \
            > .ci-migrated-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-migrated-result
          git commit -m 'ci: record migrated build validation [skip ci]'
          git push origin HEAD:main
