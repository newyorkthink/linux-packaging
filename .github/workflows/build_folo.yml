name: Build Folo AppImage
run-name: >-
  ${{ github.event_name == 'schedule' && 'Daily build Folo AppImage' || github.event_name == 'workflow_dispatch' && 'Build Folo AppImage' || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - 'folo/**'
      - '.github/workflows/build_folo.yml'
      - '.github/actions/build-anylinux/**'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folo-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_folo:
    name: Build Folo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read
    env:
      BUILD_SCRIPT: folo/build_folo.sh
      ARTIFACT_DIR: folo/dist
      RELEASE_NAME: folo.AppImage
      RUN_FROM_ROOT: 'false'
    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Build and publish AppImage
        uses: ./.github/actions/build-anylinux
        with:
          build_script: ${{ env.BUILD_SCRIPT }}
          artifact_dir: ${{ env.ARTIFACT_DIR }}
          release_name: ${{ env.RELEASE_NAME }}
          run_from_root: ${{ env.RUN_FROM_ROOT }}
          github_token: ${{ github.token }}
