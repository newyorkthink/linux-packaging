name: Build Termux

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.tool == 'all' && 'Build all Termux tools' || format('Build {0}', inputs.tool)) || github.event_name == 'schedule' && 'Daily build all Termux tools' || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      tool:
        description: '选择要构建的脚本（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smug
          - asdf
          - micromamba
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'termux/**'
      - '!termux/**/*.md'
      - '.github/workflows/termux.yml'

permissions:
  contents: write

jobs:
  plan:
    name: Plan Tools
    runs-on: ubuntu-latest
    outputs:
      smug: ${{ steps.plan.outputs.smug }}
      asdf: ${{ steps.plan.outputs.asdf }}
      micromamba: ${{ steps.plan.outputs.micromamba }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_TOOL: ${{ inputs.tool }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_SMUG=false
          BUILD_ASDF=false
          BUILD_MICROMAMBA=false

          case "$EVENT_NAME" in
            workflow_dispatch)
              case "${SELECTED_TOOL:-all}" in
                all)
                  BUILD_SMUG=true
                  BUILD_ASDF=true
                  BUILD_MICROMAMBA=true
                  ;;
                smug) BUILD_SMUG=true ;;
                asdf) BUILD_ASDF=true ;;
                micromamba) BUILD_MICROMAMBA=true ;;
                *)
                  echo "不支持的工具：$SELECTED_TOOL" >&2
                  exit 1
                  ;;
              esac
              ;;
            push)
              # 与现有 RunImage 流程一致，根据本次提交范围选择独立 Job。
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"
              else
                CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              fi
              while IFS= read -r file; do
                case "$file" in
                  *.md) ;;
                  .github/workflows/termux.yml)
                    BUILD_SMUG=true
                    BUILD_ASDF=true
                    BUILD_MICROMAMBA=true
                    ;;
                  termux/smug/*) BUILD_SMUG=true ;;
                  termux/asdf/*) BUILD_ASDF=true ;;
                  termux/micromamba/*) BUILD_MICROMAMBA=true ;;
                esac
              done <<< "$CHANGED_FILES"
              ;;
            schedule)
              # 保留现有每日全量构建。
              BUILD_SMUG=true
              BUILD_ASDF=true
              BUILD_MICROMAMBA=true
              ;;
            *)
              echo "不支持的触发事件：$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "smug=$BUILD_SMUG" >> "$GITHUB_OUTPUT"
          echo "asdf=$BUILD_ASDF" >> "$GITHUB_OUTPUT"
          echo "micromamba=$BUILD_MICROMAMBA" >> "$GITHUB_OUTPUT"

  build-smug:
    name: Build smug
    needs: plan
    if: needs.plan.outputs.smug == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Run Build Script
        run: |
          chmod +x ./termux/smug/build.sh
          ./termux/smug/build.sh
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "latest" ./smug.termux.tar.gz --clobber || \
          gh release create "latest" ./smug.termux.tar.gz --title "Latest Build"

  build-asdf:
    name: Build asdf
    needs: plan
    if: needs.plan.outputs.asdf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Run Build Script
        run: |
          mkdir -p ./termux/asdf
          chmod +x ./termux/asdf/build.sh
          ./termux/asdf/build.sh
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "latest" ./asdf.termux.tar.gz --clobber || \
          gh release create "latest" ./asdf.termux.tar.gz --title "Latest Build"

  build-micromamba:
    name: Package micromamba for Termux PRoot
    needs: plan
    if: needs.plan.outputs.micromamba == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependency
        run: |
          # 仅在 Actions runner 安装 OCI 镜像复制工具。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Run Build Script
        run: bash ./termux/micromamba/build.sh
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "latest" ./micromamba.termux.tar.gz --clobber || \
          gh release create "latest" ./micromamba.termux.tar.gz --title "Latest Build"
