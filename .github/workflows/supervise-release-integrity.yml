# Build AppImages 完成后执行监督：全量构建首次失败时仅重跑失败 Job 一次，并检查 latest Release 完整性。
name: Supervise Release Integrity
run-name: >-
  ${{ github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.display_title, 'Release integrity repair:') && format('Verify repair for Build AppImages #{0}', github.event.workflow_run.run_number) || format('Supervise Build AppImages #{0}', github.event.workflow_run.run_number) }}

on:
  workflow_run:
    workflows: [Build AppImages]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  supervise:
    name: Supervise latest Release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      IS_REPAIR_RUN: ${{ github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.display_title, 'Release integrity repair:') }}

    steps:
      - name: Rerun failed jobs once for the first failed full build
        id: retry
        if: >-
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.run_attempt == 1 &&
          (
            (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.display_title == 'Build all AppImages') ||
            (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.display_title == 'Daily build all AppImages')
          )
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs"
          echo 'retry_started=true' >> "$GITHUB_OUTPUT"
          echo '首次全量构建存在失败 Job，已仅重新运行失败 Job 一次。'

      - name: Determine whether the completed workflow built an application
        if: steps.retry.outputs.retry_started != 'true'
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          jobs_json="$RUNNER_TEMP/source-run-jobs.json"
          jobs_error="$RUNNER_TEMP/source-run-jobs.error"
          # 只重试读取时的临时服务错误；每次清空部分响应，认证失败不重试，POST 不重复提交。
          for request_attempt in 1 2 3 4; do
            if gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=10&filter=latest" \
              > "$jobs_json" 2> "$jobs_error"; then
              break
            fi
            cat "$jobs_error" >&2
            if (( request_attempt == 4 )) || ! grep -Eq 'HTTP (500|502|503|504)' "$jobs_error"; then
              exit 1
            fi
            echo "读取构建 Job 遇到临时服务错误，重试 $request_attempt/3。" >&2
            sleep $((request_attempt * 2))
          done
          should_supervise="$(python3 - "$jobs_json" "$IS_REPAIR_RUN" <<'PY'
          import json, sys

          path, is_repair = sys.argv[1:]
          pages = json.load(open(path, encoding='utf-8'))
          jobs = [job for page in pages for job in page.get('jobs', [])]
          built = any(
              isinstance(job.get('name'), str)
              and job['name'].startswith('Build ')
              and job.get('conclusion') != 'skipped'
              for job in jobs
          )
          print('true' if built or is_repair.lower() == 'true' else 'false')
          PY
          )"
          echo "should_supervise=$should_supervise" >> "$GITHUB_OUTPUT"
          if [[ "$should_supervise" != true ]]; then
            echo '当前 Build AppImages 没有实际运行应用构建，不监督 Release。'
          fi

      - name: Summarize final AppImage build failures
        if: >-
          steps.source.outcome == 'success' &&
          (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'timed_out')
        continue-on-error: true
        shell: bash
        env:
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # 使用上一步已分页读取的 Job 数据生成失败汇总。
          python3 - "$RUNNER_TEMP/source-run-jobs.json" <<'PY'
          import html
          import json
          import os
          import sys

          def format_cell(value):
              return html.escape(' '.join(value.split())).replace('|', '&#124;')

          with open(sys.argv[1], encoding='utf-8') as source:
              jobs = [job for page in json.load(source) for job in page['jobs']]

          attempt = int(os.environ['SOURCE_RUN_ATTEMPT'])
          run_url = os.environ['SOURCE_RUN_URL']
          failed_conclusions = {'failure', 'timed_out'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              print('### AppImage 构建最终失败汇总\n', file=summary)
              print(f'[查看原构建]({run_url}) · 第 {attempt} 次运行\n', file=summary)
              if any((job.get('run_attempt') or attempt) > attempt for job in jobs):
                  print('构建已开始新一轮运行，请查看原构建的最新结果。', file=summary)
                  sys.exit(0)

              failed_jobs = [job for job in jobs if job.get('conclusion') in failed_conclusions]
              if not failed_jobs:
                  print('本次构建已失败，GitHub 未返回失败 Job。', file=summary)
                  sys.exit(0)

              print('| 任务 | 失败步骤 | 日志 |', file=summary)
              print('| --- | --- | --- |', file=summary)
              for job in failed_jobs:
                  name = format_cell(job['name'])
                  failed_steps = [
                      format_cell(step['name'])
                      for step in job.get('steps') or []
                      if step.get('conclusion') in failed_conclusions
                  ]
                  if not failed_steps:
                      fallback = '任务超时' if job['conclusion'] == 'timed_out' else '未报告失败步骤'
                      failed_steps = [fallback]
                  steps = '、'.join(failed_steps)
                  job_url = job['html_url']
                  print(f'| {name} | {steps} | [查看日志]({job_url}) |', file=summary)
          PY

      - name: Checkout repository
        if: steps.source.outputs.should_supervise == 'true'
        uses: actions/checkout@v4

      - name: Confirm latest Release integrity
        if: steps.source.outputs.should_supervise == 'true'
        id: integrity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_json="$RUNNER_TEMP/latest-release.json"
          assets_json="$RUNNER_TEMP/latest-release-assets.json"
          confirmed_assets_json="$RUNNER_TEMP/confirmed-release-assets.json"
          manifest="$RUNNER_TEMP/software_versions.json"

          # 每次请求只输出完整成功响应；资产 ID 返回 404 时交给外层重新定位。
          read_release_api() (
            local endpoint="$1" temp_dir request_attempt status
            shift
            temp_dir="$(mktemp -d)" || return 1
            trap 'rm -rf -- "$temp_dir"' EXIT
            for request_attempt in 1 2 3; do
              if LC_ALL=C gh api "$endpoint" "$@" > "$temp_dir/body" 2> "$temp_dir/error"; then
                cat "$temp_dir/body"
                return
              else
                status=$?
              fi
              printf '监督读取 API 失败：/%s（第 %s/3 次，退出码 %s）。\n' "$endpoint" "$request_attempt" "$status" >&2
              cat "$temp_dir/error" >&2
              if [[ "$endpoint" == "repos/$GITHUB_REPOSITORY/releases/assets/"* ]] &&
                 grep -Fq 'HTTP 404' "$temp_dir/error"; then
                return 44
              fi
              if (( request_attempt == 3 )) ||
                 ! grep -Eq 'HTTP (408|429|5[0-9]{2})|unexpected end of JSON input' "$temp_dir/error"; then
                return "$status"
              fi
              sleep $((request_attempt * 2))
            done
          )

          # 清单暂时缺失或摘要尚未就绪时重读；多份同名资产和无效摘要仍明确失败。
          select_manifest_row() {
            python3 - "$1" <<'PY'
          import json, re, sys

          pages = json.load(open(sys.argv[1], encoding='utf-8'))
          rows = [asset for page in pages for asset in page if asset.get('name') == 'software_versions.json']
          if len(rows) > 1:
              raise SystemExit(f'latest Release 中 software_versions.json 数量为 {len(rows)}，必须恰好为 1。')
          if not rows:
              raise SystemExit(0)
          asset_id = rows[0].get('id')
          digest = rows[0].get('digest') or ''
          if type(asset_id) is not int or asset_id <= 0:
              raise SystemExit('software_versions.json 的资产 ID 无效。')
          if not digest:
              raise SystemExit(0)
          if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
              raise SystemExit('software_versions.json 的资产摘要无效。')
          print(asset_id, digest.lower(), sep='\t')
          PY
          }

          read_release_snapshot() {
            local snapshot_attempt release_id manifest_row manifest_asset_id manifest_digest confirmed_row read_status
            for snapshot_attempt in 1 2 3 4 5; do
              # 每轮重新取得 Release 和完整资产列表，不沿用已失效的清单 ID。
              read_release_api \
                "repos/$GITHUB_REPOSITORY/releases/tags/latest?publication_read=$(date +%s%N)" \
                -H 'Cache-Control: no-cache' > "$release_json"
              release_id="$(python3 - "$release_json" <<'PY'
          import json, sys

          release_id = json.load(open(sys.argv[1], encoding='utf-8')).get('id')
          if type(release_id) is not int or release_id <= 0:
              raise SystemExit('无法取得 latest Release ID。')
          print(release_id)
          PY
              )"
              read_release_api \
                "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
                -H 'Cache-Control: no-cache' --paginate --slurp > "$assets_json"
              manifest_row="$(select_manifest_row "$assets_json")"
              if [[ -n "$manifest_row" ]]; then
                IFS=$'\t' read -r manifest_asset_id manifest_digest <<< "$manifest_row"
                printf '监督读取清单：ID=%s（第 %s/5 轮）。\n' "$manifest_asset_id" "$snapshot_attempt" >&2
                # 只下载本轮定位的 ID，404 后进入下一轮重新获取列表。
                if read_release_api \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id?publication_read=$(date +%s%N)" \
                  -H 'Cache-Control: no-cache' -H 'Accept: application/octet-stream' > "$manifest"; then
                  if [[ "sha256:$(sha256sum "$manifest" | awk '{print tolower($1)}')" == "$manifest_digest" ]]; then
                    # 下载完成后再次确认同一资产 ID 和摘要，避免把已变化的清单交给监督。
                    read_release_api \
                      "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
                      -H 'Cache-Control: no-cache' --paginate --slurp > "$confirmed_assets_json"
                    confirmed_row="$(select_manifest_row "$confirmed_assets_json")"
                    if [[ "$confirmed_row" == "$manifest_row" ]]; then
                      mv "$confirmed_assets_json" "$assets_json"
                      return 0
                    fi
                    echo '监督读取期间清单已变化，重新定位。' >&2
                  else
                    echo '监督读取的清单内容与资产摘要不一致，重新定位。' >&2
                  fi
                else
                  read_status=$?
                  [[ "$read_status" == 44 ]] || exit "$read_status"
                fi
              else
                printf '监督暂未取得唯一且带有效摘要的清单（第 %s/5 轮），等待重新定位。\n' "$snapshot_attempt" >&2
              fi
              if (( snapshot_attempt < 5 )); then
                sleep 2
              fi
            done
            echo '五轮内无法取得有效且稳定的版本清单快照，停止监督，禁止使用空清单或部分响应。' >&2
            return 1
          }

          # 有差异时只检查正在执行的构建。无法识别的构建名称按仍可能发布处理。
          related_build_running() {
            local repair_keys="$1" run_ids run_id status
            local runs="$RUNNER_TEMP/active-appimage-runs.json"
            local jobs="$RUNNER_TEMP/active-appimage-jobs.json"
            read_release_api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=in_progress&per_page=100" \
              -H 'Cache-Control: no-cache' --paginate --slurp > "$runs" || return $?
            run_ids="$(jq -r '.[].workflow_runs[].id' "$runs")" || return $?
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              read_release_api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100&filter=latest" \
                -H 'Cache-Control: no-cache' --paginate --slurp > "$jobs" || return $?
              if jq -e --argjson keys "$repair_keys" --slurpfile catalog .github/appimage-apps.json '
                ($catalog[0].apps | map("Build " + .name)) as $known
                | ($catalog[0].apps | map(select(.key as $key | $keys | index($key)) | "Build " + .name)) as $targets
                | any(.[].jobs[]; . as $job
                    | $job.status != "completed"
                      and ($job.name | startswith("Build "))
                      and (($targets | index($job.name)) != null or ($known | index($job.name)) == null))
              ' "$jobs" > /dev/null; then
                printf 'true\n'
                return 0
              else
                status=$?
                [[ "$status" == 1 ]] || return "$status"
              fi
            done <<< "$run_ids"
            printf 'false\n'
          }

          # 两次读取仍报告同一组异常，且中间未发现对应应用正在发布，才允许自愈。
          result="$RUNNER_TEMP/release-integrity-result.txt"
          summary="$RUNNER_TEMP/release-integrity-summary.md"
          confirmed=false
          build_running=false
          for confirmation_attempt in 1 2 3; do
            read_release_snapshot
            : > "$result"
            : > "$summary"
            GITHUB_OUTPUT="$result" GITHUB_STEP_SUMMARY="$summary" \
              python3 .github/scripts/supervise_release_integrity.py \
                --manifest "$manifest" --assets "$assets_json" --catalog .github/appimage-apps.json
            if ! grep -Fxq 'has_mismatches=true' "$result"; then
              confirmed=true
              build_running=false
              break
            fi
            if (( confirmation_attempt > 1 )) && cmp -s "$result" "$result.previous" && \
              cmp -s "$summary" "$summary.previous"; then
              confirmed=true
              break
            fi
            if (( confirmation_attempt == 3 )); then
              break
            fi
            cp "$result" "$result.previous"
            cp "$summary" "$summary.previous"
            build_running=false
            if grep -Fxq 'repairable=true' "$result"; then
              repair_keys="$(sed -n 's/^repair_keys=//p' "$result")"
              build_running="$(related_build_running "$repair_keys")"
            fi
            sleep 2
          done
          cat "$result" >> "$GITHUB_OUTPUT"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$confirmed" != true || "$build_running" == true ]]; then
            echo 'repair_deferred=true' >> "$GITHUB_OUTPUT"
            echo '对应构建仍在执行或异常尚未稳定，本次暂缓自愈。'
          fi

      - name: Start one repair build for mismatched applications
        if: >-
          steps.source.outputs.should_supervise == 'true' &&
          steps.integrity.outputs.has_mismatches == 'true' &&
          steps.integrity.outputs.repair_deferred != 'true' &&
          steps.integrity.outputs.repairable == 'true' &&
          env.IS_REPAIR_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_KEYS: ${{ steps.integrity.outputs.repair_keys }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            -f ref=main \
            -F 'inputs[release_integrity_repair]=true' \
            -f "inputs[release_integrity_keys]=$REPAIR_KEYS"
          echo "已触发一次完整性自愈，仅重新构建：$REPAIR_KEYS"

      - name: Fail when mismatches cannot be mapped safely
        if: >-
          steps.source.outputs.should_supervise == 'true' &&
          steps.integrity.outputs.has_mismatches == 'true' &&
          steps.integrity.outputs.repair_deferred != 'true' &&
          steps.integrity.outputs.repairable != 'true'
        shell: bash
        run: |
          echo 'Release 完整性异常无法安全映射到唯一构建，禁止自动扩大重跑范围。' >&2
          exit 1

      - name: Fail after the only repair attempt
        if: >-
          steps.source.outputs.should_supervise == 'true' &&
          steps.integrity.outputs.has_mismatches == 'true' &&
          steps.integrity.outputs.repair_deferred != 'true' &&
          steps.integrity.outputs.repairable == 'true' &&
          env.IS_REPAIR_RUN == 'true'
        shell: bash
        run: |
          echo '自动修复一次后 Release 完整性仍然异常，禁止继续循环重跑。' >&2
          exit 1
