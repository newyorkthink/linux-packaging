name: Migrate Selected AppImages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-selected-appimages.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/anylinux_appimage
          git clone --depth=1 https://github.com/newyorkthink/anylinux_appimage.git /tmp/anylinux_appimage

      - name: Audit selected files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/anylinux_appimage

          SELECTED=(
            build_copyq.sh
            build_flameshot.sh
            build_goldendict-ng.sh
            build_htop.sh
            build_i3wm.sh
            build_keepassxc.sh
            build_kitty.sh
            build_mpv.sh
            build_nvtop.sh
            build_ripdrag.sh
            build_smplayer.sh
            build_sunshine.sh
            alacritty
            Keyviz
            freerdp
            newsboat
            remmina
          )

          SECRET_RE='-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}'
          if grep -RInE --binary-files=without-match -- "$SECRET_RE" "${SELECTED[@]}"; then
            echo '检测到疑似密钥或访问令牌，停止迁移。' >&2
            exit 1
          fi

          echo '高置信度密钥扫描通过。'

      - name: Copy selected projects
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/anylinux_appimage

          for file in \
            build_copyq.sh \
            build_flameshot.sh \
            build_goldendict-ng.sh \
            build_htop.sh \
            build_i3wm.sh \
            build_keepassxc.sh \
            build_kitty.sh \
            build_mpv.sh \
            build_nvtop.sh \
            build_ripdrag.sh \
            build_smplayer.sh \
            build_sunshine.sh
          do
            cp -a "$SRC/$file" "./$file"
          done

          for dir in alacritty Keyviz freerdp newsboat remmina; do
            rm -rf "./$dir"
            cp -a "$SRC/$dir" "./$dir"
          done

          git diff --quiet HEAD -- antigravity-ide antigravity cc-switch

      - name: Integrate migrated builds into existing workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '# 统一 AppImage 构建入口；四个项目使用独立 Job 并行构建，产物发布到固定 latest Release。',
              '# 统一 AppImage 构建入口；各项目使用独立 Job / Matrix Job 并行构建，产物发布到固定 latest Release。',
              'header',
          )

          replace_once(
              "      github.event_name == 'schedule' && 'Check upstream updates' ||",
              "      github.event_name == 'schedule' && (github.event.schedule == '0 16 2 * *' && 'Scheduled migrated AppImages' || 'Check upstream updates') ||",
              'run-name schedule',
          )

          replace_once(
              "      - 'zen/**'\n      - '.github/workflows/build.yml'",
              "      - 'zen/**'\n      - 'build_*.sh'\n      - 'alacritty/**'\n      - 'Keyviz/**'\n      - 'freerdp/**'\n      - 'newsboat/**'\n      - 'remmina/**'\n      - '.github/workflows/build.yml'",
              'push paths',
          )

          replace_once(
              "  schedule:\n    - cron: '17 */6 * * *'",
              "  schedule:\n    - cron: '17 */6 * * *'\n    - cron: '0 16 2 * *'",
              'schedule',
          )

          replace_once(
              "          - zen/build_zen.sh",
              "          - zen/build_zen.sh\n          - build_copyq.sh\n          - build_flameshot.sh\n          - build_goldendict-ng.sh\n          - build_htop.sh\n          - build_i3wm.sh\n          - build_keepassxc.sh\n          - build_kitty.sh\n          - build_mpv.sh\n          - build_nvtop.sh\n          - build_ripdrag.sh\n          - build_smplayer.sh\n          - build_sunshine.sh\n          - alacritty/build_alacritty_linuxdeploy.sh\n          - Keyviz/build_keyviz.sh\n          - freerdp/build_freerdp.sh\n          - newsboat/build_newsboat.sh\n          - remmina/build_remmina.sh",
              'dispatch options',
          )

          old_unknown = '''                *)
                  echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2
                  exit 1
                  ;;
'''
          new_unknown = '''                build_copyq.sh|build_flameshot.sh|build_goldendict-ng.sh|build_htop.sh|build_i3wm.sh|build_keepassxc.sh|build_kitty.sh|build_mpv.sh|build_nvtop.sh|build_ripdrag.sh|build_smplayer.sh|build_sunshine.sh|alacritty/build_alacritty_linuxdeploy.sh|Keyviz/build_keyviz.sh|freerdp/build_freerdp.sh|newsboat/build_newsboat.sh|remmina/build_remmina.sh)
                  # 迁移项目由 migrated_plan 处理；现有四个项目保持不构建。
                  ;;
                *)
                  echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2
                  exit 1
                  ;;
'''
          replace_once(old_unknown, new_unknown, 'existing plan migrated choices')

          migrated_plan = r'''
  migrated_plan:
    name: Plan Migrated Apps
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      arch_build: ${{ steps.plan.outputs.arch_build }}
      arch_matrix: ${{ steps.plan.outputs.arch_matrix }}
      alacritty: ${{ steps.plan.outputs.alacritty }}
      remmina: ${{ steps.plan.outputs.remmina }}
      keyviz: ${{ steps.plan.outputs.keyviz }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select migrated build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SCRIPT: ${{ inputs.script_to_build }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          ARCH_SCRIPTS=(
            build_copyq.sh
            build_flameshot.sh
            build_goldendict-ng.sh
            build_htop.sh
            build_i3wm.sh
            build_keepassxc.sh
            build_kitty.sh
            build_mpv.sh
            build_nvtop.sh
            build_ripdrag.sh
            build_smplayer.sh
            build_sunshine.sh
            freerdp/build_freerdp.sh
            newsboat/build_newsboat.sh
          )

          ARCH_SELECTED=()
          ALACRITTY_BUILD=false
          REMMINA_BUILD=false
          KEYVIZ_BUILD=false

          add_arch() {
            local wanted="$1"
            local item
            for item in "${ARCH_SELECTED[@]:-}"; do
              if [[ "$item" == "$wanted" ]]; then
                return 0
              fi
            done
            ARCH_SELECTED+=("$wanted")
          }

          select_all_migrated() {
            local script
            for script in "${ARCH_SCRIPTS[@]}"; do
              add_arch "$script"
            done
            ALACRITTY_BUILD=true
            REMMINA_BUILD=true
            KEYVIZ_BUILD=true
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              case "${SELECTED_SCRIPT:-all}" in
                all)
                  select_all_migrated
                  ;;
                build_copyq.sh|build_flameshot.sh|build_goldendict-ng.sh|build_htop.sh|build_i3wm.sh|build_keepassxc.sh|build_kitty.sh|build_mpv.sh|build_nvtop.sh|build_ripdrag.sh|build_smplayer.sh|build_sunshine.sh|freerdp/build_freerdp.sh|newsboat/build_newsboat.sh)
                  add_arch "$SELECTED_SCRIPT"
                  ;;
                alacritty/build_alacritty_linuxdeploy.sh)
                  ALACRITTY_BUILD=true
                  ;;
                remmina/build_remmina.sh)
                  REMMINA_BUILD=true
                  ;;
                Keyviz/build_keyviz.sh)
                  KEYVIZ_BUILD=true
                  ;;
                antigravity-ide/build_antigravity-ide.sh|antigravity/build_antigravity.sh|cc-switch/build_cc-switch.sh|zen/build_zen.sh)
                  ;;
                *)
                  echo "指定的脚本不存在：${SELECTED_SCRIPT:-}" >&2
                  exit 1
                  ;;
              esac
              ;;

            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] ||
                 ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git show --pretty='' --name-only "$AFTER_SHA")"
              else
                CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
              fi

              printf '%s\n' "$CHANGED_FILES"

              if grep -Fxq '.github/workflows/build.yml' <<< "$CHANGED_FILES"; then
                select_all_migrated
              else
                for script in "${ARCH_SCRIPTS[@]}"; do
                  case "$script" in
                    freerdp/build_freerdp.sh)
                      grep -Eq '^freerdp/' <<< "$CHANGED_FILES" && add_arch "$script"
                      ;;
                    newsboat/build_newsboat.sh)
                      grep -Eq '^newsboat/' <<< "$CHANGED_FILES" && add_arch "$script"
                      ;;
                    *)
                      grep -Fxq "$script" <<< "$CHANGED_FILES" && add_arch "$script"
                      ;;
                  esac
                done

                grep -Eq '^alacritty/' <<< "$CHANGED_FILES" && ALACRITTY_BUILD=true
                grep -Eq '^remmina/' <<< "$CHANGED_FILES" && REMMINA_BUILD=true
                grep -Eq '^Keyviz/' <<< "$CHANGED_FILES" && KEYVIZ_BUILD=true
              fi
              ;;

            schedule)
              if [[ "$SCHEDULE_EXPR" == '0 16 2 * *' ]]; then
                select_all_migrated
              fi
              ;;

            *)
              echo "不支持的触发事件：$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          ARCH_BUILD=false
          ARCH_MATRIX='["__none__"]'
          if (( ${#ARCH_SELECTED[@]} > 0 )); then
            ARCH_BUILD=true
            ARCH_MATRIX="$(printf '%s\n' "${ARCH_SELECTED[@]}" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          fi

          SHOULD_BUILD=false
          if [[ "$ARCH_BUILD" == true || "$ALACRITTY_BUILD" == true || "$REMMINA_BUILD" == true || "$KEYVIZ_BUILD" == true ]]; then
            SHOULD_BUILD=true
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "arch_build=$ARCH_BUILD" >> "$GITHUB_OUTPUT"
          echo "arch_matrix=$ARCH_MATRIX" >> "$GITHUB_OUTPUT"
          echo "alacritty=$ALACRITTY_BUILD" >> "$GITHUB_OUTPUT"
          echo "remmina=$REMMINA_BUILD" >> "$GITHUB_OUTPUT"
          echo "keyviz=$KEYVIZ_BUILD" >> "$GITHUB_OUTPUT"

      - name: Create or Update Latest Release
        if: steps.plan.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG='latest'

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'latest' \
              --notes 'latest' \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'latest' \
              --notes 'latest' \
              --latest
          fi

'''
          replace_once('\n  build_antigravity_ide:\n', '\n' + migrated_plan + '  build_antigravity_ide:\n', 'migrated plan insertion')

          migrated_jobs = r'''
  build_migrated_arch:
    name: Build ${{ matrix.script }}
    needs: migrated_plan
    if: needs.migrated_plan.outputs.arch_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.migrated_plan.outputs.arch_matrix) }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d # v1

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo pacman -Syu --noconfirm github-cli || yay -S --noconfirm github-cli

      - name: Build and publish AppImage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          chmod +x "$SCRIPT"
          "./$SCRIPT"

          SCRIPT_DIR="$(dirname "$SCRIPT")"
          ARTIFACT_DIR='dist'
          if [[ "$SCRIPT_DIR" != '.' && -d "$SCRIPT_DIR/dist" ]]; then
            ARTIFACT_DIR="$SCRIPT_DIR/dist"
          fi

          shopt -s nullglob
          ARTIFACTS=("$ARTIFACT_DIR"/*.AppImage)
          shopt -u nullglob
          if (( ${#ARTIFACTS[@]} == 0 )); then
            echo "构建完成，但 $ARTIFACT_DIR 中没有 AppImage。" >&2
            exit 1
          fi

          gh release upload latest "${ARTIFACTS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_alacritty:
    name: Build Alacritty
    needs: migrated_plan
    if: needs.migrated_plan.outputs.alacritty == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Alacritty AppImage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x alacritty/build_alacritty_linuxdeploy.sh
          env -u GITHUB_ACTIONS ./alacritty/build_alacritty_linuxdeploy.sh
          test -s alacritty/dist/alacritty.AppImage

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload latest alacritty/dist/alacritty.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_remmina:
    name: Build Remmina
    needs: migrated_plan
    if: needs.migrated_plan.outputs.remmina == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Remmina AppImage
        shell: bash
        run: |
          set +e
          chmod +x remmina/build_remmina.sh
          env -u GITHUB_ACTIONS ./remmina/build_remmina.sh > build-remmina.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo '===== build-remmina.log 最后 300 行 ====='
            tail -n 300 build-remmina.log
            exit "$status"
          fi
          tail -n 120 build-remmina.log

      - name: Fix WebKitGTK and desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fcitx5-frontend-gtk3 \
            ibus-gtk3 \
            libgtk-3-bin
          chmod +x remmina/fix_remmina_webkit.sh
          ./remmina/fix_remmina_webkit.sh dist/remmina.AppImage

      - name: Validate and publish Remmina AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s remmina/dist/remmina.AppImage
          chmod +x remmina/dist/remmina.AppImage
          file remmina/dist/remmina.AppImage
          gh release delete-asset latest remmina-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release delete-asset latest remmina-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --yes >/dev/null 2>&1 || true
          gh release upload latest remmina/dist/remmina.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build_keyviz:
    name: Build Keyviz
    needs: migrated_plan
    if: needs.migrated_plan.outputs.keyviz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Pre-install Git
        run: pacman -Sy --noconfirm git

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparing anylinux Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Setup Yay for Root execution
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd -m -G wheel builduser || true
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          for attempt in 1 2 3; do
            rm -rf /tmp/yay-bin
            if su - builduser -c "git -c http.version=HTTP/1.1 clone --depth=1 https://aur.archlinux.org/yay-bin.git /tmp/yay-bin"; then
              break
            fi
            sleep 5
          done
          test -f /tmp/yay-bin/PKGBUILD
          su - builduser -c "cd /tmp/yay-bin && makepkg -si --noconfirm"
          printf '%s\n' '#!/bin/bash' 'sudo -HE -u builduser /usr/bin/yay "$@"' > /usr/local/bin/yay
          chmod +x /usr/local/bin/yay

      - name: Build and validate Keyviz AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n Keyviz/build_keyviz.sh
          bash Keyviz/build_keyviz.sh
          test -s dist/keyviz.AppImage

      - name: Publish to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -S --noconfirm --needed github-cli
          gh release upload latest dist/keyviz.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

'''
          replace_once('\n  update_upstream_state:\n', '\n' + migrated_jobs + '  update_upstream_state:\n', 'migrated jobs insertion')

          path.write_text(text)
          PY

      - name: Validate workflow and migration diff
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/build.yml').read_text())
          if not isinstance(data, dict):
              raise SystemExit('workflow YAML did not parse to a mapping')
          PY

          git diff --check
          git diff --quiet HEAD -- antigravity-ide antigravity cc-switch

          for path in \
            build_copyq.sh \
            build_flameshot.sh \
            build_goldendict-ng.sh \
            build_htop.sh \
            build_i3wm.sh \
            build_keepassxc.sh \
            build_kitty.sh \
            build_mpv.sh \
            build_nvtop.sh \
            build_ripdrag.sh \
            build_smplayer.sh \
            build_sunshine.sh \
            alacritty/build_alacritty_linuxdeploy.sh \
            Keyviz/build_keyviz.sh \
            freerdp/build_freerdp.sh \
            newsboat/build_newsboat.sh \
            remmina/build_remmina.sh \
            remmina/fix_remmina_webkit.sh
          do
            test -s "$path"
          done

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/build.yml \
            build_copyq.sh \
            build_flameshot.sh \
            build_goldendict-ng.sh \
            build_htop.sh \
            build_i3wm.sh \
            build_keepassxc.sh \
            build_kitty.sh \
            build_mpv.sh \
            build_nvtop.sh \
            build_ripdrag.sh \
            build_smplayer.sh \
            build_sunshine.sh \
            alacritty Keyviz freerdp newsboat remmina
          git commit -m 'migrate: import selected AppImage builds'
          git push origin HEAD:main

      - name: Start full validation build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f script_to_build=all
