name: Migrate Selected AppImages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-selected-appimages.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/anylinux_appimage
          git clone --depth=1 https://github.com/newyorkthink/anylinux_appimage.git /tmp/anylinux_appimage

      - name: Audit selected files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/anylinux_appimage

          SELECTED=(
            build_copyq.sh
            build_flameshot.sh
            build_goldendict-ng.sh
            build_htop.sh
            build_i3wm.sh
            build_keepassxc.sh
            build_kitty.sh
            build_mpv.sh
            build_nvtop.sh
            build_ripdrag.sh
            build_smplayer.sh
            build_sunshine.sh
            alacritty
            Keyviz
            freerdp
            newsboat
            remmina
          )

          SECRET_RE='-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}'
          if grep -RInE --binary-files=without-match -- "$SECRET_RE" "${SELECTED[@]}"; then
            echo '检测到疑似密钥或访问令牌，停止迁移。' >&2
            exit 1
          fi

          echo '高置信度密钥扫描通过。'

      - name: Copy selected projects
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/anylinux_appimage

          for file in \
            build_copyq.sh \
            build_flameshot.sh \
            build_goldendict-ng.sh \
            build_htop.sh \
            build_i3wm.sh \
            build_keepassxc.sh \
            build_kitty.sh \
            build_mpv.sh \
            build_nvtop.sh \
            build_ripdrag.sh \
            build_smplayer.sh \
            build_sunshine.sh
          do
            cp -a "$SRC/$file" "./$file"
          done

          for dir in alacritty Keyviz freerdp newsboat remmina; do
            rm -rf "./$dir"
            cp -a "$SRC/$dir" "./$dir"
          done

          git diff --quiet HEAD -- antigravity-ide antigravity cc-switch
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            build_copyq.sh \
            build_flameshot.sh \
            build_goldendict-ng.sh \
            build_htop.sh \
            build_i3wm.sh \
            build_keepassxc.sh \
            build_kitty.sh \
            build_mpv.sh \
            build_nvtop.sh \
            build_ripdrag.sh \
            build_smplayer.sh \
            build_sunshine.sh \
            alacritty Keyviz freerdp newsboat remmina

          if git diff --cached --quiet; then
            echo '迁移文件已是最新状态。'
            exit 0
          fi

          git commit -m 'migrate: import selected AppImage builds'
          git push origin HEAD:main
