# 被 build.yml 调用。标准 Arch 应用的 matrix 放在这里，避免主 workflow 图横向铺开 50+ 个节点。
# 每个 matrix 组合仍是独立 runner；完成后立即写入 software_versions.json。
name: Build standard AppImages

on:
  workflow_call:
    inputs:
      matrix-json:
        description: Plan 输出的 matrix JSON（含 include）
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix-json) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
      packages: read
    env:
      BUILD_SCRIPT: ${{ matrix.script }}
      ARTIFACT_DIR: ${{ matrix.artifact_dir }}
      RELEASE_NAME: ${{ matrix.release_name }}
      RUN_FROM_ROOT: ${{ matrix.run_from_root }}
      SOFTWARE_KEY: ${{ matrix.software_key }}
    steps:
      - {name: Pre-install Git, run: 'pacman -Sy --noconfirm git'}
      - {name: Checkout Code, uses: 'actions/checkout@v4', with: {fetch-depth: 0}}
      - {name: Preparing Container, uses: 'pkgforge-dev/anylinux-setup-action@8872fabe63f9a00b35e25b2f46da62a05afc9a7d'} # v1
      - name: Build and publish AppImage
        uses: ./.github/actions/build-anylinux
        with: {build_script: '${{ env.BUILD_SCRIPT }}', artifact_dir: '${{ env.ARTIFACT_DIR }}', release_name: '${{ env.RELEASE_NAME }}', run_from_root: '${{ env.RUN_FROM_ROOT }}', github_token: '${{ github.token }}'}
      - name: Prepare software version metadata
        if: env.SOFTWARE_KEY != '' && env.SOFTWARE_VERSION_SOURCE != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -s "${SOFTWARE_VERSION_SOURCE}" ]] || {
            echo "版本元数据源文件不存在或为空：${SOFTWARE_VERSION_SOURCE}" >&2
            exit 1
          }
          version="$(
            awk -F= '$1 == "version" {sub(/^[^=]*=/, ""); print; exit}' "${SOFTWARE_VERSION_SOURCE}"
          )"
          [[ -n "${version}" ]] || {
            echo "无法从 ${SOFTWARE_VERSION_SOURCE} 解析 version=。" >&2
            exit 1
          }
          printf '%s\n' "${version}" > "${ARTIFACT_DIR}/version.txt"

      - name: Upload software version metadata
        if: env.SOFTWARE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: software-version-${{ env.SOFTWARE_KEY }}
          path: ${{ env.ARTIFACT_DIR }}/version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish software version immediately
        if: env.SOFTWARE_KEY != ''
        uses: ./.github/actions/publish-software-versions
        with:
          software_key: ${{ env.SOFTWARE_KEY }}
          version_file: ${{ env.ARTIFACT_DIR }}/version.txt
          asset_name: ${{ env.RELEASE_NAME }}
          artifact_dir: ${{ env.ARTIFACT_DIR }}
          github_token: ${{ github.token }}
